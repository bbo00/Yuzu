<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>390×844 검증 하네스 (임시)</title>
<style>
  html,body{margin:0;background:#e9e3da;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;color:#4a3f35}
  .bar button{padding:8px 12px;border-radius:9px;border:1px solid #c9bfb3;background:#fffdfa;font-size:12px;font-weight:700;color:#8d5a45}
  .bar .st{font-size:11px;color:#6b5c4d}
  .frame{width:390px;height:844px;overflow:hidden;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  iframe{width:390px;height:844px;border:0;display:block;background:#fff}
</style></head>
<body>
<div class="bar">
  <button id="b1">🎤 발화1(중간)</button>
  <button id="b2">🎤 발화2(확정)</button>
  <span class="st" id="st">mode …</span>
</div>
<div class="frame"><iframe id="f" title="blog notebook" width="390" height="844"></iframe></div>
<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'mock';
const prelude = [
'<script>(function(){',
'  var mem={}, errors=[]; window.__testErr=errors;',
'  var ce=console.error.bind(console);',
'  console.error=function(){ errors.push("console.error: "+Array.prototype.slice.call(arguments).join(" ")); ce.apply(null, arguments); };',
'  window.addEventListener("error", function(e){ errors.push("error: "+(e.message||"")); });',
'  window.addEventListener("unhandledrejection", function(e){ errors.push("rejection: "+((e.reason&&e.reason.message)||e.reason)); });',
'  var fake={getItem:function(k){return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;},setItem:function(k,v){mem[k]=String(v);},removeItem:function(k){delete mem[k];},clear:function(){mem={};},key:function(i){return Object.keys(mem)[i]||null;}};',
'  Object.defineProperty(fake,"length",{get:function(){return Object.keys(mem).length;}});',
'  Object.defineProperty(window,"localStorage",{configurable:true,get:function(){return fake;}});',
'  window.fetch=function(){ return Promise.reject(new Error("test-offline")); };',
'  var XO=window.XMLHttpRequest; window.XMLHttpRequest=function(){ throw new Error("test-offline"); };',
'  if (window.__MODE__ === "nosr") {',
'    try { delete window.SpeechRecognition; } catch(e){}',
'    try { delete window.webkitSpeechRecognition; } catch(e){}',
'    window.SpeechRecognition=undefined; window.webkitSpeechRecognition=undefined;',
'  } else {',
'    function MockSR(){ this.lang=""; this.continuous=false; this.interimResults=false; this.maxAlternatives=1; this._r=false; window.__sr=this; }',
'    MockSR.prototype.start=function(){ if(this._r) throw new Error("InvalidStateError"); this._r=true; window.__srState="started"; };',
'    MockSR.prototype.stop=function(){ this._r=false; window.__srState="stopped"; var cb=this.onend; if(cb) setTimeout(function(){cb({type:"end"});},0); };',
'    MockSR.prototype.abort=function(){ this._r=false; window.__srState="aborted"; };',
'    window.SpeechRecognition=MockSR; window.webkitSpeechRecognition=MockSR;',
'    window.__emit=function(segs){ var results=segs.map(function(s){ var r=[{transcript:s.text, confidence:0.9}]; r.isFinal=!!s.final; return r; }); results.item=function(i){return results[i];}; if(window.__sr&&window.__sr.onresult) window.__sr.onresult({type:"result",resultIndex:0,results:results}); };',
'  }',
'})();<\/script>'
].join('\n').replace('__MODE__', MODE);

const frame = document.getElementById('f');
const st = document.getElementById('st');
fetch('./index.html', { cache: 'no-store' }).then(r => r.text()).then(html => {
  const doc = html.replace(/<head([^>]*)>/i, '<head$1>' + prelude);
  frame.srcdoc = doc;
  st.textContent = 'mode=' + MODE + ' · app=' + doc.length + 'B';
}).catch(e => { st.textContent = 'ERR ' + e; });

function emit(segs) {
  try { frame.contentWindow.__emit(segs); } catch (e) { st.textContent = 'emit err: ' + e; }
}
document.getElementById('b1').addEventListener('click', function () {
  emit([{ text: '건물 뒤편 15대 무료 주차,', final: false }]);
});
document.getElementById('b2').addEventListener('click', function () {
  emit([{ text: '망포역 2번 출구 도보 5분 거리예요.', final: true }]);
});
</script>
</body></html>
