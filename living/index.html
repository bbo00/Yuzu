<!doctype html><html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 살림칸 공유</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="우리 살림칸 · 생활용품 재고와 소비기한을 함께 보는 개인용 목록">
<meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 살림칸">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>[hidden]:not([hidden="until-found"]){display:none!important}</style>
<style id="pagecss">
/* Layout: 한 줄 요약(기한 지남·30일·90일) → 고정 탭과 보기 전환 → 분류별/기한순 목록. 부부가 같은 목록을 함께 고친다. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --surface-2: #f4f7f4;
  --ink: #1b2622;
  --ink-2: #5b6b64;
  --line: #dce3dd;
  --accent: #2d6a57;
  --accent-ink: #ffffff;
  --accent-soft: #ddebe4;
  --c2: #3d6f9e;
  --warn: #8a5a00;
  --warn-soft: #fbebc8;
  --bad: #b23a2b;
  --bad-soft: #f8ddd8;
  --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1512; --surface: #17201c; --surface-2: #1d2823; --ink: #e6eee9; --ink-2: #9daea5;
    --line: #2a3731; --accent: #6cc3a6; --accent-ink: #0b1511; --accent-soft: #1f3a31; --c2: #7fb0e0;
    --warn: #f0c26a; --warn-soft: #3a2e12; --bad: #f19a8c; --bad-soft: #3e1e19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1512; --surface: #17201c; --surface-2: #1d2823; --ink: #e6eee9; --ink-2: #9daea5;
  --line: #2a3731; --accent: #6cc3a6; --accent-ink: #0b1511; --accent-soft: #1f3a31; --c2: #7fb0e0;
  --warn: #f0c26a; --warn-soft: #3a2e12; --bad: #f19a8c; --bad-soft: #3e1e19;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.app { max-width: 680px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { padding-top: 24px; display: grid; gap: 10px; }
.topbtns { display: flex; gap: 8px; flex: none; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: -0.01em; line-height: 1.2; }
.glance { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; color: var(--ink-2); font-size: 14px; }
.glance b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.glance .hot b { color: var(--bad); }
.glance .soon b { color: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; line-height: 1.2; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: transparent; background: transparent; }
.btn.sm { min-height: 36px; padding: 7px 11px; font-size: 14px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 14px 0 10px; display: grid; gap: 10px; }
.tabs, .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.tabs { grid-template-columns: repeat(3, 1fr); }
.tab, .segb { border: 0; background: transparent; border-radius: 9px; padding: 9px 8px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.segb { padding: 9px 12px; font-size: 14px; }
.tab[aria-selected="true"], .segb[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.badge { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 0 7px; line-height: 18px; min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; align-items: center; }
.tools .search { flex: 1 1 0; min-width: 0; }
.tools .seg { flex: none; }

input, select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 16px; min-height: 42px; min-width: 0; width: 100%; }
input::placeholder { color: var(--ink-2); opacity: .8; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.stickwrap .chips { padding: 2px 0 8px; }
.subchips .chip { min-height: 32px; font-size: 13px; padding: 4px 10px; }
.stickwrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 120px)); z-index: 4; background: var(--bg); margin-top: -2px; padding-top: 6px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--ink-2); min-height: 36px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 700; }
.chip small { font-size: 12px; margin-left: 4px; opacity: .8; font-variant-numeric: tabular-nums; }

.group { margin: 0 0 18px; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 6px; font-size: 13px; color: var(--ink-2); }
.ghead h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--ink); }
.rows { margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { border-top: 1px solid var(--line); }
.rows > :first-child { border-top: 0; }
.subh { display: flex; justify-content: space-between; padding: 6px 14px; font-size: 13px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-top: 1px solid var(--line); }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 10px 6px 14px; }
.name { border: 0; background: none; text-align: left; padding: 6px 0; min-width: 0; display: grid; gap: 2px; }
.nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.memo { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.pill { border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 700; line-height: 20px; }
.pill.out { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); line-height: 18px; }
.pill.expbad { background: var(--bad-soft); color: var(--bad); }
.pill.expsoon { background: var(--warn-soft); color: var(--warn); }
.dim .nm, .dim .meta { opacity: .55; }
.step { display: flex; align-items: center; gap: 2px; }
.step button { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; line-height: 1; padding: 0; }
.q { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.q b { font-size: 18px; }
.q i { font-style: normal; font-size: 12px; color: var(--ink-2); margin-left: 1px; }

.edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 14px 14px; background: var(--surface-2); border-top: 1px dashed var(--line); }
.edit label, .add label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.wide { grid-column: 1 / -1; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }

.note { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; }
.note span { flex: 1 1 200px; }
.empty { color: var(--ink-2); text-align: center; padding: 28px 12px; margin: 0; }

.quick { display: grid; grid-template-columns: minmax(0, 1fr) 72px auto; gap: 8px; margin-bottom: 14px; }
.sugg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
.sugg h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sugg ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.sugg li button { border: 1px dashed var(--accent); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; min-height: 36px; }
.shop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 6px 6px 6px 10px; }
.chk { width: 40px; height: 40px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.chk span { width: 24px; height: 24px; border: 2px solid var(--ink-2); border-radius: 8px; display: grid; place-items: center; color: transparent; }
.chk[aria-checked="true"] span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.shop.done .nm { text-decoration: line-through; color: var(--ink-2); font-weight: 400; }
.shop .step button { width: 36px; height: 36px; }
.x { border: 0; background: none; width: 36px; height: 36px; font-size: 20px; color: var(--ink-2); padding: 0; }
.donebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 2px 0; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }

.pill.tag { background: var(--accent-soft); color: var(--accent); }
.gsub { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gsub .seg { flex: 1 1 150px; max-width: 260px; }
.sale { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px 8px 14px; }
.sinfo { min-width: 0; display: grid; gap: 2px; }
.calc { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.profit { font-weight: 700; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.profit.neg { color: var(--bad); }
.sale .acts { grid-column: 1 / -1; justify-content: flex-end; }
.sell { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.sell label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 0 18px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile span { font-size: 13px; color: var(--ink-2); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile small { font-size: 12px; color: var(--ink-2); }
.tile.hot { background: var(--bad-soft); border-color: transparent; }
.tile.hot b, .tile.hot span { color: var(--bad); }
.tile.soon { background: var(--warn-soft); border-color: transparent; }
.tile.soon b, .tile.soon span { color: var(--warn); }
.dsec { margin: 0 0 22px; }
.dsec > h2 { margin: 0 2px 8px; font-family: var(--font-display); font-weight: 400; font-size: 19px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dsec > h2 small { font-family: var(--font-body); font-size: 13px; color: var(--ink-2); }
.urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 14px; }
.urow .nm { font-size: 15px; }
.urow .meta { margin-top: 1px; }
.urow .end { display: grid; justify-items: end; gap: 3px; font-variant-numeric: tabular-nums; }
.urow .end b { font-size: 16px; }
.cats { margin: 0; padding: 0; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cats li { border-top: 1px solid var(--line); }
.cats li:first-child { border-top: 0; }
.crow { width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; display: grid; gap: 6px; }
.chead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chead .nm { font-size: 15px; }
.chead span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chead span b { color: var(--ink); font-size: 17px; }
.track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.subs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.subs b { color: var(--ink); font-weight: 700; }
.usedup { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.usedup li { border: 1px dashed var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--ink-2); }
.alert { display: grid; gap: 4px; border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; background: var(--warn-soft); color: var(--ink); }
.alert.bad { background: var(--bad-soft); }
.alert.ok { background: var(--accent-soft); }
.alert .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 15px; }
.alert .big b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.alert .nms { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.chk { width: 30px; height: 30px; min-height: 30px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 17px; line-height: 1; padding: 0; color: var(--accent-ink); }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.chk[disabled] { opacity: .7; }
.row.done .nm { text-decoration: line-through; color: var(--ink-2); }
.row.done { opacity: .65; }
.price { display: grid; gap: 4px; }
.price .prow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.price .prow:last-child { border-bottom: 0; }
.price .prow b { font-variant-numeric: tabular-nums; }
.price .ptot { font-size: 18px; font-weight: 700; }
.noticebox { display: grid; gap: 6px; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; font-size: 14px; }
.noticebox span { font-weight: 700; }
.noticebox span small { font-weight: 400; color: var(--ink-2); font-size: 12px; }
.noticebox.view b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.edit label small { font-size: 12px; }
.goline { width: 100%; background: none; border: 0; text-align: left; }
.go { color: var(--ink-2); font-size: 22px; }
.yr { display: grid; grid-template-columns: 64px minmax(0, 1fr) 36px; gap: 10px; align-items: center; padding: 10px 14px; }
.ylab { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ylab.bad { color: var(--bad); }
.yr b { text-align: right; font-variant-numeric: tabular-nums; }
.track i.bad { background: var(--bad); }
.track i.mute { background: var(--ink-2); opacity: .5; }
.linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; padding: 6px 2px; min-height: 32px; }
.crow[aria-expanded="true"] { padding-bottom: 8px; }
.stk { padding: 0 14px 10px; display: grid; gap: 0; }
.subh2 { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 4px 10px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.irow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
.irow:last-child { border-bottom: 0; }
.irow .inm { min-width: 0; overflow-wrap: anywhere; }
.irow small { font-size: 12px; color: var(--ink-2); }
.irow b { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.irow.dim .inm, .irow.dim b { opacity: .5; }
.dsec > h2 small .tot { color: var(--ink); font-size: 17px; }
.chead .num { font-size: 22px; font-weight: 700; color: var(--accent); font-family: var(--font-display); }
.chead span b.num { color: var(--accent); font-size: 22px; }
.kinds { font-style: normal; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 9px; font-weight: 700; font-size: 12px; margin-left: 4px; }
.irow { display: grid !important; grid-template-columns: minmax(0, 1fr) 64px 46px; gap: 10px; align-items: center; }
.irow b { text-align: right; }
.irow .vol { display: block; margin-top: 1px; }
.mini { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); border-radius: 999px; opacity: .75; }
.volnote { margin: -2px 2px 8px; font-size: 12px; color: var(--ink-2); }
.ov { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.ovg { min-width: 0; }
.ovg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 8px; --bar: var(--accent); }
.ovg.g1 { --bar: var(--c2); }
.ovgh { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); font-size: 18px; margin-bottom: 4px; }
.ovgh b { font-size: 24px; font-weight: 700; color: var(--bar); font-variant-numeric: tabular-nums; }
.ovc { padding: 6px 0 4px; border-top: 1px solid var(--line); }
.ovch { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px; color: var(--ink-2); margin-bottom: 2px; }
.ovch b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.vchart { display: flex; gap: 14px; overflow-x: auto; padding: 6px 0 8px; }
.vgc { flex: none; display: grid; gap: 6px; align-content: start; }
.vgbars { display: flex; gap: 2px; align-items: flex-end; height: 146px; border-bottom: 1px solid var(--line); }
.vcol { width: 30px; display: grid; justify-items: center; align-content: end; gap: 3px; height: 100%; }
.vcol b { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.vbar { width: 18px; border-radius: 5px 5px 0 0; background: var(--bar); }
.vcol.dim { opacity: .45; }
.vlabs { display: flex; gap: 2px; }
.vlab { width: 30px; height: 96px; writing-mode: vertical-rl; text-align: start; font-size: 12px; line-height: 30px; color: var(--ink); padding-top: 2px; overflow: hidden; }
.vlab.dim { opacity: .45; }
.vgname { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.vgname b { color: var(--ink); font-variant-numeric: tabular-nums; }
.usebox { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; display: grid; gap: 8px; }

    if (tomb[col]) tomb[col][String(id)] = Date.now();
    markDirty();
  }
  function addItem(o) {
    return createDoc('items', items, Object.assign({ name: '', cat: '생필품', sub: '', qty: 1, size: '', exp: '', approx: false, note: '', min: 0, ord: nextOrd() }, o));
  }
  function save() { syncNow({ silent: false }); }

  /* ---------- 동기화 설정 ---------- */
  function syncLoadCfg() {
    var o = null;
    try { var raw = localStorage.getItem(LS_CFG); if (raw) o = JSON.parse(raw); } catch (e) { o = null; }
    syncCfg = (o && typeof o === 'object') ? o : {};
    if (!syncCfg.deviceId) syncCfg.deviceId = 'dev-' + Math.random().toString(36).slice(2, 8);
    if (typeof syncCfg.ns !== 'string') syncCfg.ns = '';
    if (typeof syncCfg.rev !== 'number') syncCfg.rev = 0;
    if (typeof syncCfg.lastRemoteRev !== 'number') syncCfg.lastRemoteRev = 0;
    if (typeof syncCfg.lastSync !== 'number') syncCfg.lastSync = 0;
    if (typeof syncCfg.lastPushTs !== 'number') syncCfg.lastPushTs = 0;
    if (typeof syncCfg.lastError !== 'string') syncCfg.lastError = '';
    if (typeof syncCfg.auto !== 'boolean') syncCfg.auto = true;
    return syncCfg;
  }
  function syncSaveCfg() { try { localStorage.setItem(LS_CFG, JSON.stringify(syncCfg || {})); } catch (e) {} }
  function syncConnected() { return !!(syncCfg && syncCfg.ns); }
  function syncErrMsg(e) {
    var m = String((e && e.message) ? e.message : (e || ''));
    if (!m || m === 'HTTP 0' || /Failed to fetch|NetworkError|Load failed|aborted|AbortError/i.test(m)) return '네트워크에 연결할 수 없어요 (인터넷 상태 확인)';
    return m;
  }
  function newNs() {
    var abc = 'abcdefghijkmnpqrstuvwxyz23456789', s = '';
    for (var i = 0; i < 10; i++) s += abc.charAt(Math.floor(Math.random() * abc.length));
    return 'salimkan-' + s;
  }

  /* ---------- MantleDB 통신 ---------- */
  function apiFetch(url, opts) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 20000) : null;
    var o = Object.assign({ cache: 'no-store' }, opts || {});

    return fetch(url, o).then(function (res) { if (timer) clearTimeout(timer); return res; }, function (err) { if (timer) clearTimeout(timer); throw err; });
  }
  function apiPost(path, obj) {
    return apiFetch(SYNC_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj)
    }).then(function (res) {
      if (res.ok) return true;
      return res.text().then(function (t) {
        var msg = 'HTTP ' + res.status;
        try { var j = JSON.parse(t); if (j && j.error) msg += ' (' + j.error + ')'; } catch (e) {}
        throw new Error(msg);
      });
    });
  }
  function apiGet(path) {
    return apiFetch(SYNC_BASE + path, { method: 'GET' }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (t) {
        if (!t) return null;
        try { return JSON.parse(t); } catch (e) { return null; }
      });
    });
  }

  function escLen(ch) {
    var cc = ch.charCodeAt(0);
    if (ch === '"' || ch === '\\') return 2;
    if (cc < 0x20) return 6;
    if (cc < 0x80) return 1;
    if (cc < 0x800) return 2;
    if (cc >= 0xD800 && cc <= 0xDBFF) return 4;
    if (cc >= 0xDC00 && cc <= 0xDFFF) return 0;
    return 3;
  }
  function chunkDoc(doc, max) {
    var parts = [], cur = '', len = 0;
    for (var i = 0; i < doc.length; i++) {
      var ch = doc.charAt(i), b = escLen(ch);
      if (len + b > max) { parts.push(cur); cur = ch; len = b; }
      else { cur += ch; len += b; }
    }
    if (cur) parts.push(cur);
    return parts;
  }

  function syncReadManifest() {
    if (!syncConnected()) return Promise.resolve(null);
    return apiGet(syncCfg.ns + '/v1/manifest').then(function (m) {
      if (!m || !m.parts || !m.parts.length) return null;
      return m;
    });
  }
  function syncReadRemote(manifest) {
    var list = manifest.parts || [], out = new Array(list.length), next = 0;
    function worker() {
      var i = next++;
      if (i >= list.length) return Promise.resolve();
      var p = list[i];
      var key = p && p.k ? p.k : ('v1/p' + i);
      return apiGet(syncCfg.ns + '/' + key).then(function (part) {
        if (!part || typeof part.c !== 'string') throw new Error('클라우드 사본이 만료됐어요');
        out[i] = part.c;
        return worker();
      });

    var n = Math.max(1, Math.min(3, list.length)), ws = [];
    for (var k = 0; k < n; k++) ws.push(worker());
    return Promise.all(ws).then(function () {
      var buf = out.join('');
      var doc = null;
      try { doc = JSON.parse(buf); } catch (e) { doc = null; }
      if (!doc || !Array.isArray(doc.items)) throw new Error('클라우드 데이터 형식이 올바르지 않아요');
      return doc;
    });
  }

  function syncPush(manifestHint) {
    if (!syncConnected()) return Promise.reject(new Error('동기화 코드가 없어요'));
    var doc = snapshotDoc();
    doc.ts = Date.now();
    doc.device = syncCfg.deviceId;
    var json = JSON.stringify(doc);
    var parts = chunkDoc(json, SYNC_PART_MAX);
    var chain = Promise.resolve();
    parts.forEach(function (p, i) {
      chain = chain.then(function () { return apiPost(syncCfg.ns + '/v1/p' + i, { c: p }); });
    });
    var rev = Math.max(syncCfg.rev || 0, syncCfg.lastRemoteRev || 0, (manifestHint && manifestHint.rev) || 0) + 1;
    var ts = Date.now();
    var manifest = {
      t: 1, app: 'salimkan', rev: rev, ts: ts, device: syncCfg.deviceId,
      parts: parts.map(function (p, i) { return { k: 'v1/p' + i }; }),
      counts: docCounts(), bytes: json.length
    };
    return chain.then(function () { return apiPost(syncCfg.ns + '/v1/manifest', manifest); }).then(function () {
      syncCfg.rev = rev;
      syncCfg.lastRemoteRev = rev;
      syncCfg.lastPushTs = ts;
      syncCfg.lastSync = ts;
      syncCfg.lastCount = manifest.counts;
      syncCfg.lastError = '';
      syncCfg.dirty = false;
      syncSaveCfg();
      return manifest;
    });
  }

  /* ---------- 병합: 클라우드(remote) + 이 기기(local) → 합친 문서 ---------- */
  function mergeRemote(remote) {
    var before = JSON.stringify(snapshotDoc());
    var del = { items: {}, shop: {}, goods: {}, sales: {} };
    COLS.forEach(function (name) {
      var a = tomb[name] || {}, b = (remote.del && remote.del[name]) || {};
      Object.keys(a).forEach(function (id) { del[name][id] = Math.max(del[name][id] || 0, Number(a[id]) || 0); });
      Object.keys(b).forEach(function (id) { del[name][id] = Math.max(del[name][id] || 0, Number(b[id]) || 0); });
    });
    var localAhead = false;
    var out = { v: 1, app: 'salimkan', notice: notice, metaTs: metaTs, del: del };
    if (Number(remote.metaTs || 0) > Number(metaTs || 0)) {
      out.notice = typeof remote.notice === 'string' ? remote.notice : notice;
      out.metaTs = Number(remote.metaTs || 0);
    } else if (metaTs > 0) {
      localAhead = localAhead || (Number(remote.metaTs || 0) < metaTs);
    }
    COLS.forEach(function (name) {
      var base = collMap(name), merged = new Map();
      base.forEach(function (rec, id) { merged.set(String(id), rec); });
      var rarr = Array.isArray(remote[name]) ? remote[name] : [];
      rarr.forEach(function (r) {
        if (!r || r.id == null) return;
        var id = String(r.id), l = merged.get(id);
        if (!l) { merged.set(id, r); return; }
        var lt = Number(l.updatedAt || 0), rt = Number(r.updatedAt || 0);
        if (rt > lt) merged.set(id, r);
        else if (lt > rt && !syncApplying) localAhead = true;
      });
      var kept = [];
      merged.forEach(function (rec, id) {
        var dts = del[name][id] || 0;
        var rt2 = Number(rec.updatedAt || 0);
        if (dts && dts >= rt2) return;      /* 지운 항목은 되살리지 않는다 */
        kept.push(rec);
      });
      out[name] = kept;
      /* 이 기기에만 있는 항목(클라우드에 없는 id)이 있으면 올려야 한다 */
      if (!syncApplying) {
        var rids = {};
        rarr.forEach(function (r) { if (r && r.id != null) rids[String(r.id)] = 1; });
        base.forEach(function (rec, id) {
          if (!rids[String(id)] && !(del[name][id] >= Number(rec.updatedAt || 0))) localAhead = true;
        });
        Object.keys(tomb[name] || {}).forEach(function (id) {
          var rt3 = 0;
          rarr.forEach(function (r) { if (r && String(r.id) === id) rt3 = Number(r.updatedAt || 0); });
          if (tomb[name][id] >= rt3) localAhead = true;
        });
      }
    });
    var json = JSON.stringify(out);
    var changed = (json !== before);
    return { doc: out, changed: changed, localAhead: localAhead };
  }

  /* ---------- 지금 동기화 ---------- */
  function syncNow(opts) {
    var silent = !opts || opts.silent !== false;
    if (!syncConnected()) { if (!silent) toast('먼저 동기화 코드로 연결해 주세요'); return Promise.resolve(null); }
    if (syncBusy) return Promise.resolve(null);
    syncBusy = true; saving = true; setSync();
    var started = Date.now();
    return syncReadManifest().then(function (manifest) {
      if (!manifest) {
        /* 클라우드 사본이 없다 = 처음 연결이거나 30일 만료 → 이 기기 원본을 올려 복구한다 */
        if (items.size || shop.size || goods.size || sales.size) return syncPush(null).then(function () { return { recovered: true }; });
        syncCfg.lastSync = Date.now(); syncCfg.lastError = ''; syncSaveCfg();
        return {};
      }
      syncCfg.lastRemoteRev = manifest.rev;
      var upToDate = (manifest.rev === syncCfg.rev) && !syncCfg.dirty && (Number(syncCfg.lastPushTs || 0) >= Number(manifest.ts || 0));
      if (upToDate) {
        /* 변경은 없어도 마지막 업로드가 14일을 넘겼으면 다시 올려 30일 만료를 미룬다 */
        var lastUp0 = Number(syncCfg.lastPushTs || 0) || Number(manifest.ts || 0);
        if (lastUp0 && (Date.now() - lastUp0) >= SYNC_TOUCH_MS) {

        }
        syncCfg.lastSync = Date.now(); syncCfg.lastError = ''; syncCfg.lastCount = manifest.counts || syncCfg.lastCount; syncSaveCfg();
        return { unchanged: true };
      }
      return syncReadRemote(manifest).then(function (remote) {
        syncApplying = true;
        var m = mergeRemote(remote);
        syncApplying = false;
        var res = { manifest: manifest };
        if (m.changed) {
          applyDoc(m.doc);
          storeSave();
          render();
          res.applied = true;
        }
        var lastUp = Number(manifest.ts || 0) || Number(syncCfg.lastPushTs || 0);
        var due = lastUp && (Date.now() - lastUp) >= SYNC_TOUCH_MS;
        if (m.localAhead || syncCfg.dirty || due) {
          return syncPush(manifest).then(function () { res.pushed = true; if (due && !m.localAhead) res.touched = true; return res; });
        }
        syncCfg.rev = manifest.rev;
        syncCfg.lastSync = Date.now();
        syncCfg.lastError = '';
        syncCfg.lastCount = manifest.counts || syncCfg.lastCount;
        syncSaveCfg();
        return res;
      });
    }).then(function (res) {
      syncBusy = false; saving = false; dirty = false;
      setSync(); renderSyncPanel();
      if (!silent && res) {
        if (res.recovered) toast('☁️ 이 기기 목록을 클라우드에 올렸어요 · ' + items.size + '건');
        else if (res.touched) toast('⏳ 클라우드 만료를 자동으로 연장했어요');
        else if (res.applied) toast('☁️ 최신 내용을 받았어요 · ' + items.size + '건');
        else toast('동기화 완료 · ' + items.size + '건');
      }
      return res;
    }).catch(function (err) {
      syncBusy = false; saving = false;
      syncCfg.lastError = syncErrMsg(err);
      syncSaveCfg();
      setSync(); renderSyncPanel();
      if (!silent) toast('동기화 실패: ' + syncCfg.lastError);
      return null;
    });
  }

  /* ---------- 코드 연결 ---------- */
  function parseCode(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    var q = s.match(/[?&](?:k|key|code|sync)=([^&]+)/i);
    if (q) { try { s = decodeURIComponent(q[1]); } catch (e) { s = q[1]; } }
    s = s.replace(/^https?:\/\/[^\/]+\//i, '').replace(/^v2\//i, '').replace(/[?#].*$/, '').replace(/\/+$/, '').trim();
    var m = s.match(/(salimkan-[a-z0-9]+)/i);
    if (m) return m[1].toLowerCase();
    return s.toLowerCase();
  }
  function syncCodeFromUrl() {
    try {
      var q = (location.search || '').match(/[?&](?:k|key|code|sync)=([^&]+)/i);
      if (q) return parseCode(decodeURIComponent(q[1].replace(/\+/g, ' ')));
    } catch (e) {}
    return '';
  }

  function connectCode(raw, opts) {
    var o = opts || {};
    var code = parseCode(raw);
    if (!/^salimkan-[a-z0-9]{4,}$/.test(code)) { if (!o.quiet) toast('코드 형식이 맞지 않아요 (예: salimkan-ab12cd34ef)'); return Promise.resolve(false); }
    if (code === syncCfg.ns && o.keepIfSame !== false) { renderSyncPanel(); return Promise.resolve(true); }
    var prev = syncCfg.ns || '';
    syncCfg.ns = code; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastSync = 0;
    syncCfg.lastError = ''; syncCfg.dirty = false; syncCfg.auto = true;
    syncSaveCfg();
    loadingRemote = !items.size; setSync(); renderSyncPanel(); render();
    return syncReadManifest().then(function (manifest) {
      if (!manifest && !(items.size || shop.size)) {
        syncCfg.ns = prev; syncSaveCfg(); loadingRemote = false; setSync(); renderSyncPanel(); render();
        if (!o.quiet) toast('이 코드에는 저장된 목록이 아직 없어요');
        return false;
      }
      return syncNow({ silent: true }).then(function (res) {
        loadingRemote = false; setSync(); renderSyncPanel(); render();
        if (syncCfg.lastError) { if (!o.quiet) toast('동기화 실패: ' + syncCfg.lastError); return false; }
        if (!o.quiet) toast('☁️ 연결 완료 · ' + items.size + '건을 함께 씁니다');
        return true;
      });
    }).catch(function (err) {
      syncCfg.ns = prev; syncSaveCfg(); loadingRemote = false; setSync(); renderSyncPanel(); render();
      if (!o.quiet) toast('코드를 확인하지 못했어요: ' + syncErrMsg(err));
      return false;
    });
  }

  function createCode() {
    if (!items.size && !shop.size) { toast('이 기기에 아직 목록이 없어요'); return; }
    var code = newNs();
    syncCfg.ns = code; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastError = ''; syncCfg.auto = true;
    syncSaveCfg();
    setSync(); renderSyncPanel();
    toast('클라우드에 올리는 중…');
    syncPush(null).then(function () {
      setSync(); renderSyncPanel();
      toast('☁️ 새 동기화 코드가 만들어졌어요');
    }, function (err) {
      syncCfg.lastError = syncErrMsg(err); syncSaveCfg(); setSync(); renderSyncPanel();
      toast('업로드 실패: ' + syncCfg.lastError);
    });
  }

  function disconnectSync() {
    if (!confirm('이 기기에서 동기화를 끊을까요?\n목록은 이 기기에 그대로 남아 있어요.')) return;
    syncCfg.ns = ''; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastSync = 0; syncCfg.lastError = ''; syncCfg.dirty = false;
    syncSaveCfg(); setSync(); renderSyncPanel(); render();
    toast('동기화 연결을 끊었어요');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); }, function () { toast('복사 실패 — 길게 눌러 직접 복사해 주세요'); });
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        toast('복사했어요');
      } catch (e) { toast('복사 실패 — 길게 눌러 직접 복사해 주세요'); }
    }
  }
  function syncLink() { return syncConnected() ? (location.origin + location.pathname + '?k=' + syncCfg.ns) : ''; }

  /* ---------- 상태 표시 ---------- */
  function syncAgo(ts) {
    if (!ts) return '아직 없음';
    var diff = Date.now() - ts, mm = Math.floor(diff / 60000);
    if (mm < 1) return '방금';
    if (mm < 60) return mm + '분 전';
    var hh = Math.floor(mm / 60);
    if (hh < 24) return hh + '시간 전';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function setSync() {
    var chip = $('#syncBtnText'), dot = $('#syncDot'), t, cls = '';
    if (!syncConnected()) { t = '동기화 코드로 연결하기'; cls = 'off'; }
    else if (syncBusy || saving) { t = '클라우드와 맞추는 중…'; cls = 'busy'; }
    else if (syncCfg.lastError) { t = '동기화 오류 · 다시 시도'; cls = 'err'; }
    else if (dirty) { t = '저장 중… (이 기기에 먼저 저장됨)'; cls = 'busy'; }
    else { t = '연결됨 · ' + syncAgo(syncCfg.lastSync) + ' 동기화'; cls = 'on'; }
    if (chip) chip.textContent = t;
    var btn = $('#syncBtn');
    if (btn) btn.setAttribute('data-state', cls);
    if (dot) dot.setAttribute('data-state', cls);
    var foot = $('#sync');
    if (foot) {
      if (!syncConnected()) foot.textContent = '같은 코드를 넣은 기기끼리 이 목록을 함께 써요';
      else if (syncCfg.lastError) foot.textContent = '동기화 오류: ' + syncCfg.lastError;
      else foot.textContent = '☁️ 연결됨 · ' + syncAgo(syncCfg.lastSync) + ' 동기화 · 다른 기기의 수정도 자동으로 받아요';
    }
    var sb = $('#saveBar');
    if (sb) {
      /* 이 기기에는 늘 즉시 저장되므로, 클라우드 저장이 막혔을 때만 띄운다 */
      sb.hidden = !(syncConnected() && syncCfg.lastError);
      var sm = $('#saveMsg');
      if (sm) sm.textContent = '이 기기에는 저장됐어요 · 클라우드 저장이 막혔어요';
    }
  }

  function toggleSyncPanel(force) {
    var box = $('#syncBox');
    if (!box) return;
    var open = (typeof force === 'boolean') ? force : box.hidden;
    box.hidden = !open;
    var btn = $('#syncBtn');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { renderSyncPanel(); var inp = $('#syncJoinInput'); if (inp && !syncConnected()) setTimeout(function () { try { inp.focus(); } catch (e) {} }, 60); }
  }

  function renderSyncPanel() {
    var box = $('#syncBoxIn');
    if (!box) return;
    if (!syncConnected()) {
      box.innerHTML =
        '<p class="sbp">동기화 코드를 넣으면 이 목록이 클라우드에 저장되고, 같은 코드를 넣은 다른 기기(배우자 휴대폰·PC)와 자동으로 맞춰져요.</p>' +
        '<div class="sbrow"><input id="syncJoinInput" class="sbinput" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: salimkan-ab12cd34ef" aria-label="동기화 코드"></div>' +
        '<div class="sbbtns"><button class="btn primary sm" type="button" data-sact="join">이 코드로 연결</button>' +
        '<button class="btn sm" type="button" data-sact="create">새 코드 만들기</button></div>';
      return;
    }
    var c = docCounts(), cc = (syncCfg.lastCount && syncCfg.lastCount.items != null) ? syncCfg.lastCount.items : null;
    var err = syncCfg.lastError ? '<p class="sberr">⚠️ ' + esc(syncCfg.lastError) + '</p>' : '';
    box.innerHTML =
      '<div class="sbinfo"><span>이 기기 <b>' + c.items + '</b>건</span><span>클라우드 <b>' + (cc == null ? '-' : cc) + '</b>건</span></div>' +
      '<div class="sbrow"><input class="sbinput sbcode" id="syncCodeView" type="text" readonly value="' + esc(syncCfg.ns) + '" aria-label="동기화 코드">' +
      '<button class="btn sm" type="button" data-sact="copy-code">복사</button></div>' +
      '<div class="sbrow"><input class="sbinput sbcode" id="syncLinkView" type="text" readonly value="' + esc(syncLink()) + '" aria-label="동기화 링크">' +
      '<button class="btn sm" type="button" data-sact="copy-link">링크</button></div>' +
      '<div class="sbbtns"><button class="btn primary sm" type="button" data-sact="now">지금 동기화</button>' +
      '<button class="btn sm" type="button" data-sact="disconnect">연결 끊기</button></div>' + err;
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-sact]');

    if (a === 'join') { var inp = $('#syncJoinInput'); connectCode(inp ? inp.value : ''); return; }
    if (a === 'create') { createCode(); return; }
    if (a === 'now') { save(); return; }

  function startSync() {
    syncLoadCfg();

      if (document.visibilityState === 'visible' && syncConnected() && syncCfg.auto && (Date.now() - (syncCfg.lastSync || 0) > 20000)) syncNow({ silent: true });
    });
    window.addEventListener('online', function () { if (syncConnected() && syncCfg.auto) syncNow({ silent: true }); });
    clearInterval(syncPoll);
    syncPoll = setInterval(function () {
      if (document.visibilityState !== 'visible' || !syncConnected() || !syncCfg.auto) return;
      if (syncBusy || isTyping()) return;
      if (Date.now() - (syncCfg.lastSync || 0) < 12000) return;
      syncNow({ silent: true });
    }, SYNC_POLL_MS);

    var urlCode = syncCodeFromUrl();
    if (urlCode && urlCode !== syncCfg.ns) {
      connectCode(urlCode, { keepIfSame: false });

  function chipsHTML(all) {

  var GROUPS = ['맨즈', '우먼', '보이즈', '걸즈', '키즈', '가방·잡화', '생활·소품', '기타'];

  function goodsAct(act, b, w) {
    if (act === 'save-now') { save(); return true; }
    if (act === 'gtab') { ui.gtab = b.dataset.gtab; ui.add = false; ui.sell = null; ui.q = ''; $('#q').value = ''; render(); return true; }
    if (act === 'gby') { ui.gby = b.dataset.gby; try { localStorage.setItem('salimkan-gby', ui.gby); } catch (x) {} render(); return true; }
    if (act === 'ggroup') { if (ui.gby === 'brand') ui.gbrand = b.dataset.g; else ui.ggroup = b.dataset.g; render(); return true; }
    var grow = b.closest('[data-gid]'), g = grow ? goods.get(grow.dataset.gid) : null;
    var srow = b.closest('[data-saleid]'), s = srow ? sales.get(srow.dataset.saleid) : null;
    var keep = grow ? '[data-gid="' + grow.dataset.gid + '"] [data-act="' + act + '"]' : (srow ? '[data-saleid="' + srow.dataset.saleid + '"] [data-act="' + act + '"]' : null);
    if (act === 'g-open' && g) { if (ro) return true; ui.gopen = ui.gopen === g.id ? null : g.id; ui.gdel = null; ui.sell = null; render(); return true; }
    if ((act === 'g-inc' || act === 'g-dec') && g && w) { patchGoods(g, { qty: Math.max(0, (g.qty || 0) + (act === 'g-inc' ? 1 : -1)) }); render(keep); return true; }
    if (act === 'g-sell' && g && w) { ui.sell = ui.sell === g.id ? null : g.id; render(ui.sell ? '[data-gid="' + g.id + '"] .sell select' : keep); return true; }
    if (act === 'g-del' && g && w) {
      if (ui.gdel === g.id) { removeDoc('goods', goods, g.id); ui.gopen = null; ui.gdel = null; ui.sell = null; render(); toast('삭제했어요'); }
      else { ui.gdel = g.id; render(keep); }
      return true;
    }
    if (act === 'sale-del' && s && w) {
      if (ui.sdel === s.id) { removeDoc('sales', sales, s.id); ui.sdel = null; render(); toast('삭제했어요'); }
      else { ui.sdel = s.id; render(keep); }
      return true;
    }
    return false;
  }

  function goodsChange(el, gf) {
    if (!canWrite()) return;
    var row = el.closest('[data-gid]'), g = row && goods.get(row.dataset.gid);
    if (!g) return;
    var v = el.value.trim();
    if (gf === 'name' && !v) { el.value = g.name; return; }
    var patch = {};
    if (gf === 'cost') patch.cost = Math.max(0, num(v));
    else if (gf === 'sealed') patch.sealed = v === '1';
    else patch[gf] = v;
    patchGoods(g, patch);
    render();
  }

  function goodsSubmit(form) {
    var kind = form.dataset.form;
    if (kind !== 'goods' && kind !== 'sell' && kind !== 'sale') return false;
    var fd = new FormData(form);
    if (kind === 'goods') {
      var name = String(fd.get('name') || '').trim();
      if (!name) return true;
      var go = {
        name: name, group: String(fd.get('group')), size: String(fd.get('size') || '').trim(),
        qty: Math.max(0, num(fd.get('qty'))), cost: Math.max(0, num(fd.get('cost'))),
        sealed: fd.get('sealed') === '1', note: String(fd.get('note') || '').trim(), ord: nextOrdOf(goods)
      };
      var br = String(fd.get('brand') || '').trim();
      if (br) go.brand = br;
      createDoc('goods', goods, go);
      ui.add = true; render('.add input[name="name"]'); toast('‘' + name + '’을(를) 추가했어요');
    } else if (kind === 'sell') {
      var row = form.closest('[data-gid]'), g = row && goods.get(row.dataset.gid);
      if (!g) return true;
      var rec = createDoc('sales', sales, {
        name: g.name + (g.size ? ' ' + g.size : ''), platform: String(fd.get('platform')),
        sale: Math.max(0, num(fd.get('sale'))), cost: g.cost || 0, fee: Math.max(0, num(fd.get('fee'))),
        date: String(fd.get('date') || ''), goodsId: g.id, ord: nextOrdOf(sales)
      });
      patchGoods(g, { qty: Math.max(0, (g.qty || 0) - 1) });
      ui.sell = null; ui.gopen = null; render();
      toast('판매 기록에 넣었어요 · 이익 ' + won(profitOf(rec)));
    } else {
      var nm = String(fd.get('name') || '').trim();
      if (!nm) return true;
      createDoc('sales', sales, {
        name: nm, platform: String(fd.get('platform')), sale: Math.max(0, num(fd.get('sale'))),
        cost: Math.max(0, num(fd.get('cost'))), fee: Math.max(0, num(fd.get('fee'))),
        date: String(fd.get('date') || ''), goodsId: '', ord: nextOrdOf(sales)
      });
      ui.add = true; render('.add input[name="name"]'); toast('판매 기록에 넣었어요');
    }
    return true;
  }

  var RANGES = [[30, '30일'], [90, '90일'], [180, '6개월'], [365, '1년']];

  var COSM = ['얼굴 화장', '얼굴 씻을거리', '얼굴 바를거리', '바디 바를거리', '바디 씻을거리', '헤어'];
  function pillFor(n) {
    if (n < 0) return '<span class="pill expbad">기한 지남</span>';

  }
  /* 소비기한: 숫자만 쳐도 된다. 270109 / 20270109 -> 2027-01-09, 2701 -> 2027-01 (그 달 말일) */
  function parseExpInput(v) {
    var d = String(v || '').replace(/\D/g, '');
    if (!d) return { exp: '', approx: false };
    var y, m, dd, approx = false;
    if (d.length === 8) { y = +d.slice(0, 4); m = +d.slice(4, 6); dd = +d.slice(6, 8); }
    else if (d.length === 6) { y = 2000 + +d.slice(0, 2); m = +d.slice(2, 4); dd = +d.slice(4, 6); }
    else if (d.length === 4) { y = 2000 + +d.slice(0, 2); m = +d.slice(2, 4); approx = true; dd = new Date(y, m, 0).getDate(); }
    else return null;
    if (m < 1 || m > 12 || y < 2000 || y > 2100) return null;
    if (dd < 1 || dd > new Date(y, m, 0).getDate()) return null;
    return { exp: y + '-' + String(m).padStart(2, '0') + '-' + String(dd).padStart(2, '0'), approx: approx };
  }
  function expInputVal(it) {
    var p = (it.exp || '').split('-');
    if (p.length < 3) return '';
    return p[0].slice(2) + p[1] + (it.approx ? '' : p[2]);
  }
  function sizeNum(v) {
    var n = parseFloat(String(v == null ? '' : v).replace(',', '.'));
    return isFinite(n) && n > 0 ? String(Math.round(n * 100) / 100) : '';
  }
  function priceNum(v) { var d = String(v == null ? '' : v).replace(/\D/g, ''); return d ? String(parseInt(d, 10)) : ''; }
  function parseDay(v) {
    var d = String(v || '').replace(/\D/g, ''), y, m, dd;
    if (d.length === 8) { y = +d.slice(0, 4); m = +d.slice(4, 6); dd = +d.slice(6, 8); }
    else if (d.length === 6) { y = 2000 + +d.slice(0, 2); m = +d.slice(2, 4); dd = +d.slice(4, 6); }
    else return null;
    if (m < 1 || m > 12 || y < 2000 || y > 2100 || dd < 1 || dd > new Date(y, m, 0).getDate()) return null;
    return y + '-' + String(m).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
  }
  function dayInputVal(iso) { var p = (iso || '').split('-'); return p.length === 3 ? p[0].slice(2) + p[1] + p[2] : ''; }
  function dayFmt(iso) { var p = (iso || '').split('-'); return p.length === 3 ? p[0].slice(2) + '.' + p[1] + '.' + p[2] : ''; }
  function daysBetween(a, b) {
    var x = a.split('-'), y = b.split('-');
    return Math.round((new Date(+y[0], +y[1] - 1, +y[2]) - new Date(+x[0], +x[1] - 1, +x[2])) / 86400000);
  }
  function usesOf(it) { return Array.isArray(it.uses) ? it.uses : []; }
  function openUse(it) { var u = usesOf(it); for (var k = u.length - 1; k >= 0; k--) if (u[k].s && !u[k].e) return u[k]; return null; }
  function useDays(u) { return Math.max(1, daysBetween(u.s, u.e || today())); }
  function parseSize(str) {
    var m0 = String(str || '').trim().match(/^\d+(?:\.\d+)?$/);
    if (m0) return { v: parseFloat(m0[0]), u: 'ml' };
    return null;
  }
  function parseSizeOld(str) {
    var m = String(str || '').trim().match(/^(\d+(?:[.,]\d+)?)\s*(ml|mL|ML|㎖|g|G|kg|KG|L|l|매|개입|개)$/);
    if (!m) return null;
    var v = parseFloat(m[1].replace(',', '.')), u = m[2].toLowerCase();
    if (u === '㎖') u = 'ml';

      patchItem(it, { qty: Math.max(0, (it.qty || 0) + (act === 'inc' ? 1 : -1)) }); render(keep);
    } else if (act === 'to-list' && it && w) {
      var added = toList(it); toast(added ? '장보기에 담았어요' : '이미 장보기에 있어요'); render(keep);
    } else if (act === 'use-start' && it && w) {
      if (!openUse(it)) { var us = usesOf(it).slice(); us.push({ s: today(), e: '' }); patchItem(it, { uses: us }); toast('사용을 시작했어요 · ' + dayFmt(today())); }
      render(keep);
    } else if (act === 'use-end' && it && w) {
      var op2 = openUse(it);
      if (op2) {
        var us2 = usesOf(it).map(function (r) { return r === op2 ? { s: r.s, e: today() } : r; });
        patchItem(it, { uses: us2, qty: Math.max(0, (it.qty || 0) - 1) });
        toast(useDays({ s: op2.s, e: today() }) + '일 썼어요 · 수량을 1개 줄였어요');
        render(keep);
        if (!rateOf(it)) openReview(it.id, 'use-end');
        return;
      }
      render(keep);
    } else if (act === 'use-del' && it && w) {
      var ux = +b.closest('[data-ux]').dataset.ux;
      patchItem(it, { uses: usesOf(it).filter(function (r, ix) { return ix !== ux; }) }); render(keep);
    } else if (act === 'del' && it && w) {
      if (ui.del === it.id) { removeDoc('items', items, it.id); ui.open = null; ui.del = null; render(); toast('삭제했어요'); }
      else { ui.del = it.id; render(keep); }
    } else if (act === 'sug-add' && w) {
      var si = items.get(b.dataset.iid); if (si && toList(si)) { render(); toast('장보기에 담았어요'); }
    } else if (act === 'sug-all' && w) {
      var n = 0; allItems().filter(function (i) { return i.qty <= 0; }).forEach(function (i) { if (toList(i)) n++; });
      if (n) { render(); toast(n + '개를 담았어요'); }
    } else if (act === 'chk' && sx && w) {
      patchShop(sx, { done: !sx.done }); render(keep);
    } else if ((act === 's-inc' || act === 's-dec') && sx && w) {
      patchShop(sx, { qty: Math.max(1, sx.qty + (act === 's-inc' ? 1 : -1)) }); render(keep);
    } else if (act === 'rm' && sx && w) {
      removeDoc('shop', shop, sx.id); render();
    } else if (act === 'buy' && w) {
      applyBought();
    }
  });

  document.addEventListener('change', function (e) {
    var uf = e.target.dataset && e.target.dataset.uf;
    if (uf) {
      if (!canWrite()) return;
      var urow = e.target.closest('[data-ux]'), irow = e.target.closest('[data-id]');
      var uit = irow && items.get(irow.dataset.id);
      if (!uit || !urow) return;
      var ux2 = +urow.dataset.ux, rec = usesOf(uit)[ux2];
      if (!rec) return;
      var raw = e.target.value.trim(), iso = raw ? parseDay(raw) : '';
      if (raw && !iso) { toast('날짜를 확인해 주세요. 숫자만 예: 270109'); e.target.value = dayInputVal(rec[uf]); return; }
      if (uf === 's' && !iso) { e.target.value = dayInputVal(rec.s); return; }
      var ns = uf === 's' ? iso : rec.s, ne = uf === 'e' ? iso : rec.e;
      if (ne && ne < ns) { toast('종료일이 시작일보다 빠를 수 없어요'); e.target.value = dayInputVal(rec[uf]); return; }
      patchItem(uit, { uses: usesOf(uit).map(function (r, ix) { return ix === ux2 ? { s: ns, e: ne } : r; }) });
      render();
      return;
    }
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-addcorner')) {
      var dl = $('#subpreset');
      if (dl) dl.innerHTML = (CORNER_PRESET[e.target.value] || []).map(function (k) { return '<option value="' + esc(k) + '">'; }).join('');
      return;
    }
    var gf = e.target.dataset && e.target.dataset.gf;
    if (gf) { goodsChange(e.target, gf); return; }
    var f = e.target.dataset && e.target.dataset.f;
    if (!f || !canWrite()) return;
    var row = e.target.closest('[data-id]');
    var it = row && items.get(row.dataset.id);
    if (!it) return;
    var v = e.target.value.trim();
    if (f === 'name' && !v) { e.target.value = it.name; return; }
    var patch = {};
    patch[f] = v;
    if (f === 'exp') {
      var pe = parseExpInput(v);
      if (!pe) { toast('날짜를 확인해 주세요. 숫자만 예: 270109 (연월일) 또는 2701 (연월)'); e.target.value = expInputVal(it); return; }
      patch.exp = pe.exp; patch.approx = pe.approx;
    }
    if (f === 'size') {
      if (v && !sizeNum(v)) { toast('용량은 숫자만 적어 주세요 (ml)'); e.target.value = sizeNum(it.size); return; }
      patch.size = sizeNum(v);
    }
    if (f === 'corner') { if (CORNER_NAMES.indexOf(v) < 0) return; patch.corner = v; patch.cat = CORNER_CAT[v]; }
    if (f === 'price') patch.price = priceNum(v);
    if (f === 'min') patch.min = Math.max(0, parseInt(v, 10) || 0);
    patchItem(it, patch);
    render();
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    if (!canWrite()) return;
    if (goodsSubmit(form)) return;
    var fd = new FormData(form);
    var name = String(fd.get('name') || '').trim();
    if (!name) return;
    if (form.dataset.form === 'item') {
      var addExp = parseExpInput(fd.get('exp'));
      if (!addExp) { toast('소비기한을 확인해 주세요. 숫자만 예: 270109'); return; }
      var corner = String(fd.get('corner') || '기타');
      if (CORNER_NAMES.indexOf(corner) < 0) corner = '기타';
      addItem({
        name: name, corner: corner, cat: CORNER_CAT[corner], sub: String(fd.get('sub') || '').trim(),
        qty: Math.max(0, parseInt(fd.get('qty'), 10) || 0), size: sizeNum(fd.get('size')), price: priceNum(fd.get('price')),
        exp: addExp.exp, approx: addExp.approx, note: String(fd.get('note') || '').trim()
      });
      ui.add = true; ui.cat = 'all'; render('.add input[name="name"]'); toast('‘' + name + '’을(를) 추가했어요');
    } else {
      var match = allItems().filter(function (i) { return i.name === name; })[0];
      createDoc('shop', shop, { name: name, qty: Math.max(1, parseInt(fd.get('qty'), 10) || 1), done: false, itemId: match ? match.id : '', at: Date.now() });
      render('.quick input[name="name"]');
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'noticeInput' && canWrite()) { notice = e.target.value; metaTs = Date.now(); markDirty(); }
  });
  $('#q').addEventListener('input', function (e) { ui.q = e.target.value; if (ui.tab === 'stock') $('#view').innerHTML = viewHTML(); });

  renderHead();
  setSync();
  init();

  /* 후기 시트 입력 · 닫기 (init 바깥에서 한 번만) */
  (function () {
    var sh = rvSheetEl(); if (!sh) return;
    var tx = document.getElementById('rvText'), ig = document.getElementById('rvIng');
    if (tx) tx.addEventListener('input', function () { if (rvDraft) rvDraft.review = tx.value; });
    if (ig) ig.addEventListener('input', function () { if (rvDraft) { rvDraft.ing = ig.value; paintReview(); } });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && rvDraft) { closeReview(); } });
  })();
})();
</script>
</body></html>
