<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>리셀북 · 재고와 손익</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="리셀북" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --card2:#F8F9FA; --card3:#F1F3F5;
  --line:#E9ECEF; --line2:#DDE1E6;
  --fg:#1B1F24; --muted:#6B7280; --muted2:#98A0AB;
  --accent:#F5891F; --accent2:#C96A00; --accentSoft:#FFF3E4;
  --ok:#0E9F6E; --okSoft:#E9F8F1; --bad:#E5484D; --badSoft:#FDEEEE;
  --info:#2F6FEB; --infoSoft:#EDF3FF;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 18px rgba(16,24,40,.05);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea,button{font-family:inherit;color:var(--fg)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.hidden{display:none !important}

/* ---------- header ---------- */
.app-head{
  position:sticky;top:0;z-index:30;
  background:#FFFFFF;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;
}
.head-row{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.logo{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(160deg,#FFC46A,#F5891F);box-shadow:0 3px 10px rgba(245,137,31,.24)
}
.brand h1{font-size:17px;margin:0;letter-spacing:-.4px;font-weight:750;line-height:1.15;color:var(--fg)}
.brand p{margin:1px 0 0;font-size:11px;color:var(--muted);letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.head-actions{display:flex;gap:6px;flex:0 0 auto}
.icobtn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line2);background:#fff;
  color:#4B5563;font-size:16px;display:grid;place-items:center;position:relative
}
.icobtn:active{background:var(--card3)}
.dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#C9CFD7;border:1.5px solid #fff}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)}
.dot.wait{background:var(--accent)}

/* ---------- layout ---------- */
.wrap{padding:12px 14px calc(84px + var(--safe-b))}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:.55}to{opacity:1}}

/* ---------- month bar ---------- */
.monthbar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.monthbar::-webkit-scrollbar{display:none}
.mchip{
  flex:0 0 auto;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line2);
  color:#4B5563;font-size:12.5px;letter-spacing:-.2px;white-space:nowrap
}
.mchip.on{background:var(--accentSoft);border-color:#F7C48A;color:#A85A00;font-weight:650}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted);letter-spacing:-.2px;display:flex;align-items:center;gap:4px}
.kpi .v{font-size:18px;font-weight:750;letter-spacing:-.7px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.kpi .v small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
.kpi .s{font-size:11px;color:var(--muted2);margin-top:2px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.ok{color:var(--ok)} .v.bad{color:var(--bad)} .v.accent{color:var(--accent2)}

/* ---------- 목표 마진 카드 (v1.2) ---------- */
.mcard{
  grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 13px 12px;
  box-shadow:var(--shadow)
}
.mcard .mc-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mcard .mc-head b{font-size:13.5px;letter-spacing:-.3px;font-weight:750;color:var(--fg)}
.mcard .mc-head span{font-size:11px;color:var(--muted2);letter-spacing:-.2px}
.mcard .mc-ctl{display:flex;align-items:center;gap:8px;margin-top:10px}
.mcard .mc-btn{
  width:34px;height:34px;flex:0 0 34px;border-radius:11px;border:1px solid var(--line2);
  background:var(--card2);color:#374151;font-size:17px;line-height:1;display:grid;place-items:center;font-weight:600
}
.mcard .mc-btn:active{background:var(--card3)}
.mcard .mc-val{
  min-width:74px;text-align:center;font-size:22px;font-weight:800;letter-spacing:-.8px;color:var(--accent2);
  font-variant-numeric:tabular-nums
}
.mcard .mc-val small{font-size:12px;font-weight:700;margin-left:1px;color:var(--accent2)}
.mcard .mc-presets{display:flex;gap:5px;margin-left:auto}
.mcard .mc-presets button{
  border:1px solid var(--line2);background:#fff;color:#4B5563;font-size:11.5px;font-weight:600;
  padding:6px 8px;border-radius:9px;letter-spacing:-.2px
}
.mcard .mc-presets button.on{background:var(--accentSoft);border-color:#F7C48A;color:#A85A00}
.mcard .mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
.mcard .mc-cell{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.mcard .mc-cell.wide{grid-column:1/-1;background:var(--okSoft);border-color:#CDEBDE}
.mcard .mc-cell .k{font-size:10.5px;color:var(--muted);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mc-cell .v{font-size:15px;font-weight:750;letter-spacing:-.4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .mc-cell.wide .v{font-size:19px;color:var(--ok)}
.mcard .mc-note{margin-top:9px;font-size:10.5px;color:var(--muted2);letter-spacing:-.2px;line-height:1.5;word-break:keep-all}
.mcard .mc-note b{color:#4B5563}

/* ---------- search / filters ---------- */
.searchrow{position:relative;margin-bottom:9px}
.searchrow input{
  width:100%;font-size:16px;background:var(--card2);border:1px solid var(--line2);border-radius:13px;
  padding:11px 12px 11px 36px;color:var(--fg);appearance:none
}
.searchrow input::placeholder{color:var(--muted2)}
.searchrow .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line2);
  color:#4B5563;font-size:12.5px;letter-spacing:-.2px;white-space:nowrap
}
.chip.on{background:#1F242B;border-color:#1F242B;color:#fff;font-weight:650}
.chip .n{color:var(--muted2);font-size:11px;margin-left:3px}
.chip.on .n{color:#C9CED7}
.filterrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.filterrow select{
  width:100%;font-size:16px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;
  padding:10px 11px;color:var(--fg);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#8A93A0 50%),linear-gradient(135deg,#8A93A0 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}

/* ---------- item cards ---------- */
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{
  display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px;
  position:relative;box-shadow:0 1px 2px rgba(16,24,40,.03)
}
.pcard.sold{opacity:.62}
.thumb{
  width:70px;height:70px;flex:0 0 70px;border-radius:12px;background:var(--card3);object-fit:cover;
  display:grid;place-items:center;font-size:24px;color:#AEB6C0;overflow:hidden
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ptop{display:flex;align-items:flex-start;gap:6px}
.pname{font-size:14.5px;font-weight:650;letter-spacing:-.3px;line-height:1.28;flex:1;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;color:var(--fg)}
.badge{
  flex:0 0 auto;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid;letter-spacing:-.2px;margin-top:1px
}
.badge.판매중{color:#0B7F58;border-color:#B7E5D3;background:var(--okSoft)}
.badge.예약중{color:#A85A00;border-color:#F7C48A;background:var(--accentSoft)}
.badge.완판{color:#6B7280;border-color:#DDE1E6;background:var(--card3)}
.pmeta{font-size:11.5px;color:var(--muted);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmoney{font-size:12px;color:#4B5563;letter-spacing:-.2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pmoney b{font-weight:700;color:var(--fg)}
.pact{display:flex;align-items:center;gap:5px;margin-top:1px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--line2);border-radius:11px;padding:2px}
.stepper button{width:28px;height:26px;border:0;background:transparent;color:#374151;font-size:16px;line-height:1;border-radius:8px}
.stepper button:active{background:var(--card3)}
.stepper .q{min-width:26px;text-align:center;font-size:12.5px;font-weight:700;color:var(--fg)}
.mini{
  border:1px solid var(--line2);background:#fff;color:#374151;border-radius:10px;padding:6px 9px;
  font-size:12px;letter-spacing:-.2px;white-space:nowrap
}
.mini:active{background:var(--card3)}
.mini.sell{background:var(--accentSoft);border-color:#F7C48A;color:#A85A00;font-weight:700}
.mini:disabled{opacity:.4}
.pmenu{position:absolute;right:9px;top:9px;width:26px;height:26px;border-radius:8px;border:0;background:transparent;color:#9AA2AD;font-size:15px;display:grid;place-items:center}
.pcard .ptop{padding-right:22px}

/* ---------- empty ---------- */
.empty{text-align:center;padding:40px 16px 34px;color:var(--muted)}
.empty .big{font-size:42px;line-height:1;margin-bottom:10px}
.empty h3{font-size:15px;margin:0 0 6px;color:var(--fg);letter-spacing:-.3px}
.empty p{font-size:12.5px;line-height:1.6;margin:0 auto 16px;max-width:270px;word-break:keep-all}
.empty .btn-primary{display:inline-flex;align-items:center;gap:6px;padding:12px 20px;border-radius:13px;border:0;
  background:var(--accent);color:#fff;font-size:14.5px;font-weight:700;
  box-shadow:0 6px 16px rgba(245,137,31,.22)}
.hintbox{margin:14px 0 0;padding:11px 12px;border:1px dashed var(--line2);border-radius:12px;background:var(--card2);
  font-size:11.5px;color:var(--muted);line-height:1.6;text-align:left;word-break:keep-all}

/* ---------- transactions ---------- */
.grouphead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:16px 2px 7px}
.grouphead:first-child{margin-top:2px}
.grouphead h4{margin:0;font-size:12.5px;color:#4B5563;letter-spacing:-.2px;font-weight:700}
.grouphead span{font-size:11.5px;color:var(--muted2);letter-spacing:-.2px}
.tx{display:flex;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:7px}
.tx .tag{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;font-size:14px}
.tx .tag.sale{background:var(--accentSoft);color:#A85A00}
.tx .tag.in{background:var(--infoSoft);color:var(--info)}
.tx .tbody{flex:1;min-width:0}
.tx .t1{font-size:13px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.tx .t2{font-size:11.5px;color:var(--muted);letter-spacing:-.2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tright{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tx .amt{font-size:13px;font-weight:700;letter-spacing:-.3px;color:var(--fg)}
.tx .amt.in{color:var(--info)}
.tx .pf{font-size:11px;letter-spacing:-.2px}
.pf.ok{color:var(--ok)} .pf.bad{color:var(--bad)}
.tx .del{border:0;background:transparent;color:#AEB6C0;font-size:13px;padding:0 0 0 2px}

/* ---------- P&L ---------- */
.plhero{background:linear-gradient(160deg,#FFF6EA,#FFFFFF 70%);border:1px solid #F6E1C6;border-radius:18px;padding:15px;margin-bottom:10px}
.plhero .lab{font-size:11.5px;color:#9A6B2F;letter-spacing:-.2px}
.plhero .big{font-size:26px;font-weight:800;letter-spacing:-1px;margin-top:2px;color:var(--fg)}
.plhero .sub{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:-.2px}
.plgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.plgrid .cell{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.plgrid .cell .k{font-size:11px;color:var(--muted);letter-spacing:-.2px}
.plgrid .cell .v{font-size:15px;font-weight:750;letter-spacing:-.5px;margin-top:2px;color:var(--fg)}
.plgrid .cell .v small{font-size:10.5px;font-weight:600;color:var(--muted);margin-left:3px}
.sec-title{font-size:12.5px;color:#4B5563;font-weight:700;margin:16px 2px 8px;letter-spacing:-.2px}
.bars{display:flex;align-items:flex-end;gap:8px;height:132px;padding:0 2px;margin-bottom:6px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.barcol .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar{width:9px;border-radius:4px 4px 2px 2px;min-height:2px}
.bar.rev{background:linear-gradient(180deg,#FFC46A,#F5891F)}
.bar.prf{background:linear-gradient(180deg,#4FD3A4,#0E9F6E)}
.barcol .lbl{font-size:9.5px;color:var(--muted2);letter-spacing:-.3px;white-space:nowrap}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--muted);margin:2px 2px 4px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px}
.catrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:6px}
.catrow .cn{flex:1;font-size:12.5px;letter-spacing:-.2px}
.catrow .cv{font-size:12.5px;font-weight:700;letter-spacing:-.2px}

/* ---------- tabbar & fab ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:2px;
  background:#FFFFFF;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:6px 6px calc(6px + var(--safe-b))
}
.tab{flex:1;background:transparent;border:0;padding:7px 2px;text-align:center;color:#8A93A0;font-size:10.5px;letter-spacing:-.2px;border-radius:12px}
.tab .ti{display:block;font-size:19px;margin-bottom:2px;line-height:1.1;filter:grayscale(.45);opacity:.85}
.tab.on{color:var(--accent2)}
.tab.on .ti{filter:none;opacity:1}
.fab{
  position:fixed;right:16px;bottom:calc(74px + var(--safe-b));z-index:41;
  width:54px;height:54px;border-radius:18px;border:0;font-size:26px;line-height:1;
  background:linear-gradient(170deg,#FFB559,#F5891F);color:#fff;
  box-shadow:0 8px 22px rgba(245,137,31,.32),0 1px 0 rgba(255,255,255,.28) inset;
  display:grid;place-items:center
}
.fab:active{transform:scale(.95)}

/* ---------- sheet (modal) ---------- */
.backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:60;animation:fade .18s ease}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:93vh;display:flex;flex-direction:column;
  background:#fff;border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  box-shadow:0 -14px 40px rgba(16,24,40,.18);animation:up .22s cubic-bezier(.22,.9,.3,1)
}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:15.5px;letter-spacing:-.3px;font-weight:750;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.sheet-head .sub{font-size:11px;color:var(--muted2);font-weight:500;letter-spacing:-.2px}
.xbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:#4B5563;font-size:14px;display:grid;place-items:center;flex:0 0 auto}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(18px + var(--safe-b));display:grid;gap:12px}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:#fff}
.btn{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:650;border:1px solid var(--line2);background:var(--card2);color:var(--fg);letter-spacing:-.3px}
.btn.ghost{background:#fff;color:#4B5563}
.btn.primary{background:var(--accent);border:0;color:#fff}
.btn.danger{background:var(--badSoft);border-color:#F6C9CB;color:#B4272B}
.btn:disabled{opacity:.45}
.btn.small{flex:0 0 auto;padding:9px 12px;font-size:12.5px;border-radius:11px}

.field label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px;letter-spacing:-.2px}
.field label .req{color:var(--bad);margin-left:2px}
.field input,.field select,.field textarea{
  width:100%;font-size:16px !important;background:var(--card2);border:1px solid var(--line2);color:var(--fg);
  border-radius:12px;padding:11px 12px;appearance:none;-webkit-appearance:none;line-height:1.25
}
.field textarea{min-height:64px;resize:vertical;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#F0B26B;background:#fff}
.field select{
  background-image:linear-gradient(45deg,transparent 50%,#8A93A0 50%),linear-gradient(135deg,#8A93A0 50%,transparent 50%);
  background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.field input[type=date]{min-height:44px}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;color:#4B5563;font-size:12.5px;padding:7px 0;border-radius:9px;letter-spacing:-.2px}
.seg button.on{background:#fff;color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(16,24,40,.1)}
.calc{display:grid;gap:5px;border:1px dashed var(--line2);border-radius:12px;padding:10px 11px;background:var(--card2);font-size:12.5px;letter-spacing:-.2px}
.calc .line{display:flex;justify-content:space-between;gap:8px;color:#4B5563}
.calc .line b{color:var(--fg);font-weight:700}

/* ---------- toast ---------- */

.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;
  background:rgba(31,36,43,.97);border:1px solid #2E3540;border-radius:13px;padding:11px 12px;
  font-size:12.5px;color:#F3F4F6;letter-spacing:-.2px;box-shadow:0 10px 26px rgba(16,24,40,.22);
  animation:tin .2s ease
}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast .msg{flex:1;line-height:1.45;word-break:keep-all}
.toast button{border:0;background:rgba(255,176,58,.2);color:#FFCB86;font-size:12px;font-weight:700;padding:6px 9px;border-radius:9px;flex:0 0 auto}

<script>
(function () {
  'use strict';

  /* ============================================================
     utils
     ============================================================ */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function won(n) {
    var v = Math.round(Number(n) || 0);
    var sign = v < 0 ? '-' : '';
    return sign + '₩' + Math.abs(v).toLocaleString('ko-KR');
  }
  function wonShort(n) {
    var v = Math.round(Number(n) || 0);
    var a = Math.abs(v);
    if (a >= 100000000) return (v < 0 ? '-' : '') + (a / 100000000).toFixed(a >= 1000000000 ? 0 : 1).replace(/\.0$/, '') + '억원';
    if (a >= 10000000) return (v < 0 ? '-' : '') + Math.round(a / 10000).toLocaleString('ko-KR') + '만원';
    return won(v);
  }
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function today() { return ymd(new Date()); }
  function ymOf(s) { return String(s || '').slice(0, 7); }
  function monthLabel(ym) {
    if (!ym) return '';
    var p = String(ym).split('-');
    var y = Number(p[0]), m = Number(p[1]);
    var cy = new Date().getFullYear();
    if (y === cy) return m + '월';
    return String(y).slice(2) + '년 ' + m + '월';
  }
  function dateLabel(s) {
    if (!s) return '';
    var p = String(s).split('-');
    if (p.length < 3) return s;
    return Number(p[1]) + '.' + pad2(Number(p[2]));
  }
  function dateLabelYear(s) {
    if (!s) return '';
    var p = String(s).split('-');
    if (p.length < 3) return s;
    return String(p[0]).slice(2) + '.' + pad2(Number(p[1])) + '.' + pad2(Number(p[2]));
  }
  /* 날짜 입력을 YYYY-MM-DD 로 정리한다. 브라우저·입력 방식이 달라도 같은 결과가 나오게. */
  function normDate(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var m = s.match(/^(\d{4})[-.\/\s]*(\d{1,2})[-.\/\s]*(\d{1,2})\.?$/);
    if (!m) {
      var m2 = s.match(/^(\d{2})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);
      if (m2) m = ['', '20' + m2[1], m2[2], m2[3]];
    }
    if (m) {
      var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
      if (y >= 2000 && y <= 2100 && mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        var dt = new Date(y, mo - 1, d);
        if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) {
          return y + '-' + pad2(mo) + '-' + pad2(d);
        }
      }
    }
    return '';
  }
  function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function round(n) { return Math.round(Number(n) || 0); }

  var CATS = ['의류', '신발', '잡화', '가전·IT', '생활용품', '기타'];
  var CATICON = { '의류': '👕', '신발': '👟', '잡화': '👜', '가전·IT': '💻', '생활용품': '🧴', '기타': '📦' };
  var SOURCES = ['당근', '번개장터', '크림', '네이버특가', '쿠팡', '직접입력'];
  /* 판매처는 크림을 기본(첫 번째 추천)으로 둔다 — 사용자가 판매를 주로 크림에서 한다 */
  var SALE_VENUES = ['크림', '당근', '번개장터', '직접입력'];
  var SIZE_ORDER = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL', 'FREE', '프리'];

  /* ============================================================
     storage
     ============================================================ */
  var IDB_NAME = 'resellbook', IDB_STORE = 'kv', IDB_KEY = 'state';
  var LS_KEY = 'resellbook_state_v1';
  var idbPromise = null;
  var state = null;
  var saveTimer = null;

  function openIdb() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function (res, rej) {
      if (typeof indexedDB === 'undefined') { rej(new Error('no idb')); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function () { res(req.result); };
      req.onerror = function () { rej(req.error || new Error('idb error')); };
      req.onblocked = function () { rej(new Error('idb blocked')); };
    });
    return idbPromise;
  }

  function dbGet() {
    return openIdb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(IDB_STORE, 'readonly');
        var r = tx.objectStore(IDB_STORE).get(IDB_KEY);
        r.onsuccess = function () { res(r.result || null); };
        r.onerror = function () { rej(r.error); };
      });
    }).catch(function () {
      try { var raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    });
  }

  function dbSet(v) {
    return openIdb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(v, IDB_KEY);
        tx.oncomplete = function () { res(true); };
        tx.onerror = function () { rej(tx.error); };
        tx.onabort = function () { rej(tx.error); };
      });
    }).catch(function () {
      try { localStorage.setItem(LS_KEY, JSON.stringify(v)); return true; } catch (e) { return false; }
    });
  }

  /* ============================================================
     data model
     ============================================================ */
  function blank() {
    return { v: 2, items: [], txns: [], deletedIds: [], deletedTxnIds: [], settings: { targetMargin: 20 }, updatedAt: 0 };
  }

  function normMargin(v) {
    var m = Number(v);
    if (!isFinite(m)) return 20;
    m = Math.round(m);
    return clamp(m, 5, 80);
  }

  function normalize(s) {
    var out = blank();
    if (!s || typeof s !== 'object') return out;
    out.updatedAt = Number(s.updatedAt) || 0;
    var seen = {};
    (Array.isArray(s.items) ? s.items : []).forEach(function (r) {
      if (!r || !r.id) return;
      var id = String(r.id);
      if (seen[id]) return;
      seen[id] = 1;
      var q = Math.max(0, Math.round(Number(r.qty) || 0));
      var vars = [];
      (Array.isArray(r.variants) ? r.variants : []).forEach(function (v) {
        if (!v || typeof v !== 'object') return;
        var sz = String(v.size == null ? '' : v.size).trim().slice(0, 12);
        if (!sz) return;
        var vq = Math.max(0, Math.round(Number(v.qty) || 0));
        var vc = null;
        if (v.cost !== null && v.cost !== undefined && String(v.cost).trim() !== '') {
          var cn = Number(v.cost);
          vc = isFinite(cn) && cn > 0 ? Math.round(cn) : null;
        }
        vars.push({ size: sz, qty: vq, cost: vc });
      });
      var row = {
        id: id,
        name: String(r.name || '이름 없는 상품').slice(0, 80),
        cat: CATS.indexOf(r.cat) >= 0 ? r.cat : '기타',
        source: String(r.source || '').slice(0, 30),
        buyDate: normDate(r.buyDate),
        memo: String(r.memo || '').slice(0, 500),
        avgCost: Math.max(0, Number(r.avgCost != null ? r.avgCost : r.price) || 0),
        qty: q,
        status: r.status === '예약중' ? '예약중' : '판매중',
        photo: typeof r.photo === 'string' ? r.photo : '',
        totalInQty: Math.max(q, Math.round(Number(r.totalInQty) || q)),
        createdAt: Number(r.createdAt) || Date.now(),
        updatedAt: Number(r.updatedAt) || 0
      };
      if (vars.length) { row.variants = vars; syncVarTotals(row); }
      out.items.push(row);
    });
    var seenT = {};
    (Array.isArray(s.txns) ? s.txns : []).forEach(function (r) {
      if (!r || !r.id) return;
      var id = String(r.id);
      if (seenT[id]) return;
      seenT[id] = 1;
      var type = r.type === 'in' ? 'in' : 'sale';
      var qty = type === 'in' ? Math.max(0, round(r.qty)) : Math.max(1, round(r.qty) || 1);
      out.txns.push({
        id: id,
        type: type,
        pid: String(r.pid || ''),
        name: String(r.name || '상품').slice(0, 80),
        date: normDate(r.date) || today(),
        qty: qty,
        unitPrice: Math.max(0, Number(r.unitPrice) || 0),
        total: Math.max(0, Number(r.total) || 0),
        fee: Math.max(0, Number(r.fee) || 0),
        ship: Math.max(0, Number(r.ship) || 0),
        costUnit: Math.max(0, Number(r.costUnit) || 0),
        costTotal: Math.max(0, Number(r.costTotal) || 0),
        profit: Number(r.profit) || 0,
        venue: String(r.venue || r.source || '').slice(0, 30),
        memo: String(r.memo || '').slice(0, 300),
        size: String(r.size || '').slice(0, 12),
        costUnknown: !!r.costUnknown,
        createdAt: Number(r.createdAt) || Date.now(),
        updatedAt: Number(r.updatedAt) || 0
      });
    });
    out.deletedIds = Array.isArray(s.deletedIds) ? s.deletedIds.map(String) : [];
    out.deletedTxnIds = Array.isArray(s.deletedTxnIds) ? s.deletedTxnIds.map(String) : [];
    out.settings = { targetMargin: normMargin(s.settings && s.settings.targetMargin) };
    return out;
  }

  function effStatus(it) {
    if (itemQty(it) <= 0) return '완판';
    return it.status === '예약중' ? '예약중' : '판매중';
  }

  /* ============================================================
     사이즈(옵션)별 수량·단가
     ============================================================ */
  function hasVar(it) { return !!(it && Array.isArray(it.variants) && it.variants.length); }

  function varQty(it) {
    if (!hasVar(it)) return Math.max(0, Number(it.qty) || 0);
    var n = 0;
    it.variants.forEach(function (v) { n += Math.max(0, Number(v.qty) || 0); });
    return n;
  }
  function itemQty(it) { return varQty(it); }

  function costReady(v) { return v && v.cost != null && Number(v.cost) > 0; }

  /* 원가가 입력된 수량만 — 미입력분은 원가 합계·평균에서 빠진다 */
  function costKnownQty(it) {
    if (!hasVar(it)) return (Number(it.avgCost) || 0) > 0 ? Math.max(0, Number(it.qty) || 0) : 0;
    var n = 0;
    it.variants.forEach(function (v) { if (costReady(v)) n += Math.max(0, Number(v.qty) || 0); });
    return n;
  }
  function unknownQty(it) {
    if (!hasVar(it)) return (Number(it.avgCost) || 0) > 0 ? 0 : Math.max(0, Number(it.qty) || 0);
    var n = 0;
    it.variants.forEach(function (v) { if (!costReady(v)) n += Math.max(0, Number(v.qty) || 0); });
    return n;
  }
  function itemValue(it) {
    if (!hasVar(it)) return Math.max(0, Number(it.qty) || 0) * (Number(it.avgCost) || 0);
    var v = 0;
    it.variants.forEach(function (x) { if (costReady(x)) v += Math.max(0, Number(x.qty) || 0) * Number(x.cost); });
    return v;
  }
  /* 가중 평균 단가 — 원가 미입력 사이즈는 제외. 없으면 null (지어내지 않는다) */
  function itemAvg(it) {
    if (!hasVar(it)) return (Number(it.avgCost) || 0) > 0 ? Math.round(Number(it.avgCost)) : null;
    var q = costKnownQty(it);
    if (!q) return null;
    return Math.round(itemValue(it) / q);
  }
  function costSpread(it) {
    if (!hasVar(it)) return false;
    var set = {};
    it.variants.forEach(function (v) { if ((Number(v.qty) || 0) > 0 && costReady(v)) set[Math.round(v.cost)] = 1; });
    return Object.keys(set).length > 1;
  }
  function heldSizes(it) {
    if (!hasVar(it)) return [];
    return it.variants.filter(function (v) { return (Number(v.qty) || 0) > 0; });
  }
  function syncVarTotals(it) {
    if (!hasVar(it)) return;
    it.qty = varQty(it);
    var avg = itemAvg(it);
    it.avgCost = avg == null ? 0 : avg;
  }
  function sizeRank(s) {
    var u = String(s || '').toUpperCase().trim();
    var i = SIZE_ORDER.indexOf(u);
    if (i >= 0) return [0, i, 0];
    var m = u.match(/^(\d+(?:\.\d+)?)\s*([A-Z]*)$/);
    if (m) return [1, Number(m[1]), m[2]];
    return [2, 0, 0];
  }
  function bySizeOrder(a, b) {
    var ra = sizeRank(a.size), rb = sizeRank(b.size);
    if (ra[0] !== rb[0]) return ra[0] - rb[0];
    if (ra[1] !== rb[1]) return ra[1] - rb[1];
    if (String(ra[2]) !== String(rb[2])) return String(ra[2]) < String(rb[2]) ? -1 : 1;
    return String(a.size).localeCompare(String(b.size), 'ko');
  }
  function sizeChips(it) {
    return heldSizes(it).slice().sort(bySizeOrder).map(function (v) {
      return '<span class="szchip">' + esc(v.size) + '<b>' + (Number(v.qty) || 0) + '</b></span>';
    }).join('');
  }

  /* 목표 마진율 기준 추천 판매가 (100원 단위 올림) */
  function targetMargin() { return normMargin(state && state.settings && state.settings.targetMargin); }
  function priceAt(cost, m) {
    if (cost == null || !(Number(cost) > 0)) return null;
    var mg = normMargin(m == null ? targetMargin() : m);
    return Math.ceil((Number(cost) / (1 - mg / 100)) / 100) * 100;
  }
  function recommendPrice(cost) { return priceAt(cost, targetMargin()); }

  /* 전체 재고 기준 목표 마진·예상 손익 (원가 입력분만) */
  function marginPlan() {
    var m = targetMargin();
    var cost = 0, rev = 0, qty = 0, unknownQ = 0, unknownKinds = 0, kinds = 0;
    state.items.forEach(function (it) {
      var q = itemQty(it);
      if (q <= 0) return;
      kinds++;
      if (hasVar(it)) {
        var unk = 0;
        it.variants.forEach(function (v) {
          var vq = Math.max(0, Number(v.qty) || 0);
          if (vq <= 0) return;
          if (costReady(v)) {
            cost += vq * Number(v.cost);
            rev += vq * priceAt(v.cost, m);
            qty += vq;
          } else { unk += vq; }
        });
        if (unk > 0) { unknownQ += unk; unknownKinds++; }
      } else {
        var c = Number(it.avgCost) || 0;
        if (c > 0) { cost += q * c; rev += q * priceAt(c, m); qty += q; }
        else { unknownQ += q; unknownKinds++; }
      }
    });
    return {
      margin: m, cost: cost, rev: rev, profit: rev - cost, qty: qty,
      unknownQ: unknownQ, unknownKinds: unknownKinds, kinds: kinds
    };
  }

  function itemById(id) {
    for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
    return null;
  }

  function save(opts) {
    state.updatedAt = Date.now();
    dbSet(state);
    if (!opts || opts.sync !== false) scheduleSync();
  }

  /* ============================================================
     aggregates
     ============================================================ */
  function invStats() {
    var value = 0, qty = 0, kinds = 0, onSale = 0, reserved = 0, soldOut = 0;
    var unknownQ = 0, unknownItems = 0, lowStock = 0, sizeCount = 0;
    state.items.forEach(function (it) {
      var q = itemQty(it);
      if (q > 0) {
        kinds++; qty += q; value += itemValue(it);
        if (unknownQty(it) > 0) { unknownQ += unknownQty(it); unknownItems++; }
        if (q <= 2) lowStock++;
        if (hasVar(it)) sizeCount += heldSizes(it).length;
        var st = effStatus(it);
        if (st === '예약중') reserved++; else onSale++;
      } else { soldOut++; }
    });
    return {
      value: value, qty: qty, kinds: kinds, onSale: onSale, reserved: reserved, soldOut: soldOut,
      unknownQ: unknownQ, unknownItems: unknownItems, lowStock: lowStock, sizeCount: sizeCount
    };
  }

  function saleStats(month) {
    var revenue = 0, cost = 0, fee = 0, ship = 0, profit = 0, count = 0, qty = 0;
    state.txns.forEach(function (t) {
      if (t.type !== 'sale') return;
      if (month && month !== 'all' && ymOf(t.date) !== month) return;
      revenue += t.total; cost += t.costTotal; fee += t.fee; ship += t.ship;
      profit += t.profit; count++; qty += t.qty;
    });
    var margin = revenue ? (profit / revenue) * 100 : 0;
    return { revenue: revenue, cost: cost, fee: fee, ship: ship, profit: profit, count: count, qty: qty, margin: margin };
  }

  function monthList() {
    var set = {};
    state.txns.forEach(function (t) { if (t.date) set[ymOf(t.date)] = 1; });
    return Object.keys(set).sort().reverse();
  }

  function profitClass(n) { return n > 0 ? 'ok' : (n < 0 ? 'bad' : ''); }

  /* ============================================================
     view state
     ============================================================ */
  var view = {
    tab: 'inv',
    q: '',
    status: 'all',
    cat: 'all',
    sort: 'recent',
    month: 'all',
    txType: 'all',
    plMonth: ''
  };

  /* ============================================================
     render: header + dashboard
     ============================================================ */
  function renderHead() {
    var s = invStats();
    var sub = $('#head-sub');
    if (!state.items.length) { sub.textContent = '재고와 손익을 한 곳에'; return; }
    sub.textContent = '재고 ' + s.kinds + '종 · 잔여 ' + s.qty + '개 · ' + wonShort(s.value);
  }

  function renderMonthbar() {
    var months = monthList();
    var bar = $('#monthbar');
    if (!months.length) { bar.innerHTML = ''; bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    var html = '<button class="mchip' + (view.month === 'all' ? ' on' : '') + '" data-act="month" data-month="all">전체</button>';
    months.forEach(function (m) {
      html += '<button class="mchip' + (view.month === m ? ' on' : '') + '" data-act="month" data-month="' + m + '">' + esc(monthLabel(m)) + '</button>';
    });
    bar.innerHTML = html;
  }

  function renderDash() {
    var inv = invStats();
    var st = saleStats(view.month);
    var label = view.month === 'all' ? '누적' : monthLabel(view.month);
    var marginTxt = st.revenue ? '마진 ' + st.margin.toFixed(1) + '%' : '판매 기록 없음';
    var html = '';
    html += '<div class="kpi">' +
      '<div class="k">📦 재고 가치 <span style="color:var(--muted2)">·원가</span></div>' +
      '<div class="v">' + wonShort(inv.value) + '</div>' +
      '<div class="s">' + inv.kinds + '종 · 잔여 ' + inv.qty + '개' + (inv.sizeCount ? ' · ' + inv.sizeCount + '사이즈' : '') + '</div>' +
      '</div>';
    html += '<div class="kpi">' +
      '<div class="k">💰 매출 <span style="color:var(--muted2)">·' + esc(label) + '</span></div>' +
      '<div class="v">' + wonShort(st.revenue) + '</div>' +
      '<div class="s">' + st.count + '건 · ' + st.qty + '개 판매</div>' +
      '</div>';
    html += '<div class="kpi">' +
      '<div class="k">📈 순수익 <span style="color:var(--muted2)">·' + esc(label) + '</span></div>' +
      '<div class="v ' + profitClass(st.profit) + '">' + (st.revenue ? (st.profit < 0 ? '-' : '') + wonShort(Math.abs(st.profit)) : won(0)) + '</div>' +
      '<div class="s">' + esc(marginTxt) + '</div>' +
      '</div>';
    html += '<div class="kpi">' +
      '<div class="k">🏷️ 판매 중</div>' +
      '<div class="v">' + inv.onSale + '<small>종</small></div>' +
      '<div class="s">' + (inv.reserved ? '예약중 ' + inv.reserved + '종 · ' : '') + '완판 ' + inv.soldOut + '종</div>' +
      '<button class="kpilink" data-act="status" data-status="품절임박">🔥 품절 임박 ' + inv.lowStock + '건</button>' +
      '</div>';
    html += marginCardHtml();
    if (inv.unknownQ > 0) {
      html += '<div class="dnote" style="grid-column:1/-1">가격 미입력 ' + inv.unknownQ + '개 · ' + inv.unknownItems + '종은 재고 원가·평균에서 빠져 있어요. 단가를 넣으면 바로 반영됩니다.</div>';
    }
    html += '<div style="grid-column:1/-1">' + monthChartHtml() + '</div>';
    $('#dash').innerHTML = html;
  }

  function marginCardHtml() {
    var p = marginPlan();
    var presets = [10, 20, 30, 40].map(function (m) {
      return '<button type="button" data-act="margin" data-set="' + m + '"' + (m === p.margin ? ' class="on"' : '') + '>' + m + '%</button>';
    }).join('');
    var note = p.unknownQ > 0
      ? '원가 미입력 <b>' + p.unknownQ + '개·' + p.unknownKinds + '종</b>은 계산에서 빠졌어요 · 수수료·배송비 제외'
      : '보유 ' + p.kinds + '종 전부 반영 · 수수료·배송비 제외';
    return '<div class="mcard">' +
      '<div class="mc-head"><b>🎯 목표 마진 · 예상 손익</b><span>원가 입력 ' + p.qty + '개 기준</span></div>' +
      '<div class="mc-ctl">' +
        '<button class="mc-btn" data-act="margin" data-add="-5" aria-label="목표 마진 5% 낮추기">−</button>' +
        '<div class="mc-val">' + p.margin + '<small>%</small></div>' +
        '<button class="mc-btn" data-act="margin" data-add="5" aria-label="목표 마진 5% 높이기">＋</button>' +
        '<div class="mc-presets">' + presets + '</div>' +
      '</div>' +
      '<div class="mc-grid">' +
        '<div class="mc-cell"><div class="k">총 원가</div><div class="v">' + won(p.cost) + '</div></div>' +
        '<div class="mc-cell"><div class="k">목표 판매가 합계</div><div class="v">' + won(p.rev) + '</div></div>' +
        '<div class="mc-cell wide"><div class="k">예상 총 순이익</div><div class="v">' +
          (p.profit > 0 ? '+' : '') + won(p.profit) + '</div></div>' +
      '</div>' +
      '<div class="mc-note">' + note + '</div>' +
      '</div>';
  }

  function monthChartHtml() {
    var now = new Date();
    var rows = [];
    for (var i = 5; i >= 0; i--) {
      var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      var m = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      rows.push({ m: m, s: saleStats(m) });
    }
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, r.s.revenue, r.s.profit); });
    var cols = rows.map(function (r) {
      var hr = max > 0 ? clamp((r.s.revenue / max) * 100, 0, 100) : 0;
      var hp = max > 0 ? clamp((r.s.profit / max) * 100, 0, 100) : 0;
      var tip = monthLabel(r.m) + ' · 매출 ' + won(r.s.revenue) + ' · 순수익 ' + won(r.s.profit) + ' · ' + r.s.count + '건';
      return '<div class="cbarcol" title="' + esc(tip) + '" data-m="' + r.m + '">' +
        '<div class="bnum">' + (r.s.revenue ? wonShort(r.s.revenue) : '') + '</div>' +
        '<div class="cpair">' +
        (hr > 0 ? '<div class="bar rev" style="height:' + hr + '%"></div>' : '') +
        (hp > 0 ? '<div class="bar prf" style="height:' + hp + '%"></div>' : '') +
        '</div>' +
        '<div class="mlbl">' + esc(monthLabel(r.m)) + '</div>' +
        '<div class="pnum">' + (r.s.profit ? wonShort(r.s.profit) : '') + '</div>' +
        '</div>';
    }).join('');
    return '<div class="chartcard">' +
      '<div class="ch-head"><b>최근 6개월 추이</b><span>매출 · 순수익</span></div>' +
      (max > 0 ? '<div class="cbars">' + cols + '</div>' :
        '<div class="chempty"><span>아직 판매 기록이 없어요.<br /><b>[판매]</b>를 누르면 여기에 추이가 그려집니다.</span></div>') +
      '<div class="legend"><span><i style="background:var(--accent)"></i>매출</span><span><i style="background:var(--ok)"></i>순수익</span>' +
      (max > 0 ? '<span style="margin-left:auto;color:var(--muted2)">막대에 마우스를 올리면 정확한 금액</span>' : '') +
      '</div>' +
      '</div>';
  }

  /* ============================================================
     render: inventory
     ============================================================ */
  function filteredItems() {
    var q = view.q.trim().toLowerCase();
    var list = state.items.filter(function (it) {
      if (q) {
        var hay = (it.name + ' ' + it.source + ' ' + it.cat + ' ' + it.memo + ' ' +
          (hasVar(it) ? it.variants.map(function (v) { return v.size; }).join(' ') : '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      var st = effStatus(it);
      var qq = itemQty(it);
      /* 재고 목록 기본 = 실제 보유(qty>0)만. 완판 항목은 '완판' 칩에서만 보인다 */
      if (view.status === '완판') {
        if (qq > 0) return false;
      } else if (qq <= 0) return false;
      if (view.status === '품절임박') {
        if (!(qq >= 1 && qq <= 2)) return false;
      } else if (view.status !== 'all' && view.status !== '완판' && st !== view.status) return false;
      if (view.cat !== 'all' && it.cat !== view.cat) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (view.sort === 'qty') return (itemQty(b) - itemQty(a)) || (b.updatedAt - a.updatedAt);
      if (view.sort === 'value') return (itemValue(b) - itemValue(a)) || (b.updatedAt - a.updatedAt);
      if (view.sort === 'name') return String(a.name).localeCompare(String(b.name), 'ko');
      /* 최근 등록순 — 완판(잔여 0)은 뒤로 */
      var za = itemQty(a) > 0 ? 0 : 1, zb = itemQty(b) > 0 ? 0 : 1;
      if (za !== zb) return za - zb;
      return (b.createdAt - a.createdAt);
    });
    return list;
  }

  function renderStatusChips() {
    var counts = { all: 0, '판매중': 0, '예약중': 0, '완판': 0, '품절임박': 0 };
    state.items.forEach(function (it) {
      var st = effStatus(it), q = itemQty(it);
      if (q > 0) { counts.all++; counts[st]++; }
      else counts['완판']++;
      if (st !== '완판' && q >= 1 && q <= 2) counts['품절임박']++;
    });
    var defs = [['all', '전체'], ['판매중', '판매중'], ['예약중', '예약중'], ['품절임박', '품절 임박']];
    if (counts['완판']) defs.push(['완판', '완판']);
    $('#statuschips').innerHTML = defs.map(function (d) {
      return '<button class="chip' + (view.status === d[0] ? ' on' : '') + '" data-act="status" data-status="' + d[0] + '">' +
        d[1] + '<span class="n">' + (counts[d[0]] || 0) + '</span></button>';
    }).join('');
  }

  function thumbHtml(it, cls) {
    var size = cls || '';
    if (it.photo) return '<div class="thumb ' + size + '"><img src="' + it.photo + '" alt="" loading="lazy" /></div>';
    return '<div class="thumb ' + size + '">' + (CATICON[it.cat] || '📦') + '</div>';
  }

  function itemCard(it) {
    var st = effStatus(it);
    var q = itemQty(it);
    var avg = itemAvg(it);
    var unk = unknownQty(it);
    var rec = recommendPrice(avg);
    var meta = [];
    meta.push(it.cat);
    if (it.source) meta.push(it.source);
    if (it.buyDate) meta.push(dateLabelYear(it.buyDate));
    var money = '잔여 <b>' + q + '개</b>';
    if (avg != null) money += ' · ' + (costSpread(it) ? '평균 ' : '원가 ') + '<b>' + won(avg) + '</b>';
    var val = itemValue(it);
    if (q > 0 && val > 0) money += ' · 재고 ' + won(val);
    var tags = '';
    if (unk > 0 && q > 0) tags += '<span class="tagwarn">가격 미입력' + (unk < q ? ' ' + unk + '개' : '') + '</span>';
    if (rec != null && q > 0) tags += '<span class="tagrec">목표' + targetMargin() + '% ' + wonShort(rec) + '</span>';
    if (q > 0 && q <= 2) tags += '<span class="taglow">품절 임박</span>';
    var multiSize = hasVar(it) && heldSizes(it).length > 1;
    var act = multiSize
      ? '<button class="mini" data-act="detail" data-id="' + esc(it.id) + '">사이즈</button>'
      : '<div class="stepper"><button data-act="minus" data-id="' + esc(it.id) + '" aria-label="수량 줄이기">−</button>' +
        '<span class="q">' + q + '</span>' +
        '<button data-act="plus" data-id="' + esc(it.id) + '" aria-label="수량 늘리기">+</button></div>';
    var html = '<div class="pcard' + (q <= 0 ? ' sold' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button class="pmenu" data-act="menu" data-id="' + esc(it.id) + '" aria-label="상품 메뉴">⋯</button>' +
      thumbHtml(it) +
      '<div class="pmain">' +
      '<div class="ptop"><div class="pname" data-act="detail" data-id="' + esc(it.id) + '">' + esc(it.name) + '</div>' +
      '<span class="badge ' + st + '">' + st + '</span></div>' +
      '<div class="pmeta">' + esc(meta.join(' · ')) + '</div>' +
      (q > 0 && heldSizes(it).length ? '<div class="sizerow"><span class="szlab">보유 사이즈</span>' + sizeChips(it) + '</div>' : '') +
      '<div class="pmoney"><span>' + money + '</span>' + tags + '</div>' +
      '<div class="pact">' + act +
      '<button class="mini sell" data-act="sell" data-id="' + esc(it.id) + '"' + (q <= 0 ? ' disabled' : '') + '>판매</button>' +
      '<button class="mini" data-act="restock" data-id="' + esc(it.id) + '">입고</button>' +
      '</div></div></div>';
    return html;
  }

  function emptyInventory() {
    return '<div class="empty">' +
      '<div class="big">📒</div>' +
      '<h3>아직 등록한 상품이 없어요</h3>' +
      '<p>당근·번개장터에서 산 물건을 원가로 적어두면<br />재고와 순수익이 자동으로 계산돼요.</p>' +
      '<button class="btn-primary" data-act="add">＋ 첫 상품 등록</button>' +
      '<div class="hintbox">상품명 · 구매가 · 수량만 넣으면 시작돼요. 사진은 나중에 붙여도 됩니다.</div>' +
      '</div>';
  }

  function renderInv() {
    var grid = $('#invgrid');
    if (!state.items.length) { grid.innerHTML = emptyInventory(); return; }

        '<p>재고 목록에서 <b>판매</b>나 <b>입고</b>를 누르면<br />여기에 날짜순으로 쌓입니다.</p>' +

        '</div>';
      return;
    }
    list.sort(function (a, b) {

      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    var groups = {}, order = [];
    list.forEach(function (t) {
      var k = ymOf(t.date);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(t);
    });

    var html = '';
    order.forEach(function (k) {
      var rows = groups[k];
      var rev = 0, prf = 0, cnt = 0;
      rows.forEach(function (t) { if (t.type === 'sale') { rev += t.total; prf += t.profit; cnt++; } });
      html += '<div class="grouphead"><h4>' + esc(monthLabel(k)) + ' · ' + k.slice(0, 4) + '</h4>' +
        '<span>' + (cnt ? '매출 ' + wonShort(rev) + ' · 순익 ' + wonShort(prf) : '입고 ' + rows.length + '건') + '</span></div>';
      rows.forEach(function (t) { html += txRow(t); });
    });

  function txRow(t) {
    if (t.type === 'sale') {
      var margin = t.total ? Math.round((t.profit / t.total) * 1000) / 10 : 0;
      var meta = dateLabel(t.date) + ' · ' + (t.venue || '판매') + (t.size ? ' · ' + t.size : '') + ' · ' + t.qty + '개 × ' + won(t.unitPrice);
      if (t.fee || t.ship) meta += ' · 비용 ' + won(t.fee + t.ship);
      if (t.costUnknown) meta += ' · 원가 미입력';
      return '<div class="tx">' +
        '<div class="tag sale">💰</div>' +
        '<div class="tbody"><div class="t1">' + esc(t.name) + '</div><div class="t2">' + esc(meta) + '</div></div>' +
        '<div class="tright"><div class="amt">' + won(t.total) + '</div>' +
        '<div class="pf ' + profitClass(t.profit) + '">순익 ' + (t.profit < 0 ? '-' : '') + won(Math.abs(t.profit)) + ' · ' + margin + '%</div></div>' +
        '<button class="del" data-act="txdel" data-id="' + esc(t.id) + '" aria-label="삭제">✕</button>' +
        '</div>';

      '<div class="tag in">📥</div>' +
      '<div class="tbody"><div class="t1">' + esc(t.name) + '</div><div class="t2">' + esc(meta2) + '</div></div>' +
      '<div class="tright"><div class="amt in">-' + won(t.unitPrice * t.qty) + '</div>' +
      '<div class="pf" style="color:var(--muted2)">재고 +' + t.qty + '</div></div>' +
      '<button class="del" data-act="txdel" data-id="' + esc(t.id) + '" aria-label="삭제">✕</button>' +
      '</div>';
  }

      '</div>';

      cell('매출', won(st.revenue), '') +

      cell('마진율', st.revenue ? st.margin.toFixed(1) + '%' : '—', '') +
      '</div>';

    /* 6개월 막대그래프 */
    var now = new Date();

        var hp = maxRev > 0 ? clamp((b.s.profit / maxRev) * 100, 0, 100) : 0;

          '<div class="pair">' +
          (h > 0 ? '<div class="bar rev" style="height:' + h + '%"></div>' : '') +
          (hp > 0 ? '<div class="bar prf" style="height:' + hp + '%"></div>' : '') +
          '</div>' +
          '<div class="lbl">' + esc(monthLabel(b.m)) + '</div>' +

      '<div class="legend"><span><i style="background:var(--accent)"></i>매출</span><span><i style="background:var(--ok)"></i>순수익</span></div>'
        : '<div class="chempty"><span>아직 판매 기록이 없어요.<br />재고 목록에서 <b>[판매]</b>를 누르면 월별 손익이 그려집니다.</span></div>');

    /* 카테고리별 */
    var byCat = {};
    state.txns.forEach(function (t) {
      if (t.type !== 'sale' || ymOf(t.date) !== cur) return;
      var it = itemById(t.pid);
      var cat = it ? it.cat : '기타';
      if (!byCat[cat]) byCat[cat] = { profit: 0, revenue: 0, count: 0 };
      byCat[cat].profit += t.profit; byCat[cat].revenue += t.total; byCat[cat].count++;
    });
    var catKeys = Object.keys(byCat).sort(function (a, b) { return byCat[b].profit - byCat[a].profit; });
    var catHtml = catKeys.length ? '<div class="sec-title">카테고리별 순수익</div>' + catKeys.map(function (c) {

        '<span class="cv ' + profitClass(byCat[c].profit) + '" style="color:' + (byCat[c].profit < 0 ? '#E5484D' : '#1B1F24') + '">' + won(byCat[c].profit) + '</span></div>';
    }).join('') : '';

    var emptyNote = st.count ? '' : '<div class="note" style="margin:-2px 2px 4px">이 달은 판매 기록이 없어요. 재고 탭에서 <b>[판매]</b>를 누르면 자동으로 집계됩니다.</div>';

  /* ============================================================
     toast / confirm / sheets
     ============================================================ */
  function toast(msg, opts) {
    var root = $('#toast-root');
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span class="msg">' + msg + '</span>' + (opts && opts.action ? '<button data-t="act">' + esc(opts.action) + '</button>' : '');
    root.appendChild(el);
    var ttl = (opts && opts.ms) || 4200;
    var kill = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    var timer = setTimeout(kill, ttl);
    if (opts && opts.action && opts.onAction) {
      el.querySelector('[data-t="act"]').onclick = function () {
        clearTimeout(timer); kill();
        opts.onAction();
      };
    }
    return el;
  }

  var activeSheet = null;

  function closeSheet() {
    if (!activeSheet) return;
    var cb = activeSheet.onClose;
    if (activeSheet.back) activeSheet.back.remove();
    if (activeSheet.sheet) activeSheet.sheet.remove();
    activeSheet = null;
    document.body.style.overflow = '';
    if (cb) { try { cb(); } catch (e) { } }
  }

  function openSheet(opt) {
    closeSheet();
    var back = document.createElement('div');
    back.className = 'backdrop';
    back.addEventListener('click', closeSheet);
    var sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sheet-head"><h2>' + (opt.title || '') +
      (opt.sub ? ' <span class="sub">' + esc(opt.sub) + '</span>' : '') +
      '</h2><button class="xbtn" data-x="1" aria-label="닫기">✕</button></div>' +
      '<div class="sheet-body">' + (opt.body || '') + '</div>' +
      (opt.foot ? '<div class="sheet-foot">' + opt.foot + '</div>' : '');
    document.body.appendChild(back);
    document.body.appendChild(sheet);
    document.body.style.overflow = 'hidden';
    activeSheet = { back: back, sheet: sheet, onClose: opt.onClose || null };
    sheet.querySelector('[data-x]').addEventListener('click', closeSheet);
    if (opt.onMount) opt.onMount(sheet);
    return sheet;
  }

  function confirmSheet(opt) {
    return new Promise(function (resolve) {
      var done = false;
      var sheet = openSheet({
        title: opt.title || '확인',
        body: '<div class="note" style="font-size:12.5px;color:var(--muted);line-height:1.65">' + opt.text + '</div>',
        foot: '<button class="btn ghost" data-c="0">취소</button>' +
          '<button class="btn ' + (opt.danger ? 'danger' : 'primary') + '" data-c="1">' + esc(opt.ok || '확인') + '</button>',
        onClose: function () { if (!done) { done = true; resolve(false); } }
      });
      function fin(v) { if (done) return; done = true; closeSheet(); resolve(v); }
      sheet.querySelector('[data-c="0"]').onclick = function () { fin(false); };
      sheet.querySelector('[data-c="1"]').onclick = function () { fin(true); };
    });
  }

  /* ============================================================
     photo compress
     ============================================================ */
  function compressImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 720;
        var w = img.width, h = img.height;
        if (Math.max(w, h) > max) {
          var r = max / Math.max(w, h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        var out = c.toDataURL('image/jpeg', 0.72);
        cb(out);
      };
      img.onerror = function () { cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(null); };
    reader.readAsDataURL(file);
  }
