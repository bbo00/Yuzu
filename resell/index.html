        it.qty = Math.max(0, q - delta); it.updatedAt = Date.now(); save(); renderAll();
      }
    });
  }

  /* ============================================================
     sync (MantleDB · 무료·가입 없음)
     ============================================================ */
  var SYNC_BASE = 'https://mantledb.sh/v2/';
  var SYNC_CFG_KEY = 'resellbook_sync_v1';
  var PART_MAX = 58000;
  var PARTS_PER_NS = 88;
  var TOUCH_MS = 14 * 24 * 60 * 60 * 1000;

  var syncCfg = null;
  var syncBusy = false;
  var syncTimer = null;

  function syncLoad() {
    try { syncCfg = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null'); } catch (e) { syncCfg = null; }
    if (!syncCfg) syncCfg = { ns: '', rev: 0, lastSync: 0, deviceId: '', lastCount: null, lastError: '', lastPushTs: 0, dirty: false };
    if (!syncCfg.deviceId) syncCfg.deviceId = 'dev-' + Math.random().toString(36).slice(2, 8);
    return syncCfg;
  }
  function syncSave() {
    try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); } catch (e) { }
  }
  function syncOn() { return !!(syncCfg && syncCfg.ns); }

  function syncNewNs() {
    var abc = 'abcdefghijkmnpqrstuvwxyz23456789', s = '';
    for (var i = 0; i < 10; i++) s += abc[Math.floor(Math.random() * abc.length)];
    return 'resellbook-' + s;
  }
  function nsForPart(i) {
    var b = Math.floor(i / PARTS_PER_NS);
    return b === 0 ? syncCfg.ns : syncCfg.ns + '-p' + b;
  }

  function escLen(ch) {
    var cc = ch.charCodeAt(0);
    if (ch === '"' || ch === '\\') return 2;
    if (cc < 0x20) return 6;
    if (cc < 0x80) return 1;
    if (cc < 0x800) return 2;
    if (cc >= 0xD800 && cc <= 0xDBFF) return 4;
    if (cc >= 0xDC00 && cc <= 0xDFFF) return 0;
    return 3;
  }
  function chunk(doc, max) {
    var parts = [], cur = '', len = 0;
    for (var i = 0; i < doc.length; i++) {
      var ch = doc[i], b = escLen(ch);
      if (len + b > max) { parts.push(cur); cur = ch; len = b; }
      else { cur += ch; len += b; }
    }
    if (cur) parts.push(cur);
    return parts;
  }

  function syncFetch(url, opt) {
    var ctrl = new AbortController();
    var tm = setTimeout(function () { ctrl.abort(); }, 20000);
    return fetch(url, Object.assign({ signal: ctrl.signal, cache: 'no-store' }, opt || {})).then(function (r) {
      clearTimeout(tm); return r;
    }, function (e) { clearTimeout(tm); throw e; });
  }
  function syncPost(path, obj) {
    return syncFetch(SYNC_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    });
  }
  function syncGet(path) {
    return syncFetch(SYNC_BASE + path, { method: 'GET' }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (t) {
        if (!t) return null;
        try { return JSON.parse(t); } catch (e) { return null; }
      });
    });
  }

  function syncDataSnapshot() {
    return {
      items: state.items, txns: state.txns,
      deletedIds: state.deletedIds, deletedTxnIds: state.deletedTxnIds,
      updatedAt: state.updatedAt
    };
  }

  function syncPush() {
    if (!syncOn()) return Promise.reject(new Error('동기화 코드가 없습니다'));
    var inv = invStats();
    var doc = JSON.stringify({ v: 1, app: 'resellbook', ts: Date.now(), device: syncCfg.deviceId, data: syncDataSnapshot() });
    var parts = chunk(doc, PART_MAX);
    if (parts.length > PARTS_PER_NS * 4) return Promise.reject(new Error('데이터가 너무 큽니다 (' + parts.length + '조각)'));
    var chain = Promise.resolve();
    parts.forEach(function (p, i) {
      chain = chain.then(function () { return syncPost(nsForPart(i) + '/v1/p' + i, { c: p }); });
    });
    return chain.then(function () {
      var rev = Math.max(Number(syncCfg.rev) || 0, Number(syncCfg.lastRemoteRev) || 0) + 1;
      var manifest = {
        t: 1, app: 'resellbook', rev: rev, ts: Date.now(), device: syncCfg.deviceId,
        parts: parts.map(function (p, i) { return { ns: nsForPart(i), k: 'v1/p' + i }; }),
        counts: { items: state.items.length, txns: state.txns.length, qty: inv.qty, value: inv.value },
        bytes: doc.length
      };
      return syncPost(syncCfg.ns + '/v1/manifest', manifest).then(function () {
        syncCfg.rev = rev;
        syncCfg.lastRemoteRev = rev;
        syncCfg.lastSync = Date.now();
        syncCfg.lastPushTs = manifest.ts;
        syncCfg.lastCount = manifest.counts;
        syncCfg.lastError = '';
        syncCfg.dirty = false;
        syncSave();
        renderSyncDot();
        return manifest;
      });
    });
  }

  function syncPull() {
    if (!syncOn()) return Promise.resolve(null);
    return syncGet(syncCfg.ns + '/v1/manifest').then(function (m) {
      if (!m || !m.parts || !m.parts.length) return null;
      var chain = Promise.resolve(''), buf = '';
      m.parts.forEach(function (p) {
        chain = chain.then(function () {
          return syncGet(p.ns + '/' + p.k).then(function (part) {
            if (!part || typeof part.c !== 'string') throw new Error('원격 조각이 만료되었습니다');
            buf += part.c;
          });
        });
      });
      return chain.then(function () {
        var doc = null;
        try { doc = JSON.parse(buf); } catch (e) { doc = null; }
        if (!doc || !doc.data) throw new Error('원격 데이터 형식이 올바르지 않습니다');
        return { manifest: m, doc: doc };
      });
    });
  }

  function mergeData(local, remote) {
    var stats = { added: 0, updated: 0, deleted: 0 };
    var delIds = {};
    (local.deletedIds || []).concat(remote.deletedIds || []).forEach(function (x) { delIds[String(x)] = 1; });
    var delTx = {};
    (local.deletedTxnIds || []).concat(remote.deletedTxnIds || []).forEach(function (x) { delTx[String(x)] = 1; });

    var items = {}, order = [];
    (local.items || []).forEach(function (x) { if (!items[x.id]) order.push(x.id); items[x.id] = x; });
    (remote.items || []).forEach(function (r) {
      var cur = items[r.id];
      if (!cur) { items[r.id] = r; order.push(r.id); stats.added++; return; }
      if (Number(r.updatedAt || 0) > Number(cur.updatedAt || 0)) { items[r.id] = r; stats.updated++; }
    });
    var txns = {}, torder = [];
    (local.txns || []).forEach(function (x) { if (!txns[x.id]) torder.push(x.id); txns[x.id] = x; });
    (remote.txns || []).forEach(function (r) {
      var cur = txns[r.id];
      if (!cur) { txns[r.id] = r; torder.push(r.id); stats.added++; return; }
      if (Number(r.updatedAt || 0) > Number(cur.updatedAt || 0)) { txns[r.id] = r; stats.updated++; }
    });
    var merged = {
      v: 1,
      items: order.map(function (k) { return items[k]; }).filter(function (x) { return !delIds[String(x.id)]; }),
      txns: torder.map(function (k) { return txns[k]; }).filter(function (x) { return !delTx[String(x.id)]; }),
      deletedIds: Object.keys(delIds),
      deletedTxnIds: Object.keys(delTx),
      updatedAt: Math.max(Number(local.updatedAt) || 0, Number(remote.updatedAt) || 0)
    };
    stats.changed = JSON.stringify(merged) !== JSON.stringify(local);
    return { data: merged, stats: stats };
  }

  function syncNow(opt) {
    var silent = opt && opt.silent;
    if (!syncOn()) { if (!silent) { openSyncSheet(); } return Promise.resolve(null); }
    if (syncBusy) return Promise.resolve(null);
    syncBusy = true;
    renderSyncDot();
    return syncPull().then(function (res) {
      var needPush = false;
      if (!res) {
        // 원격이 비었거나 만료 → 기기 데이터를 올린다
        needPush = true;
        syncCfg.rev = 0;
      } else {
        var m = res.manifest;
        syncCfg.lastRemoteRev = Number(m.rev) || 0;
        if (m.rev === syncCfg.rev && Number(m.ts) <= Number(syncCfg.lastPushTs || 0) && !syncCfg.dirty) {
          syncCfg.lastSync = Date.now();
          syncCfg.lastCount = m.counts || syncCfg.lastCount;
          syncCfg.lastError = '';
          syncSave();
          return null;
        }
        var merged = mergeData(syncDataSnapshot(), res.doc.data);
        if (merged.stats.changed) {
          state = normalize(merged.data);
          dbSet(state);
          renderAll();
        }
        syncCfg.lastCount = m.counts || syncCfg.lastCount;
        needPush = true;
        if (merged.stats.changed && !silent) {
          // 사용자에게 알릴 변화량은 아래 토스트에서
        }
        syncCfg.remoteStats = merged.stats;
      }
      if (!needPush) return null;
      return syncPush().then(function () {
        var st = syncCfg.remoteStats || null;
        if (!silent) {
          var c = syncCfg.lastCount || {};
          var msg = '동기화 완료 · 재고 ' + (c.items || 0) + '종 · 거래 ' + (c.txns || 0) + '건';
          if (st && (st.added || st.updated)) msg += ' <span style="color:#8b929e">(받은 항목 ' + (st.added + st.updated) + ')</span>';
          toast(msg);
        }
      });
    }).catch(function (e) {
      syncCfg.lastError = String((e && e.message) || e);
      syncSave(); renderSyncDot();
      throw e;
    }).then(function (v) {
      syncBusy = false; renderSyncDot(); return v;
    }, function (e) {
      syncBusy = false; renderSyncDot();
      if (!silent) toast('동기화 실패 · ' + esc(syncCfg.lastError));
      return null;
    });
  }

  function scheduleSync() {
    if (!syncCfg || !syncCfg.ns) return;
    syncCfg.dirty = true;
    syncSave();
    renderSyncDot();
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      syncTimer = null;
      syncNow({ silent: true }).catch(function () { });
    }, 4000);
  }

  function syncTouchIfStale() {
    if (!syncOn()) return;
    var last = Number(syncCfg.lastPushTs) || 0;
    if (last && (Date.now() - last) >= TOUCH_MS) {
      syncNow({ silent: true }).catch(function () { });
    }
  }

  function renderSyncDot() {
    var dot = $('#syncdot');
    if (!dot) return;
    dot.className = 'dot' + (!syncOn() ? '' : (syncBusy ? ' wait' : (syncCfg.lastError ? ' err' : ' on')));
  }

  /* ============================================================
     sync sheet
     ============================================================ */
  function openSyncSheet() {
    var body = '';
    var stTxt = !syncOn() ? '연결 안 됨' : (syncBusy ? '동기화 중…' : (syncCfg.lastError ? '오류: ' + syncCfg.lastError : '연결됨 · 자동 동기화'));
    var dotCls = !syncOn() ? '' : (syncBusy ? ' wait' : (syncCfg.lastError ? ' err' : ' on'));
    body += '<div class="syncbox"><div class="st"><span class="d' + dotCls + '"></span><b>' + esc(stTxt) + '</b></div>';
    if (syncOn()) {
      var last = syncCfg.lastSync ? new Date(syncCfg.lastSync) : null;
      body += '<p class="desc">마지막 동기화 ' + (last ? (pad2(last.getMonth() + 1) + '.' + pad2(last.getDate()) + ' ' + pad2(last.getHours()) + ':' + pad2(last.getMinutes())) : '없음') +
        ' · 재고 ' + state.items.length + '종 · 거래 ' + state.txns.length + '건</p>';
      body += '<div class="codebox"><input readonly value="' + esc(syncCfg.ns) + '" id="ns-code" /><button class="btn small" data-s="copycode">복사</button></div>';
      body += '<div class="syncacts"><button class="btn" data-s="now">지금 동기화</button>' +
        '<button class="btn" data-s="link">기기 연결 링크 복사</button>' +
        '<button class="btn" data-s="new">새 코드 만들기</button></div>';
      body += '<div class="syncacts"><button class="btn ghost" data-s="switch">다른 코드로 연결</button>' +
        '<button class="btn ghost" data-s="off">연결 해제</button></div>';
      body += '<div class="codebox hidden" id="switch-box"><input placeholder="받은 코드 붙여넣기 (resellbook-…)" id="ns-input" /><button class="btn small" data-s="join">연결</button></div>';
    } else {
      body += '<p class="desc">코드를 만들면 다른 기기에서도 같은 재고·거래 기록을 볼 수 있어요. 가입이나 로그인은 없습니다.</p>';
      body += '<div class="syncacts"><button class="btn primary" data-s="new" style="flex:1">새 동기화 코드 만들기</button></div>';
      body += '<div class="codebox"><input placeholder="받은 코드 붙여넣기 (resellbook-…)" id="ns-input" /><button class="btn small" data-s="join">연결</button></div>';
    }
    body += '</div>';
    body += '<div class="note">· 인터넷에 있는 무료 저장소에 암호화 없이 보관됩니다. 코드를 아는 사람은 내용을 볼 수 있어요.<br />' +
      '· 사진을 많이 넣으면 동기화가 느려질 수 있어요.<br />' +
      '· 14일 넘게 접속이 없으면 자동으로 다시 올려 보관 기간을 늘립니다.</div>';
    body += '<div class="syncbox" style="margin-top:2px"><div class="st"><b>백업 파일</b></div>' +
      '<p class="desc">JSON 파일로 내려받아 두면 클라우드와 상관없이 되살릴 수 있어요.</p>' +
      '<div class="syncacts"><button class="btn" data-s="export">📥 내보내기</button><button class="btn" data-s="import">📤 불러오기</button></div></div>';

    var sheet = openSheet({
      title: '동기화 · 백업',
      body: body,
      onMount: function (root) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-s]');
          if (!b) return;
          var a = b.getAttribute('data-s');
          if (a === 'copycode') {
            copyText(syncCfg.ns).then(function (ok) { toast(ok ? '코드를 복사했어요' : '복사하지 못했어요'); });
          } else if (a === 'link') {
            var link = location.origin + location.pathname + '?k=' + syncCfg.ns;
            copyText(link).then(function (ok) { toast(ok ? '연결 링크를 복사했어요 · 다른 기기에서 열면 바로 연결됩니다' : '복사하지 못했어요'); });
          } else if (a === 'now') {
            syncNow({}).then(function () { closeSheet(); });
          } else if (a === 'new') {
            confirmSheet({
              title: '새 동기화 코드',
              text: '지금 기기의 데이터를 새 코드에 올립니다.<br />기존 코드로 연결된 다른 기기는 <b>새 코드를 입력해야</b> 같은 내용을 봅니다.',
              ok: '만들기'
            }).then(function (ok) {
              if (!ok) return;
              syncCfg.ns = syncNewNs();
              syncCfg.rev = 0;
              syncCfg.lastRemoteRev = 0;
              syncCfg.lastPushTs = 0;
              syncCfg.lastError = '';
              syncCfg.dirty = true;
              syncSave();
              closeSheet();
              syncNow({}).then(function () { openSyncSheet(); });
            });
          } else if (a === 'switch') {
            var box = root.querySelector('#switch-box');
            if (box) { box.classList.toggle('hidden'); var inp = box.querySelector('#ns-input'); if (inp && !box.classList.contains('hidden')) inp.focus(); }
          } else if (a === 'off') {
            confirmSheet({
              title: '연결 해제',
              text: '이 기기의 기록은 그대로 남고, 자동 동기화만 멈춥니다. 다시 연결하면 같은 코드로 이어집니다.',
              ok: '해제'
            }).then(function (ok2) {
              if (!ok2) return;
              syncCfg.ns = ''; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastPushTs = 0; syncCfg.lastError = '';
              syncSave(); renderAll(); closeSheet(); openSyncSheet();
            });
          } else if (a === 'join') {
            var v = (root.querySelector('#ns-input').value || '').trim();
            if (!/^resellbook-[a-z0-9]{6,}$/.test(v)) { toast('코드 형식이 맞지 않아요 (resellbook-…)'); return; }
            syncCfg.ns = v; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastPushTs = 0; syncCfg.lastError = '';
            syncSave(); closeSheet();
            syncNow({}).then(function () { openSyncSheet(); });
          } else if (a === 'export') {
            exportJson();
          } else if (a === 'import') {
            $('#import-file').click();
          }
        });
      }
    });
    return sheet;
  }

  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).then(function () { return true; }, function () { return fallbackCopy(txt); });
    }
    return Promise.resolve(fallbackCopy(txt));
  }
  function fallbackCopy(txt) {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  /* ============================================================
     backup
     ============================================================ */
  function exportJson() {
    var payload = {
      app: 'resellbook', version: 1, exportedAt: new Date().toISOString(),
      data: syncDataSnapshot()
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'resellbook-backup-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('백업 파일을 내려받았어요 · 재고 ' + state.items.length + '종');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(reader.result)); } catch (e) { obj = null; }
      if (!obj) { toast('JSON 파일을 읽지 못했어요'); return; }
      var data = obj.data && typeof obj.data === 'object' ? obj.data : obj;
      if (!data || (!Array.isArray(data.items) && !Array.isArray(data.txns))) {
        toast('리셀북 백업 파일이 아니에요'); return;
      }
      var incoming = normalize(data);
      var merged = mergeData(syncDataSnapshot(), incoming);
      confirmSheet({
        title: '백업 불러오기',
        text: '이 파일: 재고 <b>' + incoming.items.length + '종</b> · 거래 <b>' + incoming.txns.length + '건</b><br /><br />' +
          '지금 기기 기록에 <b>합쳐서</b> 저장합니다 (같은 상품은 최근 수정본이 남아요).<br />기존 기록은 지워지지 않아요.',
        ok: '합치기'
      }).then(function (ok) {
        if (!ok) return;
        state = normalize(merged.data);
        save(); renderAll();
        toast('불러왔어요 · 새 항목 ' + (merged.stats.added || 0) + '건');
      });
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  /* ============================================================
     menu
     ============================================================ */
  function openMenu() {
    var inv = invStats();
    var sizeTxt = '—';
    try { sizeTxt = (JSON.stringify(state).length / 1024).toFixed(0) + 'KB'; } catch (e) { }
    var body = '<div class="syncbox"><div class="ownername">📒 리셀북 <span style="color:#7a8290">v1.0</span></div>' +
      '<p class="desc">재고 ' + state.items.length + '종 · 거래 ' + state.txns.length + '건 · 저장 ' + sizeTxt + '</p>' +
      '<div class="syncacts">' +
      '<button class="btn" data-mm="sync">🔄 동기화</button>' +
      '<button class="btn" data-mm="export">📥 백업 내보내기</button>' +
      '<button class="btn" data-mm="import">📤 불러오기</button>' +
      '</div></div>' +
      '<div class="note">· 기록은 이 기기 브라우저에 저장되고, 동기화를 켜면 다른 기기와도 맞춰져요.<br />' +
      '· 이 페이지는 검색엔진에 노출되지 않아요.<br />' +
      '· 사진은 넣을 때 자동으로 줄여서 저장합니다.</div>';
    var sheet = openSheet({ title: '리셀북', body: body });
    sheet.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mm]');
      if (!b) return;
      var a = b.getAttribute('data-mm');
      if (a === 'sync') { closeSheet(); openSyncSheet(); }
      if (a === 'export') exportJson();
      if (a === 'import') $('#import-file').click();
    });
  }

  /* ============================================================
     events
     ============================================================ */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');
    if (act === 'add') openItemForm();
    else if (act === 'status') { view.status = t.getAttribute('data-status'); renderStatusChips(); renderInv(); }
    else if (act === 'month') { view.month = t.getAttribute('data-month'); renderMonthbar(); renderDash(); }
    else if (act === 'txtype') { view.txType = t.getAttribute('data-txtype'); renderTx(); }
    else if (act === 'plmonth') { view.plMonth = t.getAttribute('data-month'); renderPL(); }
    else if (act === 'detail') openDetail(id);
    else if (act === 'menu') openItemMenu(id);
    else if (act === 'sell') openSell(id);
    else if (act === 'restock') openRestock(id);
    else if (act === 'plus') quickQty(id, 1);
    else if (act === 'minus') quickQty(id, -1);
    else if (act === 'txdel') deleteTxn(id);
    else if (act === 'reset-filter') {
      view.q = ''; view.status = 'all'; view.cat = 'all'; view.sort = 'recent';
      $('#q').value = ''; $('#catsel').value = 'all'; $('#sortsel').value = 'recent';
      renderStatusChips(); renderInv();
    }
  });

  $('#tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) setTab(b.getAttribute('data-view'));
  });
  $('#fab').addEventListener('click', function () { openItemForm(); });
  $('#btn-menu').addEventListener('click', openMenu);
  $('#btn-sync').addEventListener('click', function () { openSyncSheet(); });

  var qTimer = null;
  $('#q').addEventListener('input', function (e) {
    view.q = e.target.value;
    if (qTimer) clearTimeout(qTimer);
    qTimer = setTimeout(function () { renderInv(); }, 90);
  });
  $('#catsel').addEventListener('change', function (e) { view.cat = e.target.value; renderInv(); });
  $('#sortsel').addEventListener('change', function (e) { view.sort = e.target.value; renderInv(); });
  $('#import-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importJson(f);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });

  /* ============================================================
     url key + boot
     ============================================================ */
  function applyUrlKey() {
    var p = new URLSearchParams(location.search);
    var k = (p.get('k') || '').trim();
    if (!k) {
      var h = String(location.hash || '').replace(/^#k=/, '');
      if (h && /^resellbook-/.test(h)) k = h.trim();
    }
    if (!k) return;
    if (!/^resellbook-[a-z0-9]{6,}$/.test(k)) return;
    if (syncCfg.ns === k) return;
    syncCfg.ns = k;
    syncCfg.rev = 0;
    syncCfg.lastRemoteRev = 0;
    syncCfg.lastPushTs = 0;
    syncCfg.lastError = '';
    syncSave();
    try {
      var u = new URL(location.href);
      u.searchParams.delete('k');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) { }
  }

  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function (e) {
    window.__errs.push('rejection: ' + String((e && e.reason && e.reason.message) || e.reason));
  });

  function boot() {
    syncLoad();
    dbGet().then(function (saved) {
      state = normalize(saved);
      applyUrlKey();
      renderAll();
      if (syncOn()) {
        syncNow({ silent: true }).catch(function () { });
        syncTouchIfStale();
      }
    }).catch(function () {
      state = blank();
      renderAll();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* expose a tiny hook for self-checks */
  window.__resellbook = {
    get state() { return state; },
    version: '1.0'
  };
})();

</script>
</body>
</html>
