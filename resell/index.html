        };
        if (hasVar(it)) {
          it.variants.slice().sort(bySizeOrder).forEach(function (v) { addVarRow({ size: v.size, qty: v.qty, cost: v.cost }); });
        }
        refreshVar();

        var photo = draft.photo || '';
        var pv = root.querySelector('#pv');
        var delBtn = root.querySelector('[data-photo-del]');
        var input = root.querySelector('#photo-input');
        root.querySelector('[data-pick]').onclick = function () { input.click(); };
        input.onchange = function () {
          var f = input.files && input.files[0];
          if (!f) return;
          if (!/^image\//.test(f.type)) { toast('이미지 파일만 넣을 수 있어요'); return; }
          compressImage(f, function (data) {
            if (!data) { toast('사진을 읽지 못했어요'); return; }
            photo = data;
            pv.innerHTML = '<img src="' + data + '" alt="" />';
            if (delBtn) delBtn.classList.remove('hidden');
          });
        };
        if (delBtn) delBtn.onclick = function () {
          photo = '';
          pv.innerHTML = '📷';
          delBtn.classList.add('hidden');
          input.value = '';
        };
        var srcSel = root.querySelector('#f-source');
        var etcWrap = root.querySelector('#custom-src-wrap');
        srcSel.onchange = function () {
          etcWrap.classList.toggle('hidden', srcSel.value !== '직접입력');
          if (srcSel.value === '직접입력') root.querySelector('#f-source-etc').focus();
        };
        root.querySelector('[data-x2]').onclick = closeSheet;
        root.querySelector('#save-item').onclick = function () {
          var name = root.querySelector('#f-name').value.trim();
          if (!name) { toast('상품명을 넣어주세요'); root.querySelector('#f-name').focus(); return; }
          var varRows = readVars();
          var altRows = $$('.vrow', varBox);
          if (altRows.length && !varRows.length) { toast('사이즈 이름을 넣어주세요'); return; }
          if (varRows.some(function (v) { return !v.size; })) { toast('사이즈 이름을 넣어주세요'); return; }
          var price = Math.max(0, num(root.querySelector('#f-price').value));
          var qty = Math.max(0, Math.round(num(root.querySelector('#f-qty').value)));
          var src = srcSel.value === '직접입력' ? (root.querySelector('#f-source-etc').value.trim() || '직접입력') : srcSel.value;
          var p = {
            name: name, cat: root.querySelector('#f-cat').value,
            qty: qty, avgCost: price,
            buyDate: normDate(root.querySelector('#f-date').value) || today(),
            source: src, status: root.querySelector('#f-status').value,
            memo: root.querySelector('#f-memo').value.trim(), photo: photo,
            updatedAt: Date.now()
          };
          if (varRows.length) {
            p.variants = varRows;
            p.qty = 0; p.avgCost = 0;
            syncVarTotals(p);
          }
          if (it) {
            if (!varRows.length) delete it.variants;
            Object.assign(it, p);
            syncVarTotals(it);
            toast('수정했어요 · ' + esc(name));
          } else {
            p.id = uid('i');
            p.createdAt = Date.now();
            p.totalInQty = p.qty;
            state.items.push(p);
            toast('등록 완료 · ' + esc(name));
          }
          save();
          closeSheet();
          renderAll();
        };
      }
    });
    setTimeout(function () {
      var n = sheet.querySelector('#f-name');
      if (n && !it) n.focus();
    }, 260);
  }

  function soldQtyOf(pid) {
    var n = 0;
    state.txns.forEach(function (t) { if (t.type === 'sale' && t.pid === pid) n += t.qty; });
    return n;
  }

  /* ============================================================
     detail sheet
     ============================================================ */
  function openDetail(id) {
    var it = itemById(id);
    if (!it) return;
    var st = effStatus(it);
    var sold = soldQtyOf(id);
    var sales = state.txns.filter(function (t) { return t.pid === id && t.type === 'sale'; });
    var revenue = 0, profit = 0;
    sales.forEach(function (t) { revenue += t.total; profit += t.profit; });
    var body = '';
    body += '<div class="photopick" style="align-items:flex-start">' +
      '<div class="pv" style="width:96px;height:96px;flex:0 0 96px;border-style:solid">' + (it.photo ? '<img src="' + it.photo + '" alt="" />' : (CATICON[it.cat] || '📦')) + '</div>' +
      '<div class="ptxt"><div style="font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.3;word-break:break-all">' + esc(it.name) + '</div>' +
      '<div class="pmeta" style="margin-top:5px">' + esc(it.cat) + (it.source ? ' · ' + esc(it.source) : '') + (it.buyDate ? ' · ' + esc(dateLabelYear(it.buyDate)) : '') + '</div>' +
      '<div style="margin-top:7px"><span class="badge ' + st + '">' + st + '</span></div></div></div>';

    var dq = itemQty(it);
    var davg = itemAvg(it);
    body += '<div class="plgrid" style="margin:2px 0 0">' +
      cell('잔여 수량', dq + '개', '') +
      cell('평균 원가', davg == null ? '가격 미입력' : won(davg), '') +
      cell('재고 가치', won(itemValue(it)), '') +
      cell('누적 판매', sold + '개', '') +
      '</div>';
    if (hasVar(it)) {
      body += '<div class="sec-title" style="margin:2px 0 0">사이즈별 재고</div><div class="vlist">' +
        it.variants.slice().sort(bySizeOrder).map(function (v) {
          var rec = recommendPrice(v.cost);
          return '<div class="vrow2" data-size="' + esc(v.size) + '">' +
            '<span class="vs">' + esc(v.size) + '</span>' +
            '<span class="vq">' + (Number(v.qty) || 0) + '개</span>' +
            '<span class="vc' + (v.cost == null ? ' np' : '') + '">' + (v.cost == null ? '가격 미입력' : won(v.cost)) + '</span>' +
            '<span class="vv">' + (rec == null ? '' : '추천 ' + wonShort(rec)) + '</span></div>';
        }).join('') + '</div>';
    }
    var netRow = '<div class="calc"><div class="line"><span>누적 매출</span><b>' + won(revenue) + '</b></div>' +
      '<div class="line total"><span>누적 순수익</span><b class="' + profitClass(profit) + '" style="color:' + (profit < 0 ? '#ff6b7a' : (profit > 0 ? '#3ecf8e' : '#eef0f4')) + '">' + won(profit) + '</b></div></div>';
    body += netRow;
    if (it.memo) body += '<div class="note" style="white-space:pre-wrap;color:var(--muted)">' + esc(it.memo) + '</div>';
    if (sales.length) {
      body += '<div class="sec-title" style="margin:4px 0 0">이 상품 거래</div>' + sales.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 6).map(txRow).join('');
    }

    var foot = '<button class="btn ghost" data-d="edit" style="flex:0 0 auto;padding:13px 14px">수정</button>' +
      '<button class="btn" data-d="restock" style="flex:1">추가 입고</button>' +
      '<button class="btn primary" data-d="sell" style="flex:1">판매하기</button>';
    var sheet = openSheet({ title: esc(it.name), sub: st, body: body, foot: foot });
    sheet.querySelector('[data-d="edit"]').onclick = function () { closeSheet(); openItemForm(it.id); };
    sheet.querySelector('[data-d="restock"]').onclick = function () { closeSheet(); openRestock(it.id); };
    sheet.querySelector('[data-d="sell"]').onclick = function () {
      if ((Number(it.qty) || 0) <= 0) { toast('재고가 없어요. [추가 입고]로 먼저 채워주세요'); return; }
      closeSheet(); openSell(it.id);
    };
  }

  function openItemMenu(id) {
    var it = itemById(id);
    if (!it) return;
    var body = '<div class="syncacts" style="flex-direction:column;align-items:stretch;gap:7px">' +
      '<button class="btn" data-m="edit" style="text-align:left">✏️ 상품 수정</button>' +
      '<button class="btn" data-m="detail" style="text-align:left">📄 상세 보기</button>' +
      '<button class="btn danger" data-m="del" style="text-align:left">🗑 상품 삭제</button>' +
      '</div><div class="note">삭제해도 판매·입고 기록은 거래 내역에 남아요.</div>';
    var sheet = openSheet({ title: esc(it.name), body: body });
    sheet.querySelector('[data-m="edit"]').onclick = function () { closeSheet(); openItemForm(id); };
    sheet.querySelector('[data-m="detail"]').onclick = function () { closeSheet(); openDetail(id); };
    sheet.querySelector('[data-m="del"]').onclick = function () { closeSheet(); deleteItem(id); };
  }

  /* ============================================================
     sell
     ============================================================ */
  function openSell(id) {
    var it = itemById(id);
    if (!it) return;
    var isVar = hasVar(it);
    var vlist = isVar ? heldSizes(it).slice().sort(bySizeOrder) : [];
    var avail = isVar ? vlist.reduce(function (a, v) { return a + (Number(v.qty) || 0); }, 0) : (Number(it.qty) || 0);
    if (avail <= 0) { toast('재고가 없어요. [추가 입고]로 먼저 채워주세요'); return; }
    var sel = 0;
    var state2 = { mode: 'total', qty: 1, venue: '크림', venueEtc: '' };

    var body = '';
    body += '<div class="calc" id="sell-item-line">' +
      '<div class="line"><span>' + esc(it.name) + '</span><b>잔여 ' + avail + '개</b></div>' +
      (isVar
        ? '<div class="line"><span>사이즈</span><b>' + vlist.map(function (v) { return esc(v.size) + ' ' + (Number(v.qty) || 0); }).join(' · ') + '</b></div>'
        : '<div class="line"><span>평균 원가</span><b>' + (itemAvg(it) == null ? '가격 미입력' : won(itemAvg(it))) + '</b></div>') +
      '</div>';

    if (isVar) {
      body += '<div class="field"><label>판매할 사이즈</label><select id="s-size">' +
        vlist.map(function (v, i) {
          return '<option value="' + i + '">' + esc(v.size) + ' · ' + (Number(v.qty) || 0) + '개 · ' + (v.cost == null ? '가격 미입력' : won(v.cost)) + '</option>';
        }).join('') + '</select></div>';
    }

    body += '<div class="row2">' +
      '<div class="field"><label>판매일</label><input id="s-date" type="date" placeholder="YYYY-MM-DD" value="' + today() + '" /></div>' +
      '<div class="field"><label>판매 수량</label><input id="s-qty" type="number" inputmode="numeric" min="1" max="' + avail + '" step="1" value="1" /></div>' +
      '</div>';

    body += '<div class="field"><label>판매가</label>' +
      '<div class="seg" id="s-mode"><button class="on" data-mode="total">총액으로 입력</button><button data-mode="unit">개당 단가로</button></div>' +
      '<input id="s-price" type="number" inputmode="numeric" min="0" step="100" placeholder="0" style="margin-top:8px" />' +
      '<div class="rechint" id="s-rec"></div>' +
      '</div>';

    body += '<div class="field"><label>판매처 <span style="color:var(--muted2)">(기본: 크림)</span></label>' +
      '<div class="seg venues" id="s-venues">' +
      SALE_VENUES.map(function (v, i) { return '<button type="button" class="' + (i === 0 ? 'on' : '') + '" data-venue="' + esc(v) + '">' + esc(v) + '</button>'; }).join('') +
      '</div>' +
      '<input id="s-venue-etc" class="hidden" type="text" maxlength="30" placeholder="판매처 직접입력" style="margin-top:8px" />' +
      '</div>';

    body += '<div class="row2">' +
      '<div class="field"><label>수수료 (원)</label><input id="s-fee" type="number" inputmode="numeric" min="0" step="100" placeholder="0" /></div>' +
      '<div class="field"><label>배송비 (원)</label><input id="s-ship" type="number" inputmode="numeric" min="0" step="100" placeholder="0" /></div>' +
      '</div>';

    body += '<div class="field"><label>메모</label><input id="s-memo" type="text" maxlength="300" placeholder="선택" /></div>';

    body += '<div class="calc" id="s-calc"></div>';
    body += '<div class="note" id="s-warn" hidden style="color:var(--accent2)"></div>';

    var sheet = openSheet({
      title: '판매하기', sub: esc(it.name),
      body: body,
      foot: '<button class="btn ghost" data-x3="1">취소</button><button class="btn primary" id="s-go">판매 등록</button>',
      onMount: function (root) {
        var qtyEl = root.querySelector('#s-qty');
        var priceEl = root.querySelector('#s-price');
        var feeEl = root.querySelector('#s-fee');
        var shipEl = root.querySelector('#s-ship');
        var calcEl = root.querySelector('#s-calc');
        var warnEl = root.querySelector('#s-warn');
        var modeEl = root.querySelector('#s-mode');

        var sizeEl = root.querySelector('#s-size');
        var recEl = root.querySelector('#s-rec');
        var venueBox = root.querySelector('#s-venues');
        var venueEtc = root.querySelector('#s-venue-etc');

        function curVar() { return isVar ? vlist[sel] : null; }
        function capQty() { var v = curVar(); return isVar ? (Number(v.qty) || 0) : avail; }
        function unitCost() {
          if (isVar) { var v = curVar(); return v.cost != null ? Math.round(v.cost) : null; }
          var a = itemAvg(it);
          return a == null ? null : a;
        }

        function calc() {
          var cap = capQty();
          var qty = Math.max(1, Math.round(num(qtyEl.value)));
          if (qty > cap) qty = cap;
          var input = Math.max(0, num(priceEl.value));
          var revenue = state2.mode === 'total' ? input : input * qty;
          var unit = qty ? revenue / qty : 0;
          var cU = unitCost();
          var unknown = cU == null;
          var cost = unknown ? 0 : cU * qty;
          var fee = Math.max(0, num(feeEl.value));
          var ship = Math.max(0, num(shipEl.value));
          var profit = revenue - cost - fee - ship;
          var margin = revenue ? (profit / revenue) * 100 : 0;
          calcEl.innerHTML =
            '<div class="line"><span>매출 (' + qty + '개 × ' + won(unit) + ')</span><b>' + won(revenue) + '</b></div>' +
            '<div class="line"><span>원가' + (isVar ? ' (' + esc(curVar().size) + ')' : '') + ' ' + qty + '개 × ' + (unknown ? '—' : won(cU)) + '</span><b>' + (unknown ? '가격 미입력' : '-' + won(cost)) + '</b></div>' +
            '<div class="line"><span>수수료·배송</span><b>-' + won(fee + ship) + '</b></div>' +
            '<div class="line total"><span>순이익 · 마진 ' + (revenue ? margin.toFixed(1) : '0.0') + '%</span>' +
            '<b style="color:' + (profit > 0 ? '#3ecf8e' : (profit < 0 ? '#ff6b7a' : '#eef0f4')) + '">' + won(profit) + '</b></div>';
          var rec = recommendPrice(cU);
          recEl.innerHTML = rec == null
            ? '<span style="color:var(--muted2)">원가가 입력되지 않아 추천가를 계산하지 않아요</span>'
            : '<span>목표 ' + targetMargin() + '% 추천 판매가 <b>' + won(rec) + '</b></span> <button type="button" class="recbtn" data-fill="' + rec + '">넣기</button>';
          if (qty > cap) { warnEl.hidden = false; warnEl.textContent = '잔여 ' + cap + '개까지만 판매할 수 있어요.'; }
          else if (!input) { warnEl.hidden = false; warnEl.textContent = '판매가를 넣으면 순이익이 바로 계산돼요.'; }
          else if (unknown) { warnEl.hidden = false; warnEl.textContent = '이 사이즈는 원가가 입력되지 않아 순이익에 원가가 빠져 있어요 (실제보다 크게 보입니다).'; }
          else warnEl.hidden = true;
          return {
            qty: qty, revenue: revenue, unit: unit, cost: cost, costUnit: unknown ? 0 : cU,
            fee: fee, ship: ship, profit: round(profit), unknown: unknown
          };
        }
        function bind() {
          [qtyEl, priceEl, feeEl, shipEl].forEach(function (el) {
            el.addEventListener('input', function () {
              if (el === qtyEl) {
                var cap = capQty();
                var v = Math.round(num(qtyEl.value));
                if (v > cap) { qtyEl.value = cap; toast('잔여 수량은 ' + cap + '개예요'); }
              }
              calc();
            });
          });
          modeEl.addEventListener('click', function (e) {
            var b = e.target.closest('button');
            if (!b) return;
            var m = b.getAttribute('data-mode');
            if (m === state2.mode) return;
            var r = calc();
            state2.mode = m;
            $$('#s-mode button').forEach(function (x) { x.classList.toggle('on', x === b); });
            priceEl.value = m === 'unit' ? round(r.unit) : round(r.revenue);
            calc();
          });
          if (sizeEl) {
            sizeEl.addEventListener('change', function () {
              sel = Number(sizeEl.value) || 0;
              var cap = capQty();
              qtyEl.max = cap;
              if (Math.round(num(qtyEl.value)) > cap) qtyEl.value = cap;
              calc();
            });
          }
          venueBox.addEventListener('click', function (e) {
            var b = e.target.closest('button[data-venue]');
            if (!b) return;
            state2.venue = b.getAttribute('data-venue');
            $$('button', venueBox).forEach(function (x) { x.classList.toggle('on', x === b); });
            venueEtc.classList.toggle('hidden', state2.venue !== '직접입력');
            if (state2.venue === '직접입력') venueEtc.focus();
          });
          recEl.addEventListener('click', function (e) {
            var b = e.target.closest('[data-fill]');
            if (!b) return;
            var v = Number(b.getAttribute('data-fill'));
            priceEl.value = state2.mode === 'total' ? v * Math.max(1, Math.round(num(qtyEl.value))) : v;
            calc();
          });
        }
        bind();
        calc();
        root.querySelector('[data-x3]').onclick = closeSheet;
        root.querySelector('#s-go').onclick = function () {
          var r = calc();
          if (r.qty < 1) { toast('판매 수량을 1개 이상 넣어주세요'); return; }
          if (r.qty > avail) { toast('잔여 수량보다 많이 팔 수 없어요'); return; }
          if (r.revenue <= 0) { toast('판매가를 넣어주세요'); priceEl.focus(); return; }
          var date = normDate(root.querySelector('#s-date').value) || today();
          var venue = state2.venue === '직접입력' ? (venueEtc.value.trim() || '직접입력') : state2.venue;
          var memo = root.querySelector('#s-memo').value.trim();
          var t = {
            id: uid('t'), type: 'sale', pid: it.id, name: it.name, date: date,
            qty: r.qty, unitPrice: round(r.unit), total: round(r.revenue),
            fee: r.fee, ship: r.ship, costUnit: r.costUnit, costTotal: r.cost,
            profit: r.profit, venue: venue, memo: memo, size: isVar ? curVar().size : '',
            costUnknown: !!r.unknown, createdAt: Date.now(), updatedAt: Date.now()
          };
          if (isVar) {
            var v0 = curVar();
            v0.qty = Math.max(0, (Number(v0.qty) || 0) - r.qty);
            syncVarTotals(it);
          } else {
            it.qty = Math.max(0, avail - r.qty);
          }
          it.updatedAt = Date.now();
          state.txns.push(t);
          save();
          closeSheet();
          renderAll();
          toast('판매 기록 완료 · 순이익 <b>' + won(r.profit) + '</b>' + (itemQty(it) === 0 ? ' · 완판' : ' · 잔여 ' + itemQty(it) + '개'));
        };
      }
    });
    setTimeout(function () { var p = sheet.querySelector('#s-price'); if (p) p.focus(); }, 280);
  }

  /* ============================================================
     restock
     ============================================================ */
  function openRestock(id) {
    var it = itemById(id);
    if (!it) return;
    var isVar = hasVar(it);
    var curQty = itemQty(it), curCost = Number(it.avgCost) || 0;
    var body = '';
    body += '<div class="calc"><div class="line"><span>' + esc(it.name) + '</span><b>잔여 ' + curQty + '개</b></div>' +
      '<div class="line"><span>현재 ' + (isVar ? '가중 평균' : '평균') + ' 원가</span><b>' + (itemAvg(it) == null ? '가격 미입력' : won(itemAvg(it))) + '</b></div></div>';
    if (isVar) {
      body += '<div class="field"><label>사이즈</label><select id="r-size">' +
        it.variants.slice().sort(bySizeOrder).map(function (v) {
          return '<option value="' + esc(v.size) + '">' + esc(v.size) + ' · ' + (Number(v.qty) || 0) + '개' + (v.cost == null ? ' · 가격 미입력' : ' · ' + won(v.cost)) + '</option>';
        }).join('') +
        '<option value="__new">＋ 새 사이즈 추가</option></select>' +
        '<input id="r-size-new" class="hidden" type="text" maxlength="12" placeholder="새 사이즈 (예: XL)" style="margin-top:8px" /></div>';
    }
    body += '<div class="row2">' +
      '<div class="field"><label>입고일</label><input id="r-date" type="date" placeholder="YYYY-MM-DD" value="' + today() + '" /></div>' +
      '<div class="field"><label>수량</label><input id="r-qty" type="number" inputmode="numeric" min="1" step="1" value="1" /></div>' +
      '</div>';
    body += '<div class="row2">' +
      '<div class="field"><label>개당 단가</label><input id="r-price" type="number" inputmode="numeric" min="0" step="100" placeholder="0" /></div>' +
      '<div class="field"><label>구매처</label><select id="r-src">' +
      SOURCES.map(function (s) { return '<option value="' + s + '"' + ((it.source || '당근') === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
      '</select></div></div>';
    body += '<div class="calc" id="r-calc"></div>';
    var sheet = openSheet({
      title: '추가 입고', sub: esc(it.name),
      body: body,
      foot: '<button class="btn ghost" data-x4="1">취소</button><button class="btn primary" id="r-go">입고 등록</button>',
      onMount: function (root) {
        var qtyEl = root.querySelector('#r-qty');
        var priceEl = root.querySelector('#r-price');
        var calcEl = root.querySelector('#r-calc');
        var sizeEl = root.querySelector('#r-size');
        var newEl = root.querySelector('#r-size-new');

        function curVar() {
          if (!isVar) return null;
          if (sizeEl.value === '__new') return { size: (newEl.value || '').trim(), qty: 0, cost: null, isNew: 1 };
          var f = null;
          it.variants.forEach(function (v) { if (v.size === sizeEl.value) f = v; });
          return f;
        }
        function syncPrice() {
          var v = curVar();
          priceEl.value = (v && v.cost != null) ? Math.round(v.cost) : '';
          calc();
        }
        function calc() {
          var q = Math.max(1, Math.round(num(qtyEl.value)));
          var raw = String(priceEl.value).trim();
          var p = raw === '' ? null : Math.max(0, num(raw));
          var v = curVar();
          var beforeQ = isVar ? (v ? (Number(v.qty) || 0) : 0) : curQty;
          var beforeC = isVar ? ((v && v.cost != null) ? Number(v.cost) : 0) : curCost;
          var afterQ = beforeQ + q;
          var sizeAvg = p == null ? ((v && v.cost != null) ? Number(v.cost) : null)
            : (beforeC && beforeQ ? (beforeC * beforeQ + p * q) / afterQ : p);
          var totQ = curQty + q;
          var totVal = itemValue(it) + (p == null ? 0 : p * q);
          var knownQ = costKnownQty(it) + (p == null ? 0 : q);
          calcEl.innerHTML = '<div class="line"><span>입고 금액</span><b>' + (p == null ? '—' : won(p * q)) + '</b></div>' +
            '<div class="line"><span>' + (isVar ? esc((v && v.size) || '새 사이즈') + ' 입고 후 수량' : '입고 후 재고') + '</span><b>' + afterQ + '개</b></div>' +
            '<div class="line"><span>' + (isVar ? '이 사이즈 평균 단가' : '새 평균 원가') + '</span><b>' + (sizeAvg == null ? '가격 미입력' : won(Math.round(sizeAvg))) + '</b></div>' +
            '<div class="line total"><span>전체 재고 · 가중 평균</span><b>' + totQ + '개 · ' + (knownQ ? won(Math.round(totVal / knownQ)) : '가격 미입력') + '</b></div>';
          return { q: q, p: p, v: v, afterQ: afterQ, totQ: totQ };
        }
        if (sizeEl) {
          sizeEl.addEventListener('change', function () {
            var isNew = sizeEl.value === '__new';
            newEl.classList.toggle('hidden', !isNew);
            if (isNew) { newEl.focus(); priceEl.value = ''; calc(); }
            else syncPrice();
          });
          if (newEl) newEl.addEventListener('input', calc);
        }
        qtyEl.addEventListener('input', calc);
        priceEl.addEventListener('input', calc);
        if (isVar) syncPrice(); else calc();
        root.querySelector('[data-x4]').onclick = closeSheet;
        root.querySelector('#r-go').onclick = function () {
          var r = calc();
          if (r.q < 1) { toast('수량을 1개 이상 넣어주세요'); return; }
          var v = r.v;
          if (isVar) {
            if (!v || !v.size) { toast('사이즈를 확인해 주세요'); if (newEl) newEl.focus(); return; }
            if (v.isNew) it.variants.push({ size: v.size, qty: r.q, cost: r.p });
            else {
              var bq = Number(v.qty) || 0;
              var nq = bq + r.q;
              if (r.p != null) v.cost = (v.cost != null && bq > 0) ? Math.round((v.cost * bq + r.p * r.q) / nq) : r.p;
              v.qty = nq;
            }
            syncVarTotals(it);
          } else {
            if (r.p == null) { toast('개당 단가를 넣어주세요'); priceEl.focus(); return; }
            it.qty = curQty + r.q;
            it.avgCost = r.totQ > 0 ? (curCost * curQty + r.p * r.q) / r.totQ : r.p;
          }
          it.totalInQty = (Number(it.totalInQty) || 0) + r.q;
          if (!(it.status === '예약중' && itemQty(it) > 0)) it.status = '판매중';
          it.updatedAt = Date.now();
          var t = {
            id: uid('t'), type: 'in', pid: it.id, name: it.name,
            date: normDate(root.querySelector('#r-date').value) || today(),
            qty: r.q, unitPrice: r.p == null ? 0 : round(r.p), total: r.p == null ? 0 : round(r.p * r.q),
            fee: 0, ship: 0, costUnit: round(itemAvg(it) || 0), costTotal: r.p == null ? 0 : round(r.p * r.q), profit: 0,
            venue: root.querySelector('#r-src').value, memo: '', size: isVar ? v.size : '',
            createdAt: Date.now(), updatedAt: Date.now()
          };
          state.txns.push(t);
          save(); closeSheet(); renderAll();
          toast('입고 완료 · ' + r.q + '개' + (isVar ? ' (' + esc(v.size) + ')' : '') + ' · ' + (itemAvg(it) == null ? '단가 미입력' : '평균 원가 ' + won(itemAvg(it))));
        };
      }
    });
    setTimeout(function () { var p = sheet.querySelector('#r-price'); if (p) p.focus(); }, 280);
  }

  /* ============================================================
     delete item / txn
     ============================================================ */
  function deleteItem(id) {
    var it = itemById(id);
    if (!it) return;
    var snapshot = JSON.stringify({ items: state.items, txns: state.txns, deletedIds: state.deletedIds });
    state.items = state.items.filter(function (x) { return x.id !== id; });
    state.deletedIds.push(id);
    save(); renderAll();
    toast('삭제했어요 · ' + esc(it.name), {
      action: '되돌리기', ms: 7000, onAction: function () {
        try {
          var s = JSON.parse(snapshot);
          state.items = normalize({ items: s.items }).items;
          state.txns = normalize({ txns: s.txns }).txns;
          state.deletedIds = s.deletedIds;
          save(); renderAll();
          toast('되돌렸어요');
        } catch (e) { toast('되돌리지 못했어요'); }
      }
    });
  }

  function deleteTxn(id) {
    var t = null;
    state.txns.forEach(function (x) { if (x.id === id) t = x; });
    if (!t) return;
    var it = itemById(t.pid);
    confirmSheet({
      title: t.type === 'sale' ? '판매 기록 삭제' : '입고 기록 삭제',
      text: esc(t.name) + ' · ' + t.qty + '개 · ' + won(t.total || t.unitPrice * t.qty) +
        '<br /><br />' + (t.type === 'sale'
          ? '삭제하면 재고가 <b>' + t.qty + '개 늘어나고</b> 매출·순수익 집계에서 빠집니다.'
          : '삭제하면 재고가 <b>' + t.qty + '개 줄어듭니다</b> (0개 아래로는 내려가지 않아요).'),
      ok: '삭제', danger: true
    }).then(function (ok) {
      if (!ok) return;
      var snapshot = JSON.stringify(state);
      state.txns = state.txns.filter(function (x) { return x.id !== id; });
      state.deletedTxnIds.push(id);
      if (it) {
        if (hasVar(it) && t.size) {
          var tgt = null;
          it.variants.forEach(function (v) { if (v.size === t.size) tgt = v; });
          if (!tgt && t.type === 'sale') {
            tgt = { size: t.size, qty: 0, cost: t.costUnknown ? null : (Number(t.costUnit) || null) };
            it.variants.push(tgt);
          }
          if (tgt) {
            if (t.type === 'sale') tgt.qty = (Number(tgt.qty) || 0) + t.qty;
            else tgt.qty = Math.max(0, (Number(tgt.qty) || 0) - t.qty);
          }
          syncVarTotals(it);
          if (itemQty(it) > 0 && it.status !== '예약중') it.status = '판매중';
        } else if (t.type === 'sale') {
          var addBack = t.qty;
          var newQ = (Number(it.qty) || 0) + addBack;
          var cUnit = t.costUnknown ? 0 : (Number(t.costUnit) || 0);
          it.avgCost = newQ > 0 ? ((Number(it.avgCost) || 0) * (Number(it.qty) || 0) + cUnit * addBack) / newQ : cUnit;
          it.qty = newQ;
          if (it.status === '예약중') { /* keep */ } else it.status = '판매중';
        } else {
          var q2 = Math.max(0, (Number(it.qty) || 0) - t.qty);
          if (q2 > 0 && Number(it.avgCost)) {
            var back = (Number(it.avgCost) * (Number(it.qty) || 0) - t.unitPrice * t.qty) / q2;
            if (isFinite(back) && back >= 0) it.avgCost = back;
          }
          it.qty = q2;
        }
        it.updatedAt = Date.now();
      }
      save(); renderAll();
      toast('기록을 삭제했어요', {
        action: '되돌리기', ms: 7000, onAction: function () {
          try {
            state = normalize(JSON.parse(snapshot));
            save(); renderAll(); toast('되돌렸어요');
          } catch (e) { toast('되돌리지 못했어요'); }
        }
      });
    });
  }

  /* ============================================================
     quick qty
     ============================================================ */
  function quickQty(id, delta) {
    var it = itemById(id);
    if (!it) return;
    if (hasVar(it)) {
      var held = heldSizes(it);
      if (held.length !== 1) { toast('사이즈가 여러 개인 상품은 [판매]·[입고]에서 사이즈를 골라 조정해요'); return; }
      var v = held[0];
      var before = Math.max(0, Number(v.qty) || 0);
      var after = before + delta;
      if (after < 0) { toast('0개 아래로는 줄일 수 없어요'); return; }
      v.qty = after; syncVarTotals(it); it.updatedAt = Date.now();
      save(); renderAll();
      toast(esc(it.name.slice(0, 16)) + ' ' + esc(v.size) + ' · 재고 ' + after + '개<span style="color:var(--muted2)"> (원가 그대로)</span>', {
        action: '되돌리기', ms: 5000, onAction: function () {
          v.qty = before; syncVarTotals(it); it.updatedAt = Date.now(); save(); renderAll();
        }
      });
      return;
    }
    var q = (Number(it.qty) || 0) + delta;
    if (q < 0) { toast('0개 아래로는 줄일 수 없어요'); return; }
    it.qty = q;
    it.updatedAt = Date.now();
    save(); renderAll();
    toast(esc(it.name.slice(0, 18)) + ' · 재고 ' + q + '개 <span style="color:var(--muted2)">(원가 그대로)</span>', {
      action: '되돌리기', ms: 5000, onAction: function () {
        it.qty = Math.max(0, q - delta); it.updatedAt = Date.now(); save(); renderAll();
      }
    });
  }

  /* ============================================================
     sync (MantleDB · 무료·가입 없음)
     ============================================================ */
  var SYNC_BASE = 'https://mantledb.sh/v2/';
  var SYNC_CFG_KEY = 'resellbook_sync_v1';
  var PART_MAX = 58000;
  var PARTS_PER_NS = 88;
  var TOUCH_MS = 14 * 24 * 60 * 60 * 1000;

  var syncCfg = null;
  var syncBusy = false;
  var syncTimer = null;

  function syncLoad() {
    try { syncCfg = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null'); } catch (e) { syncCfg = null; }
    if (!syncCfg) syncCfg = { ns: '', rev: 0, lastSync: 0, deviceId: '', lastCount: null, lastError: '', lastPushTs: 0, dirty: false };
    if (!syncCfg.deviceId) syncCfg.deviceId = 'dev-' + Math.random().toString(36).slice(2, 8);
    return syncCfg;
  }
  function syncSave() {
    try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); } catch (e) { }
  }
  function syncOn() { return !!(syncCfg && syncCfg.ns); }

  function syncNewNs() {
    var abc = 'abcdefghijkmnpqrstuvwxyz23456789', s = '';
    for (var i = 0; i < 10; i++) s += abc[Math.floor(Math.random() * abc.length)];
    return 'resellbook-' + s;
  }
  function nsForPart(i) {
    var b = Math.floor(i / PARTS_PER_NS);
    return b === 0 ? syncCfg.ns : syncCfg.ns + '-p' + b;
  }

  function escLen(ch) {
    var cc = ch.charCodeAt(0);
    if (ch === '"' || ch === '\\') return 2;
    if (cc < 0x20) return 6;
    if (cc < 0x80) return 1;
    if (cc < 0x800) return 2;
    if (cc >= 0xD800 && cc <= 0xDBFF) return 4;
    if (cc >= 0xDC00 && cc <= 0xDFFF) return 0;
    return 3;
  }
  function chunk(doc, max) {
    var parts = [], cur = '', len = 0;
    for (var i = 0; i < doc.length; i++) {
      var ch = doc[i], b = escLen(ch);
      if (len + b > max) { parts.push(cur); cur = ch; len = b; }
      else { cur += ch; len += b; }
    }
    if (cur) parts.push(cur);
    return parts;
  }

  function syncFetch(url, opt) {
    var ctrl = new AbortController();
    var tm = setTimeout(function () { ctrl.abort(); }, 20000);
    return fetch(url, Object.assign({ signal: ctrl.signal, cache: 'no-store' }, opt || {})).then(function (r) {
      clearTimeout(tm); return r;
    }, function (e) { clearTimeout(tm); throw e; });
  }
  function syncPost(path, obj) {
    return syncFetch(SYNC_BASE + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    });
  }
  function syncGet(path) {
    return syncFetch(SYNC_BASE + path, { method: 'GET' }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (t) {
        if (!t) return null;
        try { return JSON.parse(t); } catch (e) { return null; }
      });
    });
  }

  function syncDataSnapshot() {
    return {
      items: state.items, txns: state.txns,
      deletedIds: state.deletedIds, deletedTxnIds: state.deletedTxnIds,
      settings: { targetMargin: targetMargin() },
      updatedAt: state.updatedAt
    };
  }

  function syncPush() {
    if (!syncOn()) return Promise.reject(new Error('동기화 코드가 없습니다'));
    var inv = invStats();
    var doc = JSON.stringify({ v: 1, app: 'resellbook', ts: Date.now(), device: syncCfg.deviceId, data: syncDataSnapshot() });
    var parts = chunk(doc, PART_MAX);
    if (parts.length > PARTS_PER_NS * 4) return Promise.reject(new Error('데이터가 너무 큽니다 (' + parts.length + '조각)'));
    var chain = Promise.resolve();
    parts.forEach(function (p, i) {
      chain = chain.then(function () { return syncPost(nsForPart(i) + '/v1/p' + i, { c: p }); });
    });
    return chain.then(function () {
      var rev = Math.max(Number(syncCfg.rev) || 0, Number(syncCfg.lastRemoteRev) || 0) + 1;
      var manifest = {
        t: 1, app: 'resellbook', rev: rev, ts: Date.now(), device: syncCfg.deviceId,
        parts: parts.map(function (p, i) { return { ns: nsForPart(i), k: 'v1/p' + i }; }),
        counts: { items: state.items.length, txns: state.txns.length, qty: inv.qty, value: inv.value },
        bytes: doc.length
      };
      return syncPost(syncCfg.ns + '/v1/manifest', manifest).then(function () {
        syncCfg.rev = rev;
        syncCfg.lastRemoteRev = rev;
        syncCfg.lastSync = Date.now();
        syncCfg.lastPushTs = manifest.ts;
        syncCfg.lastCount = manifest.counts;
        syncCfg.lastError = '';
        syncCfg.dirty = false;
        syncSave();
        renderSyncDot();
        return manifest;
      });
    });
  }

  function syncPull() {
    if (!syncOn()) return Promise.resolve(null);
    return syncGet(syncCfg.ns + '/v1/manifest').then(function (m) {
      if (!m || !m.parts || !m.parts.length) return null;
      var chain = Promise.resolve(''), buf = '';
      m.parts.forEach(function (p) {
        chain = chain.then(function () {
          return syncGet(p.ns + '/' + p.k).then(function (part) {
            if (!part || typeof part.c !== 'string') throw new Error('원격 조각이 만료되었습니다');
            buf += part.c;
          });
        });
      });
      return chain.then(function () {
        var doc = null;
        try { doc = JSON.parse(buf); } catch (e) { doc = null; }
        if (!doc || !doc.data) throw new Error('원격 데이터 형식이 올바르지 않습니다');
        return { manifest: m, doc: doc };
      });
    });
  }

  function mergeData(local, remote) {
    var stats = { added: 0, updated: 0, deleted: 0 };
    var delIds = {};
    (local.deletedIds || []).concat(remote.deletedIds || []).forEach(function (x) { delIds[String(x)] = 1; });
    var delTx = {};
    (local.deletedTxnIds || []).concat(remote.deletedTxnIds || []).forEach(function (x) { delTx[String(x)] = 1; });

    var items = {}, order = [];
    (local.items || []).forEach(function (x) { if (!items[x.id]) order.push(x.id); items[x.id] = x; });
    (remote.items || []).forEach(function (r) {
      var cur = items[r.id];
      if (!cur) { items[r.id] = r; order.push(r.id); stats.added++; return; }
      if (Number(r.updatedAt || 0) > Number(cur.updatedAt || 0)) { items[r.id] = r; stats.updated++; }
    });
    var txns = {}, torder = [];
    (local.txns || []).forEach(function (x) { if (!txns[x.id]) torder.push(x.id); txns[x.id] = x; });
    (remote.txns || []).forEach(function (r) {
      var cur = txns[r.id];
      if (!cur) { txns[r.id] = r; torder.push(r.id); stats.added++; return; }
      if (Number(r.updatedAt || 0) > Number(cur.updatedAt || 0)) { txns[r.id] = r; stats.updated++; }
    });
    var merged = {
      v: 2,
      items: order.map(function (k) { return items[k]; }).filter(function (x) { return !delIds[String(x.id)]; }),
      txns: torder.map(function (k) { return txns[k]; }).filter(function (x) { return !delTx[String(x.id)]; }),
      deletedIds: Object.keys(delIds),
      deletedTxnIds: Object.keys(delTx),
      settings: {
        targetMargin: normMargin(
          (Number(local.updatedAt) || 0) >= (Number(remote.updatedAt) || 0)
            ? (local.settings && local.settings.targetMargin)
            : (remote.settings && remote.settings.targetMargin)
        )
      },
      updatedAt: Math.max(Number(local.updatedAt) || 0, Number(remote.updatedAt) || 0)
    };
    stats.changed = JSON.stringify(merged) !== JSON.stringify(local);
    return { data: merged, stats: stats };
  }

  function syncNow(opt) {
    var silent = opt && opt.silent;
    if (!syncOn()) { if (!silent) { openSyncSheet(); } return Promise.resolve(null); }
    if (syncBusy) return Promise.resolve(null);
    syncBusy = true;
    renderSyncDot();
    return syncPull().then(function (res) {
      var needPush = false;
      if (!res) {
        // 원격이 비었거나 만료 → 기기 데이터를 올린다
        needPush = true;
        syncCfg.rev = 0;
      } else {
        var m = res.manifest;
        syncCfg.lastRemoteRev = Number(m.rev) || 0;
        if (m.rev === syncCfg.rev && Number(m.ts) <= Number(syncCfg.lastPushTs || 0) && !syncCfg.dirty) {
          syncCfg.lastSync = Date.now();
          syncCfg.lastCount = m.counts || syncCfg.lastCount;
          syncCfg.lastError = '';
          syncSave();
          return null;
        }
        var merged = mergeData(syncDataSnapshot(), res.doc.data);
        if (merged.stats.changed) {
          state = normalize(merged.data);
          dbSet(state);
          renderAll();
        }
        syncCfg.lastCount = m.counts || syncCfg.lastCount;
        needPush = true;
        if (merged.stats.changed && !silent) {
          // 사용자에게 알릴 변화량은 아래 토스트에서
        }
        syncCfg.remoteStats = merged.stats;
      }
      if (!needPush) return null;
      return syncPush().then(function () {
        var st = syncCfg.remoteStats || null;
        if (!silent) {
          var c = syncCfg.lastCount || {};
          var msg = '동기화 완료 · 재고 ' + (c.items || 0) + '종 · 거래 ' + (c.txns || 0) + '건';
          if (st && (st.added || st.updated)) msg += ' <span style="color:var(--muted2)">(받은 항목 ' + (st.added + st.updated) + ')</span>';
          toast(msg);
        }
      });
    }).catch(function (e) {
      syncCfg.lastError = String((e && e.message) || e);
      syncSave(); renderSyncDot();
      throw e;
    }).then(function (v) {
      syncBusy = false; renderSyncDot(); return v;
    }, function (e) {
      syncBusy = false; renderSyncDot();
      if (!silent) toast('동기화 실패 · ' + esc(syncCfg.lastError));
      return null;
    });
  }

  function scheduleSync() {
    if (!syncCfg || !syncCfg.ns) return;
    syncCfg.dirty = true;
    syncSave();
    renderSyncDot();
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      syncTimer = null;
      syncNow({ silent: true }).catch(function () { });
    }, 4000);
  }

  function syncTouchIfStale() {
    if (!syncOn()) return;
    var last = Number(syncCfg.lastPushTs) || 0;
    if (last && (Date.now() - last) >= TOUCH_MS) {
      syncNow({ silent: true }).catch(function () { });
    }
  }

  function renderSyncDot() {
    var dot = $('#syncdot');
    if (!dot) return;
    dot.className = 'dot' + (!syncOn() ? '' : (syncBusy ? ' wait' : (syncCfg.lastError ? ' err' : ' on')));
  }

  /* ============================================================
     sync sheet
     ============================================================ */
  function openSyncSheet() {
    var body = '';
    var stTxt = !syncOn() ? '연결 안 됨' : (syncBusy ? '동기화 중…' : (syncCfg.lastError ? '오류: ' + syncCfg.lastError : '연결됨 · 자동 동기화'));
    var dotCls = !syncOn() ? '' : (syncBusy ? ' wait' : (syncCfg.lastError ? ' err' : ' on'));
    body += '<div class="syncbox"><div class="st"><span class="d' + dotCls + '"></span><b>' + esc(stTxt) + '</b></div>';
    if (syncOn()) {
      var last = syncCfg.lastSync ? new Date(syncCfg.lastSync) : null;
      body += '<p class="desc">마지막 동기화 ' + (last ? (pad2(last.getMonth() + 1) + '.' + pad2(last.getDate()) + ' ' + pad2(last.getHours()) + ':' + pad2(last.getMinutes())) : '없음') +
        ' · 재고 ' + state.items.length + '종 · 거래 ' + state.txns.length + '건</p>';
      body += '<div class="codebox"><input readonly value="' + esc(syncCfg.ns) + '" id="ns-code" /><button class="btn small" data-s="copycode">복사</button></div>';
      body += '<div class="syncacts"><button class="btn" data-s="now">지금 동기화</button>' +
        '<button class="btn" data-s="link">기기 연결 링크 복사</button>' +
        '<button class="btn" data-s="new">새 코드 만들기</button></div>';
      body += '<div class="syncacts"><button class="btn ghost" data-s="switch">다른 코드로 연결</button>' +
        '<button class="btn ghost" data-s="off">연결 해제</button></div>';
      body += '<div class="codebox hidden" id="switch-box"><input placeholder="받은 코드 붙여넣기 (resellbook-…)" id="ns-input" /><button class="btn small" data-s="join">연결</button></div>';
    } else {
      body += '<p class="desc">코드를 만들면 다른 기기에서도 같은 재고·거래 기록을 볼 수 있어요. 가입이나 로그인은 없습니다.</p>';
      body += '<div class="syncacts"><button class="btn primary" data-s="new" style="flex:1">새 동기화 코드 만들기</button></div>';
      body += '<div class="codebox"><input placeholder="받은 코드 붙여넣기 (resellbook-…)" id="ns-input" /><button class="btn small" data-s="join">연결</button></div>';
    }
    body += '</div>';
    body += '<div class="note">· 인터넷에 있는 무료 저장소에 암호화 없이 보관됩니다. 코드를 아는 사람은 내용을 볼 수 있어요.<br />' +
      '· 사진을 많이 넣으면 동기화가 느려질 수 있어요.<br />' +
      '· 14일 넘게 접속이 없으면 자동으로 다시 올려 보관 기간을 늘립니다.</div>';
    body += '<div class="syncbox" style="margin-top:2px"><div class="st"><b>백업 파일</b></div>' +
      '<p class="desc">JSON 파일로 내려받아 두면 클라우드와 상관없이 되살릴 수 있어요.</p>' +
      '<div class="syncacts"><button class="btn" data-s="export">📥 내보내기</button><button class="btn" data-s="import">📤 불러오기</button></div>' +
      '<div class="syncacts"><button class="btn" data-s="csvinv">📄 재고 CSV</button><button class="btn" data-s="csvtx">📄 거래 CSV</button></div></div>';

    var sheet = openSheet({
      title: '동기화 · 백업',
      body: body,
      onMount: function (root) {
        root.addEventListener('click', function (e) {
          var b = e.target.closest('[data-s]');
          if (!b) return;
          var a = b.getAttribute('data-s');
          if (a === 'copycode') {
            copyText(syncCfg.ns).then(function (ok) { toast(ok ? '코드를 복사했어요' : '복사하지 못했어요'); });
          } else if (a === 'link') {
            var link = location.origin + location.pathname + '?k=' + syncCfg.ns;
            copyText(link).then(function (ok) { toast(ok ? '연결 링크를 복사했어요 · 다른 기기에서 열면 바로 연결됩니다' : '복사하지 못했어요'); });
          } else if (a === 'now') {
            syncNow({}).then(function () { closeSheet(); });
          } else if (a === 'new') {
            confirmSheet({
              title: '새 동기화 코드',
              text: '지금 기기의 데이터를 새 코드에 올립니다.<br />기존 코드로 연결된 다른 기기는 <b>새 코드를 입력해야</b> 같은 내용을 봅니다.',
              ok: '만들기'
            }).then(function (ok) {
              if (!ok) return;
              syncCfg.ns = syncNewNs();
              syncCfg.rev = 0;
              syncCfg.lastRemoteRev = 0;
              syncCfg.lastPushTs = 0;
              syncCfg.lastError = '';
              syncCfg.dirty = true;
              syncSave();
              closeSheet();
              syncNow({}).then(function () { openSyncSheet(); });
            });
          } else if (a === 'switch') {
            var box = root.querySelector('#switch-box');
            if (box) { box.classList.toggle('hidden'); var inp = box.querySelector('#ns-input'); if (inp && !box.classList.contains('hidden')) inp.focus(); }
          } else if (a === 'off') {
            confirmSheet({
              title: '연결 해제',
              text: '이 기기의 기록은 그대로 남고, 자동 동기화만 멈춥니다. 다시 연결하면 같은 코드로 이어집니다.',
              ok: '해제'
            }).then(function (ok2) {
              if (!ok2) return;
              syncCfg.ns = ''; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastPushTs = 0; syncCfg.lastError = '';
              syncSave(); renderAll(); closeSheet(); openSyncSheet();
            });
          } else if (a === 'join') {
            var v = (root.querySelector('#ns-input').value || '').trim();
            if (!/^resellbook-[a-z0-9]{6,}$/.test(v)) { toast('코드 형식이 맞지 않아요 (resellbook-…)'); return; }
            syncCfg.ns = v; syncCfg.rev = 0; syncCfg.lastRemoteRev = 0; syncCfg.lastPushTs = 0; syncCfg.lastError = '';
            syncSave(); closeSheet();
            syncNow({}).then(function () { openSyncSheet(); });
          } else if (a === 'export') {
            exportJson();
          } else if (a === 'csvinv') {
            exportInventoryCsv();
          } else if (a === 'csvtx') {
            exportTxnCsv();
          } else if (a === 'import') {
            $('#import-file').click();
          }
        });
      }
    });
    return sheet;
  }

  function copyText(txt) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).then(function () { return true; }, function () { return fallbackCopy(txt); });
    }
    return Promise.resolve(fallbackCopy(txt));
  }
  function fallbackCopy(txt) {
    try {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  /* ============================================================
     backup
     ============================================================ */
  function exportJson() {
    var payload = {
      app: 'resellbook', version: 1, exportedAt: new Date().toISOString(),
      data: syncDataSnapshot()
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'resellbook-backup-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('백업 파일을 내려받았어요 · 재고 ' + state.items.length + '종');
  }

  function importJson(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var obj = null;
      try { obj = JSON.parse(String(reader.result)); } catch (e) { obj = null; }
      if (!obj) { toast('JSON 파일을 읽지 못했어요'); return; }
      var data = obj.data && typeof obj.data === 'object' ? obj.data : obj;
      if (!data || (!Array.isArray(data.items) && !Array.isArray(data.txns))) {
        toast('리셀북 백업 파일이 아니에요'); return;
      }
      var incoming = normalize(data);
      var merged = mergeData(syncDataSnapshot(), incoming);
      confirmSheet({
        title: '백업 불러오기',
        text: '이 파일: 재고 <b>' + incoming.items.length + '종</b> · 거래 <b>' + incoming.txns.length + '건</b><br /><br />' +
          '지금 기기 기록에 <b>합쳐서</b> 저장합니다 (같은 상품은 최근 수정본이 남아요).<br />기존 기록은 지워지지 않아요.',
        ok: '합치기'
      }).then(function (ok) {
        if (!ok) return;
        state = normalize(merged.data);
        save(); renderAll();
        toast('불러왔어요 · 새 항목 ' + (merged.stats.added || 0) + '건');
      });
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요'); };
    reader.readAsText(file);
  }

  /* ============================================================
     목표 마진율 · CSV
     ============================================================ */
  function openMarginSheet() {
    var cur = targetMargin();
    var body = '<div class="field"><label>목표 마진율</label>' +
      '<div class="seg" id="m-seg">' +
      [10, 20, 30, 40].map(function (m) { return '<button type="button" class="' + (m === cur ? 'on' : '') + '" data-m="' + m + '">' + m + '%</button>'; }).join('') +
      '</div>' +
      '<input id="m-input" type="number" inputmode="numeric" min="5" max="80" step="1" value="' + cur + '" style="margin-top:8px" /></div>' +
      '<div class="calc" id="m-calc"></div>' +
      '<div class="note">상품·사이즈마다 추천 판매가(원가 ÷ (1 − 목표마진), 100원 단위 올림)를 계산해 카드와 판매 화면에 보여 줍니다. 수수료·배송비는 빼지 않은 값이에요.</div>';
    var sheet = openSheet({
      title: '목표 마진율', sub: '판매가 추천', body: body,
      foot: '<button class="btn ghost" data-x5="1">취소</button><button class="btn primary" id="m-save">저장</button>',
      onMount: function (root) {
        var input = root.querySelector('#m-input');
        var calcEl = root.querySelector('#m-calc');
        function preview() {
          var m = normMargin(input.value);
          function recOf(cost) { return Math.ceil((cost / (1 - m / 100)) / 100) * 100; }
          calcEl.innerHTML = '<div class="line"><span>목표 마진</span><b>' + m + '%</b></div>' +
            '<div class="line"><span>예: 원가 ₩62,000</span><b>추천 ' + won(recOf(62000)) + '</b></div>' +
            '<div class="line total"><span>예: 원가 ₩80,000</span><b>추천 ' + won(recOf(80000)) + '</b></div>';
        }
        root.querySelector('#m-seg').addEventListener('click', function (e) {
          var b = e.target.closest('button[data-m]');
          if (!b) return;
          input.value = b.getAttribute('data-m');
          $$('#m-seg button').forEach(function (x) { x.classList.toggle('on', x === b); });
          preview();
        });
        input.addEventListener('input', preview);
        preview();
        root.querySelector('[data-x5]').onclick = closeSheet;
        root.querySelector('#m-save').onclick = function () {
          var m = normMargin(input.value);
          if (!state.settings) state.settings = { targetMargin: 20 };
          state.settings.targetMargin = m;
          save(); closeSheet(); renderAll();
          toast('목표 마진 ' + m + '%로 저장했어요');
        };
      }
    });
    return sheet;
  }

  function csvEsc(v) {
    var s = String(v == null ? '' : v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function csvDownload(name, rows) {
    var text = rows.map(function (r) { return r.map(csvEsc).join(','); }).join('\r\n');
    /* 한국어 엑셀에서 깨지지 않도록 UTF-8 BOM */
    var blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function exportInventoryCsv() {
    var rows = [['상품명', '카테고리', '사이즈', '수량', '개당단가', '재고원가', '추천판매가', '구매처', '구매일', '상태', '메모']];
    state.items.forEach(function (it) {
      var st = effStatus(it);
      if (hasVar(it)) {
        it.variants.slice().sort(bySizeOrder).forEach(function (v) {
          var rec = recommendPrice(v.cost);
          rows.push([it.name, it.cat, v.size, Number(v.qty) || 0,
            v.cost == null ? '' : Math.round(v.cost),
            v.cost == null ? '' : Math.round((Number(v.qty) || 0) * v.cost),
            rec == null ? '' : rec, it.source, it.buyDate, st, it.memo]);
        });
      } else {
        var avg = itemAvg(it), rec2 = recommendPrice(avg);
        rows.push([it.name, it.cat, '', itemQty(it), avg == null ? '' : avg, itemValue(it) || '',
          rec2 == null ? '' : rec2, it.source, it.buyDate, st, it.memo]);
      }
    });
    csvDownload('resellbook-inventory-' + today() + '.csv', rows);
    toast('재고 CSV 내려받았어요 · ' + (rows.length - 1) + '줄');
  }

  function exportTxnCsv() {
    var rows = [['날짜', '구분', '상품명', '사이즈', '수량', '단가', '총액', '원가', '수수료', '배송비', '순이익', '마진율(%)', '판매처', '메모']];
    state.txns.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.createdAt || 0) - (b.createdAt || 0);
    }).forEach(function (t) {
      var margin = (t.type === 'sale' && t.total) ? Math.round((t.profit / t.total) * 1000) / 10 : '';
      rows.push([t.date, t.type === 'sale' ? '판매' : '입고', t.name, t.size || '', t.qty,
        Math.round(t.unitPrice), Math.round(t.total), t.costUnknown ? '' : Math.round(t.costTotal),
        Math.round(t.fee), Math.round(t.ship), Math.round(t.profit), margin, t.venue, t.memo]);
    });
    csvDownload('resellbook-transactions-' + today() + '.csv', rows);
    toast('거래 CSV 내려받았어요 · ' + (rows.length - 1) + '건');
  }

  /* ============================================================
     menu
     ============================================================ */
  function openMenu() {
    var inv = invStats();
    var sizeTxt = '—';
    try { sizeTxt = (JSON.stringify(state).length / 1024).toFixed(0) + 'KB'; } catch (e) { }
    var body = '<div class="syncbox"><div class="ownername">📒 리셀북 <span style="color:var(--muted2)">v1.2</span></div>' +
      '<p class="desc">재고 ' + state.items.length + '종 · 거래 ' + state.txns.length + '건 · 저장 ' + sizeTxt + '</p>' +
      '<div class="syncacts">' +
      '<button class="btn" data-mm="sync">🔄 동기화</button>' +
      '<button class="btn" data-mm="margin">🎯 목표 마진 ' + targetMargin() + '%</button>' +
      '<button class="btn" data-mm="export">📥 백업 내보내기</button>' +
      '<button class="btn" data-mm="import">📤 불러오기</button>' +
      '</div>' +
      '<div class="syncacts">' +
      '<button class="btn" data-mm="csvinv">📄 재고 CSV</button>' +
      '<button class="btn" data-mm="csvtx">📄 거래 CSV</button>' +
      '</div></div>' +
      '<div class="note">· 판매는 보통 크림에서 이뤄져 판매처 기본값을 크림으로 두었어요.<br />' +
      '· CSV는 엑셀에서 한글이 깨지지 않게 저장됩니다(UTF-8 BOM).</div>' +
      '<div class="note">· 기록은 이 기기 브라우저에 저장되고, 동기화를 켜면 다른 기기와도 맞춰져요.<br />' +
      '· 이 페이지는 검색엔진에 노출되지 않아요.<br />' +
      '· 사진은 넣을 때 자동으로 줄여서 저장합니다.</div>';
    var sheet = openSheet({ title: '리셀북', body: body });
    sheet.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mm]');
      if (!b) return;
      var a = b.getAttribute('data-mm');
      if (a === 'sync') { closeSheet(); openSyncSheet(); }
      if (a === 'export') exportJson();
      if (a === 'import') $('#import-file').click();
      if (a === 'margin') { closeSheet(); openMarginSheet(); }
      if (a === 'csvinv') exportInventoryCsv();
      if (a === 'csvtx') exportTxnCsv();
    });
  }

  /* ============================================================
     events
     ============================================================ */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');
    if (act === 'add') openItemForm();
    else if (act === 'status') { view.status = t.getAttribute('data-status'); renderStatusChips(); renderInv(); }
    else if (act === 'month') { view.month = t.getAttribute('data-month'); renderMonthbar(); renderDash(); }
    else if (act === 'txtype') { view.txType = t.getAttribute('data-txtype'); renderTx(); }
    else if (act === 'plmonth') { view.plMonth = t.getAttribute('data-month'); renderPL(); }
    else if (act === 'detail') openDetail(id);
    else if (act === 'menu') openItemMenu(id);
    else if (act === 'sell') openSell(id);
    else if (act === 'restock') openRestock(id);
    else if (act === 'plus') quickQty(id, 1);
    else if (act === 'minus') quickQty(id, -1);
    else if (act === 'txdel') deleteTxn(id);
    else if (act === 'margin') {
      var add = t.getAttribute('data-add');
      var set = t.getAttribute('data-set');
      var next = set != null ? Number(set) : targetMargin() + Number(add);
      next = normMargin(next);
      if (!state.settings) state.settings = { targetMargin: 20 };
      if (next === state.settings.targetMargin) return;
      state.settings.targetMargin = next;
      save(); renderDash(); renderInv();
    }
    else if (act === 'reset-filter') {
      view.q = ''; view.status = 'all'; view.cat = 'all'; view.sort = 'recent';
      $('#q').value = ''; $('#catsel').value = 'all'; $('#sortsel').value = 'recent';
      renderStatusChips(); renderInv();
    }
  });

  $('#tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) setTab(b.getAttribute('data-view'));
  });
  $('#fab').addEventListener('click', function () { openItemForm(); });
  $('#btn-menu').addEventListener('click', openMenu);
  $('#btn-sync').addEventListener('click', function () { openSyncSheet(); });

  var qTimer = null;
  $('#q').addEventListener('input', function (e) {
    view.q = e.target.value;
    if (qTimer) clearTimeout(qTimer);
    qTimer = setTimeout(function () { renderInv(); }, 90);
  });
  $('#catsel').addEventListener('change', function (e) { view.cat = e.target.value; renderInv(); });
  $('#sortsel').addEventListener('change', function (e) { view.sort = e.target.value; renderInv(); });
  $('#import-file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importJson(f);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheet();
  });

  /* ============================================================
     url key + boot
     ============================================================ */
  function applyUrlKey() {
    var p = new URLSearchParams(location.search);
    var k = (p.get('k') || '').trim();
    if (!k) {
      var h = String(location.hash || '').replace(/^#k=/, '');
      if (h && /^resellbook-/.test(h)) k = h.trim();
    }
    if (!k) return;
    if (!/^resellbook-[a-z0-9]{6,}$/.test(k)) return;
    if (syncCfg.ns === k) return;
    syncCfg.ns = k;
    syncCfg.rev = 0;
    syncCfg.lastRemoteRev = 0;
    syncCfg.lastPushTs = 0;
    syncCfg.lastError = '';
    syncSave();
    try {
      var u = new URL(location.href);
      u.searchParams.delete('k');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) { }
  }

  window.__errs = [];
  window.addEventListener('error', function (e) { window.__errs.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function (e) {
    window.__errs.push('rejection: ' + String((e && e.reason && e.reason.message) || e.reason));
  });

  function boot() {
    syncLoad();
    dbGet().then(function (saved) {
      state = normalize(saved);
      applyUrlKey();
      renderAll();
      if (syncOn()) {
        syncNow({ silent: true }).catch(function () { });
        syncTouchIfStale();
      }
    }).catch(function () {
      state = blank();
      renderAll();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* expose a tiny hook for self-checks */
  window.__resellbook = {
    get state() { return state; },
    version: '1.2'
  };
})();

</script>
</body>
</html>
