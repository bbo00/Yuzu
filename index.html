<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>유자 홈 · 웹앱 링크 & 동기화 코드</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#FBFBFD" />
<style>
  :root{
    --bg:#FBFBFD; --card:#FFFFFF; --ink:#1D1F26; --ink2:#5B6070; --muted:#8B90A0;
    --line:#ECECF2; --line2:#E1E1EB; --on:#2F9E6F; --off:#C2C6D2;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; line-height:1.5;
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto 0; height:430px; pointer-events:none; z-index:0;
    background:
      radial-gradient(60% 70% at 15% 0%, #FFF3D9 0%, rgba(255,243,217,0) 60%),
      radial-gradient(55% 65% at 85% 0%, #E9F1FF 0%, rgba(233,241,255,0) 62%),
      radial-gradient(50% 60% at 50% 8%, #FCEBF6 0%, rgba(252,235,246,0) 66%);
  }
  .wrap{position:relative; z-index:1; width:100%; max-width:1040px; margin:0 auto;
    padding:26px 18px calc(40px + env(safe-area-inset-bottom))}

  /* ---------- hero ---------- */
  .hero{margin:4px 0 18px}
  .kicker{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    color:#8A6A12; background:#FFF6E0; border:1px solid #F7E7C2; padding:5px 10px; border-radius:999px}
  h1{font-size:25px; line-height:1.3; letter-spacing:-.7px; margin:12px 0 8px; font-weight:800}
  .sub{margin:0; color:var(--ink2); font-size:13.5px; line-height:1.62; max-width:660px}
  @media (min-width:760px){ h1{font-size:30px} .sub{font-size:14px} }

  /* ---------- shared bits ---------- */
  .dot{width:9px; height:9px; border-radius:999px; flex:none; margin-top:6px; background:var(--off)}
  .dot.on{background:var(--on); box-shadow:0 0 0 3px rgba(47,158,111,.14)}
  .dot.warn{background:#E0A03A; box-shadow:0 0 0 3px rgba(224,160,58,.16)}
  .dot.rec{background:#6F8FE8; box-shadow:0 0 0 3px rgba(111,143,232,.14)}

  .btn{
    font:inherit; font-size:14px; line-height:1; border-radius:11px; border:1px solid var(--line2);
    background:#fff; color:var(--ink); padding:0 12px; height:36px; display:inline-flex;
    align-items:center; justify-content:center; gap:6px; cursor:pointer; text-decoration:none;
    white-space:nowrap; transition:background .12s, border-color .12s, transform .1s;
  }
  .btn:hover{border-color:#CFCFDD}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--ink); border-color:var(--ink); color:#fff}
  .btn.primary:hover{background:#2B2E38}
  .btn.sm{height:34px; font-size:13.5px; padding:0 11px; border-radius:10px}
  .btn.block{width:100%}
  .btn[disabled],.btn[aria-disabled="true"]{opacity:.45; pointer-events:none}

  .code,.joinrow input,.editbox input{
    font:inherit; font-size:16px; color:var(--ink); background:#FBFAFE; border:1px solid var(--line2);
    border-radius:11px; padding:9px 11px; width:100%; min-width:0; height:38px;
  }
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:16px; color:#3C3F4C}
  .code::placeholder{font-family:inherit; color:#A9AEBF}
  .code:focus,.joinrow input:focus,.editbox input:focus{outline:2px solid #DCD8FF; outline-offset:1px; border-color:#C9C3F5}

  .coderow{display:flex; gap:8px; align-items:center; margin-top:10px}
  .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .hint{font-size:12px; color:var(--muted); line-height:1.55; margin:8px 0 0}

  /* ---------- hub panel ---------- */
  .hub{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px;
    box-shadow:0 1px 2px rgba(20,20,40,.03), 0 10px 26px -22px rgba(20,20,40,.5); margin-bottom:14px}
  .hubtop{display:flex; align-items:flex-start; gap:10px}
  .hubtext{flex:1; min-width:0}
  .hubtext b{display:block; font-size:14.5px; letter-spacing:-.2px}
  .hubtext small{display:block; color:var(--muted); font-size:12.5px; line-height:1.5; margin-top:2px}
  .joinbox{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line2)}
  .joinrow{display:flex; gap:8px; margin-top:8px}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; align-items:center; gap:10px; justify-content:space-between; margin:0 2px 10px}
  .sum{font-size:12.5px; color:var(--muted)}

  /* ---------- app cards ---------- */
  .apps{display:grid; gap:12px; grid-template-columns:1fr}
  @media (min-width:760px){ .apps{grid-template-columns:1fr 1fr} }
  .app{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px;
    box-shadow:0 1px 2px rgba(20,20,40,.03), 0 10px 26px -24px rgba(20,20,40,.5)}
  .ahead{display:flex; align-items:center; gap:11px}
  .aico{flex:none; width:42px; height:42px; border-radius:13px; display:grid; place-items:center;
    font-size:21px; background:var(--tint,#F3F4F9); border:1px solid rgba(20,20,40,.045)}
  .ameta{flex:1; min-width:0}
  .ameta h2{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.3px}
  .ameta p{margin:2px 0 0; font-size:12.5px; color:var(--muted); line-height:1.45}
  .open{flex:none; font-size:13px; font-weight:600; color:#4B46C4; text-decoration:none; white-space:nowrap;
    padding:7px 9px; border-radius:9px; border:1px solid #E6E2FB; background:#FAF8FF}
  .open:hover{background:#F3F0FF}
  .stat{display:flex; align-items:flex-start; gap:7px; margin:11px 0 0; font-size:12.5px; color:var(--ink2); line-height:1.45}
  .stat span.body{min-width:0}
  .stat b{font-weight:700; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all}
  .mini{display:block; margin:7px 0 0 16px; font:inherit; font-size:12px; color:#8A6A12;
    background:#FFF7E6; border:1px solid #F6E6C4; border-radius:8px; padding:5px 8px; cursor:pointer}
  .editbox{margin-top:10px; padding:11px; border:1px dashed var(--line2); border-radius:13px; background:#FCFCFF}
  .editbox input{margin-top:6px}
  .erow{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
  .editbox .warn{margin:8px 0 0; font-size:12px; color:#A9591F; background:#FFF4EA;
    border:1px solid #F7DFCB; border-radius:9px; padding:7px 9px; line-height:1.5}

  .foot{margin-top:22px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted);
    font-size:12px; line-height:1.6; text-align:center}
  .foot code{background:#F1F1F7; padding:1px 5px; border-radius:5px; font-size:11px}

  .toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px); background:#1D1F26; color:#fff; font-size:13.5px;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .18s, transform .18s; z-index:50; max-width:86vw; text-align:center}
  .toast.show{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">🍋 유자 홈</div>
    <h1>내 웹앱 <span id="appCount">9</span>개<br />링크 &amp; 동기화 코드</h1>
    <p class="sub">앱마다 쓰는 동기화 코드를 여기 한 곳에 모아뒀어요. 이 기기에서 쓰던 코드는 자동으로 읽어오고, 허브 코드 하나만 있으면 새 기기·다른 브라우저에서도 링크와 코드 목록이 그대로 복원됩니다.</p>
  </header>

  <section class="hub" id="hub" aria-live="polite"></section>

  <div class="toolbar">
    <span class="sum" id="sum">불러오는 중…</span>
    <button class="btn sm" type="button" id="backupBtn">전체 코드 복사</button>
  </div>

  <div class="apps" id="apps"></div>

  <footer class="foot">
    <p>코드는 이 기기 저장소와 내 허브 클라우드에만 있어요. 공개 저장소(<code>Yuzu</code>) 소스에는 코드가 들어가지 않습니다.</p>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var SYNC_BASE = 'https://mantledb.sh/v2/';
  var PART_MAX = 58000;
  var CFG_KEY = 'yujuhub.sync.v1';
  var DATA_KEY = 'yujuhub.codes.v1';
  var HUB_PREFIX = 'yujuhub-';

  var APPS = [
    { id:'closet', name:'유자클로젯',        desc:'옷장 정리 · 코디 · 오늘 입은 옷 기록',            path:'closet/', icon:'👗', tint:'#FCEFF3', cfg:'yujacloset_sync_v1',  prefix:'yujacloset' },
    { id:'resell', name:'리셀북',            desc:'중고 판매 재고 · 원가 대비 손익 장부',            path:'resell/', icon:'📒', tint:'#FFF6E3', cfg:'resellbook_sync_v1',  prefix:'resellbook' },
    { id:'living', name:'우리 살림칸',        desc:'생활용품 재고 · 소비기한 · 제품 후기',            path:'living/', icon:'🧺', tint:'#E9F7EF', cfg:'salimkan-sync-v1',    prefix:'salimkan' },
    { id:'health', name:'병원·건강 수첩',     desc:'병원 방문 · 증상 · 병원비 기록',                  path:'health/', icon:'🩺', tint:'#E8F3FB', cfg:'health_sync_v1',      prefix:'health' },
    { id:'memo',   name:'유자 메모',          desc:'카톡 채팅방식 메모장 · 사진·링크·캘린더',         path:'memo/',   icon:'📝', tint:'#F1EEFB', cfg:'yuzumemo.sync.v1',    prefix:'yuzumemo' },
    { id:'review', name:'블로그 체험단 수첩',  desc:'체험단·내돈내산 원고 초안과 글쓰기 기록',          path:'review/', icon:'✍️', tint:'#FDEFE7', cfg:'yujareview_sync_v1',  prefix:'yujareview' },
    { id:'cards',  name:'@IMING 카드',        desc:'인스타 카드뉴스 · 릴스 요약표 (1080 PNG)',        path:'cards/',  icon:'🎨', tint:'#FFF9E0', cfg:'imingcards_sync_v1',  prefix:'imingcards' },
    { id:'home',   name:'우리집 수납 지도',    desc:'방별 수납 지도 · 냉장고 칸 · 가구 배치',          path:'home/',   icon:'🏠', tint:'#EAF6F2', cfg:'homeMap.sync.v1',     prefix:'home' },
    { id:'events', name:'경조사비 수첩',      desc:'보낸·받은 경조사비 · 답례 기록',                   path:'events/', icon:'💌', tint:'#FDEFF2', cfg:'events_sync_v1',      prefix:'events' }
  ];

  var hub = { apps: {} };
  var cfg = { ns:'', rev:0, lastRemoteRev:0, lastPushTs:0, lastSync:0, lastError:'', deviceId:'' };
  var busy = false, pushTimer = null, pushedSig = '', hubOpen = false, joinValue = '', editState = {};

  /* ---------------- helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function nowTs() { return Date.now(); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtTime(ms) {
    if (!ms) return '';
    var d = new Date(Number(ms));
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDay(ms) {
    var d = new Date(ms || Date.now());
    return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
  }
  function randCode() {
    var abc = 'abcdefghijkmnpqrstuvwxyz23456789', s = '';
    for (var i = 0; i < 10; i++) s += abc.charAt(Math.floor(Math.random() * abc.length));
    return s;
  }
  function parseCode(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var q = s.match(/[?&#](?:k|key|code|sync)=([A-Za-z0-9_\-]+)/i);
    if (q) s = q[1];
    s = s.replace(/^https?:\/\/[^\/]+\//i, '').replace(/^v2\//i, '').replace(/[\/?#].*$/, '');
    s = s.replace(/\s+/g, '');
    if (!/^[A-Za-z0-9][A-Za-z0-9_\-]{1,60}$/.test(s)) return '';
    return s.toLowerCase();
  }
  function baseUrl() {
    var p = location.pathname.replace(/index\.html$/, '');
    if (p.charAt(p.length - 1) !== '/') p += '/';
    return location.origin + p;
  }
  function linkFor(app, code) {
    return baseUrl() + app.path + '?k=' + encodeURIComponent(code);
  }
  function appById(id) {
    for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i];
    return null;
  }
  function codeFor(app) {
    var s = hub.apps[app.id];
    return (s && s.code) ? s.code : '';
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1900);
  }

  function copyText(text) {
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }
  function copyWithToast(text, okMsg) {
    return copyText(text).then(function (ok) {
      toast(ok ? (okMsg || '복사했어요') : '복사가 안 됐어요. 코드를 길게 눌러 선택해 주세요');
    });
  }

  /* ---------------- local storage ---------------- */
  function loadCfg() {
    try { var raw = localStorage.getItem(CFG_KEY); if (raw) cfg = Object.assign(cfg, JSON.parse(raw)); } catch (e) {}
    if (typeof cfg.ns !== 'string') cfg.ns = '';
    cfg.rev = Number(cfg.rev) || 0;
    cfg.lastRemoteRev = Number(cfg.lastRemoteRev) || 0;
    cfg.lastPushTs = Number(cfg.lastPushTs) || 0;
    cfg.lastSync = Number(cfg.lastSync) || 0;
    if (!cfg.deviceId) cfg.deviceId = 'dev-' + randCode().slice(0, 6);
  }
  function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
  function loadData() {
    try {
      var raw = localStorage.getItem(DATA_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && o.apps && typeof o.apps === 'object') hub.apps = o.apps;
      }
    } catch (e) { hub.apps = {}; }
  }
  function saveData() { try { localStorage.setItem(DATA_KEY, JSON.stringify({ apps: hub.apps })); } catch (e) {} }

  function readAppCfg(app) {
    var out = { code:'', lastSync:0 };
    try {
      var raw = localStorage.getItem(app.cfg);
      if (!raw) return out;
      var o = null;
      try { o = JSON.parse(raw); } catch (e) { o = null; }
      var ns = (o && typeof o === 'object') ? (o.ns || '') : String(raw);
      out.code = parseCode(ns);
      out.lastSync = Number(o && o.lastSync) || 0;
    } catch (e) {}
    return out;
  }

  /* 이 기기에서 실제로 쓰는 코드를 아직 기록이 없을 때만 자동 기록 */
  function adoptDeviceCodes() {
    var changed = false;
    APPS.forEach(function (a) {
      var d = readAppCfg(a);
      if (!d.code) return;
      if (!hub.apps[a.id]) {
        hub.apps[a.id] = { code: d.code, updatedAt: nowTs() };
        changed = true;
      }
    });
    return changed;
  }

  function setCode(id, code) {
    hub.apps[id] = { code: code || '', updatedAt: nowTs() };
    saveData();
    schedulePush();
  }

  function otherAppForCode(id, code) {
    if (!code) return null;
    var low = code.toLowerCase();
    for (var i = 0; i < APPS.length; i++) {
      var a = APPS[i];
      if (a.id === id) continue;
      if (low.indexOf(a.prefix + '-') === 0) return a;
    }
    return null;
  }

  /* ---------------- cloud sync (mantledb, 다른 앱과 같은 방식) ---------------- */
  function syncFetch(url, opts) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 20000);
    return fetch(url, Object.assign({ signal: ctrl.signal, cache: 'no-store' }, opts || {})).then(function (res) {
      clearTimeout(timer);
      return res;
    }, function (err) { clearTimeout(timer); throw err; });
  }
  function syncPost(path, obj) {
    return syncFetch(SYNC_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    });
  }
  function syncGet(path) {
    return syncFetch(SYNC_BASE + path, { method: 'GET' }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text().then(function (txt) {
        if (!txt) return null;
        try { return JSON.parse(txt); } catch (e) { return null; }
      });
    });
  }
  function errMsg(e) {
    var m = String((e && e.message) ? e.message : (e || ''));
    if (!m || m === 'HTTP 0' || /Failed to fetch|NetworkError|Load failed|aborted|AbortError/i.test(m)) {
      return '네트워크에 연결할 수 없어요 (인터넷 상태 확인)';
    }
    return m;
  }
  function chunkByEscapedBytes(doc, maxBytes) {
    function byteLen(ch) {
      var cc = ch.charCodeAt(0);
      if (ch === '"' || ch === '\\') return 2;
      if (cc < 0x20) return 6;
      if (cc < 0x80) return 1;
      if (cc < 0x800) return 2;
      if (cc >= 0xD800 && cc <= 0xDBFF) return 4;
      if (cc >= 0xDC00 && cc <= 0xDFFF) return 0;
      return 3;
    }
    var parts = [], cur = '', curLen = 0;
    for (var i = 0; i < doc.length; i++) {
      var ch = doc.charAt(i), b = byteLen(ch);
      if (curLen + b > maxBytes) { parts.push(cur); cur = ch; curLen = b; }
      else { cur += ch; curLen += b; }
    }
    if (cur) parts.push(cur);
    return parts;
  }
  function mergeApps(local, remote) {
    var out = {};
    var names = {};
    [local || {}, remote || {}].forEach(function (o) { for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) names[k] = 1; });
    Object.keys(names).forEach(function (k) {
      var a = local ? local[k] : null, b = remote ? remote[k] : null;
      if (!a) { out[k] = b; return; }
      if (!b) { out[k] = a; return; }
      var at = Number(a.updatedAt) || 0, bt = Number(b.updatedAt) || 0;
      out[k] = bt > at ? b : a;
    });
    return out;
  }
  function readManifest() {
    return syncGet(cfg.ns + '/v1/manifest').then(function (m) {
      if (!m || !m.parts || !m.parts.length) return null;
      return m;
    });
  }
  function readRemoteApps(manifest) {
    var buf = '';
    var chain = Promise.resolve();
    manifest.parts.forEach(function (p) {
      chain = chain.then(function () {
        return syncGet(p.ns + '/' + p.k).then(function (part) {
          if (!part || typeof part.c !== 'string') throw new Error('조각을 읽지 못했어요');
          buf += part.c;
        });
      });
    });
    return chain.then(function () {
      var doc = null;
      try { doc = JSON.parse(buf); } catch (e) { throw new Error('원격 데이터 형식이 올바르지 않아요'); }
      return (doc && doc.data && doc.data.apps) ? doc.data.apps : {};
    });
  }
  function push() {
    var doc = JSON.stringify({ v:1, app:'yujuhub', ts: nowTs(), device: cfg.deviceId, data: { apps: hub.apps } });
    var parts = chunkByEscapedBytes(doc, PART_MAX);
    var chain = Promise.resolve();
    parts.forEach(function (p, i) {
      chain = chain.then(function () { return syncPost(cfg.ns + '/v1/p' + i, { c: p }); });
    });
    return chain.then(function () {
      var rev = Math.max(Number(cfg.rev) || 0, Number(cfg.lastRemoteRev) || 0) + 1;
      var ts = nowTs();
      var manifest = {
        t: 1, app: 'yujuhub', rev: rev, ts: ts, device: cfg.deviceId,
        parts: parts.map(function (p, i) { return { ns: cfg.ns, k: 'v1/p' + i }; }),
        counts: { apps: Object.keys(hub.apps).length }, bytes: doc.length
      };
      return syncPost(cfg.ns + '/v1/manifest', manifest).then(function () {
        cfg.rev = rev;
        cfg.lastRemoteRev = rev;
        cfg.lastPushTs = ts;
        cfg.lastSync = ts;
        cfg.lastError = '';
        saveCfg();
        pushedSig = JSON.stringify(hub.apps);
        renderHub();
        renderSum();
      });
    });
  }
  function doSync(opts) {
    if (!cfg.ns || busy) return Promise.resolve();
    var skipRead = !!(opts && opts.skipRead);
    var m = null, remoteApps = null;
    busy = true;
    renderHub();
    var first = skipRead ? Promise.resolve(null) : readManifest();
    return first.then(function (mm) {
      m = mm;
      if (m) {
        cfg.lastRemoteRev = Number(m.rev) || 0;
        var same = Number(m.rev) === Number(cfg.rev) && Number(m.ts || 0) <= Number(cfg.lastPushTs || 0);
        if (!same) {
          return readRemoteApps(m).then(function (apps) { remoteApps = apps; });
        }
      }
      return null;
    }).then(function () {
      if (remoteApps) {
        var merged = mergeApps(hub.apps, remoteApps);
        if (JSON.stringify(merged) !== JSON.stringify(hub.apps)) { hub.apps = merged; saveData(); }
      }
      if (adoptDeviceCodes()) saveData();
      var sig = JSON.stringify(hub.apps);
      if (!m || sig !== pushedSig) return push();
      cfg.lastSync = Number(cfg.lastSync) || nowTs();
      cfg.lastError = '';
      saveCfg();
      return null;
    }).catch(function (e) {
      cfg.lastError = errMsg(e);
      saveCfg();
    }).then(function () {
      busy = false;
      renderHub();
      renderSum();
      renderApps();
    });
  }
  function schedulePush() {
    if (!cfg.ns) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      if (busy) { schedulePush(); return; }
      busy = true;
      renderHub();
      push().catch(function (e) { cfg.lastError = errMsg(e); saveCfg(); }).then(function () {
        busy = false;
        renderHub(); renderSum(); renderApps();
      });
    }, 1200);
  }

  /* ---------------- render: hub ---------------- */
  function renderHub() {
    var el = $('#hub');
    var html = '';
    if (!cfg.ns) {
      html += '<div class="hubtop">'
        + '<span class="dot off"></span>'
        + '<div class="hubtext"><b>허브 동기화 꺼짐</b>'
        + '<small>지금은 이 기기 브라우저에만 기록돼요. 허브 코드를 만들면 새 기기·다른 브라우저에서도 이 목록이 그대로 복원됩니다.</small></div>'
        + '<button class="btn sm primary" type="button" data-hact="open-join">연결하기</button>'
        + '</div>';
      if (hubOpen) {
        html += '<div class="joinbox">'
          + '<button class="btn primary block" type="button" data-hact="new">새 허브 코드 만들기</button>'
          + '<div class="joinrow">'
          + '<input id="joinInput" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="허브 코드 또는 링크 붙여넣기" value="' + esc(joinValue) + '" aria-label="허브 동기화 코드" />'
          + '<button class="btn" type="button" data-hact="join">연결</button>'
          + '</div>'
          + '<p class="hint">다른 기기에서 만든 허브 코드(<b>yujuhub-…</b>)나 <b>?k=</b>가 붙은 허브 링크를 붙여넣으면 그 목록을 불러옵니다.</p>'
          + '</div>';
      }
    } else {
      var last = cfg.lastError
        ? '⚠️ ' + cfg.lastError
        : (busy ? '동기화 중…' : ('마지막 동기화 ' + (fmtTime(cfg.lastSync) || '기록 없음')));
      html += '<div class="hubtop">'
        + '<span class="dot on"></span>'
        + '<div class="hubtext"><b>허브 동기화 연결됨</b><small>' + esc(last) + '</small></div>'
        + '<button class="btn sm" type="button" data-hact="sync">' + (busy ? '…' : '지금 동기화') + '</button>'
        + '</div>'
        + '<div class="coderow">'
        + '<input class="code" type="text" readonly value="' + esc(cfg.ns) + '" aria-label="허브 동기화 코드" />'
        + '<button class="btn sm" type="button" data-hact="copycode">복사</button>'
        + '</div>'
        + '<div class="acts">'
        + '<button class="btn sm" type="button" data-hact="copylink">허브 링크 복사</button>'
        + '<button class="btn sm" type="button" data-hact="off">연결 해제</button>'
        + '</div>';
    }
    el.innerHTML = html;
  }

  function renderSum() {
    var rec = 0, dev = 0;
    APPS.forEach(function (a) {
      if (codeFor(a)) rec++;
      if (readAppCfg(a).code) dev++;
    });
    $('#sum').textContent = '코드 기록 ' + rec + '/' + APPS.length + ' · 이 기기 연결 ' + dev + '/' + APPS.length;
    $('#appCount').textContent = String(APPS.length);
  }

  /* ---------------- render: app cards ---------------- */
  function renderApps() {
    var html = APPS.map(function (a) {
      var d = readAppCfg(a);
      var rec = codeFor(a);
      var stateCls = 'off', stateText = '코드 없음 · 아래에서 입력할 수 있어요';
      if (d.code && rec && d.code === rec) {
        stateCls = 'on';
        stateText = '이 기기 연결됨' + (d.lastSync ? ' · 마지막 동기화 ' + fmtTime(d.lastSync) : '');
      } else if (d.code && rec) {
        stateCls = 'warn';
        stateText = '이 기기 앱은 <b>' + esc(d.code) + '</b> 로 연결돼 있어요 (기록과 다름)';
      } else if (d.code) {
        stateCls = 'on';
        stateText = '이 기기 연결됨' + (d.lastSync ? ' · 마지막 동기화 ' + fmtTime(d.lastSync) : '');
      } else if (rec) {
        stateCls = 'rec';
        stateText = '기록됨 · 이 기기 앱은 아직 연결 전';
      }

      var adoptBtn = (d.code && rec && d.code !== rec)
        ? '<button class="mini" type="button" data-act="adopt" data-id="' + a.id + '">이 기기 코드로 기록 바꾸기</button>'
        : '';

      var openLink = rec
        ? '<a class="btn sm" href="' + esc(linkFor(a, rec)) + '" target="_blank" rel="noopener">링크로 열기</a>'
        : '<span class="btn sm" aria-disabled="true">링크로 열기</span>';
      var copyLink = rec
        ? '<button class="btn sm" type="button" data-act="copylink" data-id="' + a.id + '">링크 복사</button>'
        : '<button class="btn sm" type="button" disabled>링크 복사</button>';

      var ed = editState[a.id];
      var isOpen = !!(ed && ed.open);
      var edVal = isOpen ? (ed.value || '') : '';
      var editBox = '<div class="editbox" ' + (isOpen ? '' : 'hidden') + '>'
        + '<input type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" '
        + 'data-act="input" data-id="' + a.id + '" placeholder="예: ' + a.prefix + '-ab12cd34ef" '
        + 'aria-label="' + esc(a.name) + ' 동기화 코드 입력" value="' + esc(edVal) + '" />'
        + '<p class="warn" data-role="warn" data-id="' + a.id + '" hidden></p>'
        + '<div class="erow">'
        + '<button class="btn sm primary" type="button" data-act="save" data-id="' + a.id + '">저장</button>'
        + '<button class="btn sm" type="button" data-act="saveopen" data-id="' + a.id + '">저장하고 열기</button>'
        + '<button class="btn sm" type="button" data-act="clear" data-id="' + a.id + '">기록 지우기</button>'
        + '</div>'
        + '<p class="hint">앱 주소 끝에 <b>?k=코드</b>를 붙여 열면 그 코드로 연결됩니다. 여기 저장한 코드는 이 기기와 내 허브 클라우드에만 들어가고, 공개 소스에는 남지 않아요.</p>'
        + '</div>';

      return '<article class="app" data-id="' + a.id + '" style="--tint:' + a.tint + '">'
        + '<div class="ahead">'
        + '<span class="aico" aria-hidden="true">' + a.icon + '</span>'
        + '<div class="ameta"><h2>' + esc(a.name) + '</h2><p>' + esc(a.desc) + '</p></div>'
        + '<a class="open" href="./' + a.path + '">열기 <span aria-hidden="true">›</span></a>'
        + '</div>'
        + '<p class="stat"><span class="dot ' + stateCls + '"></span><span class="body">' + stateText + '</span></p>'
        + adoptBtn
        + '<div class="coderow">'
        + '<input class="code" type="text" readonly value="' + esc(rec) + '" placeholder="아직 코드 없음" '
        + 'aria-label="' + esc(a.name) + ' 동기화 코드" data-act="pick" data-id="' + a.id + '" />'
        + '<button class="btn sm" type="button" data-act="copy" data-id="' + a.id + '">복사</button>'
        + '</div>'
        + '<div class="acts">'
        + openLink + copyLink
        + '<button class="btn sm" type="button" data-act="edit" data-id="' + a.id + '">코드 변경</button>'
        + '</div>'
        + editBox
        + '</article>';
    }).join('');
    $('#apps').innerHTML = html;
    APPS.forEach(function (a) { updateWarn(a.id); });
  }

  function updateWarn(id) {
    var el = document.querySelector('[data-role="warn"][data-id="' + id + '"]');
    if (!el) return;
    var ed = editState[id];
    var code = parseCode(ed && ed.value);
    var other = otherAppForCode(id, code);
    if (other) {
      el.hidden = false;
      el.innerHTML = '⚠️ ' + esc(other.name) + ' 코드 같아요. 엇갈려 넣으면 두 앱 기록이 섞일 수 있어요.';
    } else {
      el.hidden = true;
      el.textContent = '';
    }
  }

  /* ---------------- events ---------------- */
  function openJoin() { hubOpen = true; renderHub(); var i = $('#joinInput'); if (i) { i.focus(); } }

  function connectHub(code, opts) {
    cfg.ns = code;
    cfg.rev = 0;
    cfg.lastRemoteRev = 0;
    cfg.lastPushTs = 0;
    cfg.lastSync = 0;
    cfg.lastError = '';
    saveCfg();
    hubOpen = false;
    joinValue = '';
    pushedSig = '';
    renderHub();
    return doSync(opts);
  }

  document.addEventListener('click', function (ev) {
    var hbtn = ev.target.closest ? ev.target.closest('[data-hact]') : null;
    if (hbtn) {
      var act = hbtn.getAttribute('data-hact');
      if (act === 'open-join') { openJoin(); return; }
      if (act === 'new') {
        connectHub(HUB_PREFIX + randCode(), { skipRead: true });
        toast('허브 코드를 만들었어요. 코드를 꼭 복사해 두세요');
        return;
      }
      if (act === 'join') {
        var input = $('#joinInput');
        var code = parseCode(input ? input.value : '');
        if (!code) { toast('코드를 확인해 주세요 (예: yujuhub-ab12cd34ef)'); return; }
        if (code.indexOf(HUB_PREFIX) !== 0) {
          toast('허브 코드가 아니에요. yujuhub- 로 시작하는 코드나 허브 링크를 넣어 주세요');
          return;
        }
        connectHub(code);
        toast('허브에 연결했어요');
        return;
      }
      if (act === 'sync') { doSync(); return; }
      if (act === 'copycode') { copyWithToast(cfg.ns); return; }
      if (act === 'copylink') { copyWithToast(baseUrl() + '?k=' + encodeURIComponent(cfg.ns) + '\n' + cfg.ns, '허브 링크를 복사했어요'); return; }
      if (act === 'off') {
        if (!confirm('이 기기에서 허브 클라우드 연결을 끊을까요?\n(코드 목록은 이 기기에 그대로 남고, 앱들의 연결도 그대로예요)')) return;
        cfg.ns = ''; cfg.rev = 0; cfg.lastRemoteRev = 0; cfg.lastPushTs = 0; cfg.lastSync = 0; cfg.lastError = '';
        saveCfg(); pushedSig = ''; renderHub(); renderSum();
        toast('허브 연결을 해제했어요');
        return;
      }
    }

    var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!btn) return;
    var act2 = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');
    if (act2 === 'input' || act2 === 'pick') return;
    var app = appById(id);
    if (!app) return;
    var rec = codeFor(app);
    var dev = readAppCfg(app);

    if (act2 === 'copy') {
      if (!rec) { toast('아직 코드가 없어요'); return; }
      copyWithToast(rec);
      return;
    }
    if (act2 === 'copylink') {
      if (!rec) { toast('아직 코드가 없어요'); return; }
      copyWithToast(linkFor(app, rec) + '\n' + rec, app.name + ' 링크를 복사했어요');
      return;
    }
    if (act2 === 'edit') {
      var cur = editState[id];
      if (cur && cur.open) { editState[id] = { open: false, value: '' }; }
      else { editState[id] = { open: true, value: rec || dev.code || '' }; }
      renderApps();
      var inp = document.querySelector('.editbox input[data-id="' + id + '"]');
      if (inp && editState[id].open) inp.focus();
      return;
    }
    if (act2 === 'adopt') {
      if (!dev.code) return;
      setCode(id, dev.code);
      renderApps(); renderSum();
      toast('이 기기 코드로 기록을 바꿨어요');
      return;
    }
    if (act2 === 'save' || act2 === 'saveopen') {
      var box = document.querySelector('.editbox input[data-id="' + id + '"]');
      var code = parseCode(box ? box.value : '');
      if (!code) { toast('코드를 확인해 주세요 (예: ' + app.prefix + '-ab12cd34ef)'); return; }
      setCode(id, code);
      editState[id] = { open: false, value: '' };
      renderApps(); renderSum();
      toast('코드를 저장했어요');
      if (act2 === 'saveopen') window.open(linkFor(app, code), '_blank', 'noopener');
      return;
    }
    if (act2 === 'clear') {
      if (!confirm(app.name + ' 코드 기록을 지울까요?\n(앱 자체에 저장된 연결은 건드리지 않아요)')) return;
      setCode(id, '');
      editState[id] = { open: false, value: '' };
      renderApps(); renderSum();
      toast('기록을 지웠어요');
      return;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');
    if (act === 'input' && id) {
      if (!editState[id]) editState[id] = { open: true, value: '' };
      editState[id].value = t.value;
      updateWarn(id);
    }
    if (t.id === 'joinInput') joinValue = t.value;
  });

  $('#backupBtn').addEventListener('click', function () {
    var lines = [];
    lines.push('유자 웹앱 링크·동기화 코드 (' + fmtDay() + ')');
    if (cfg.ns) lines.push('허브 동기화 코드: ' + cfg.ns);
    lines.push('');
    APPS.forEach(function (a) {
      var c = codeFor(a);
      lines.push(a.name + ' : ' + (c || '코드 없음'));
      lines.push('  ' + (c ? linkFor(a, c) : baseUrl() + a.path));
    });
    copyWithToast(lines.join('\n'), '전체 코드를 복사했어요');
  });

  /* ---------------- boot ---------------- */
  loadCfg();
  loadData();

  var urlCode = parseCode((location.search || '').match(/[?&]k=([^&]+)/) ? decodeURIComponent((location.search || '').match(/[?&]k=([^&]+)/)[1]) : '');
  var urlHub = urlCode && urlCode.indexOf(HUB_PREFIX) === 0 ? urlCode : '';
  if (urlCode && !urlHub) toast('앱 코드는 각 앱 카드의 [코드 변경]에 넣어 주세요');
  if (urlHub && urlHub !== cfg.ns) {
    cfg.ns = urlHub; cfg.rev = 0; cfg.lastRemoteRev = 0; cfg.lastPushTs = 0; cfg.lastSync = 0; cfg.lastError = '';
    saveCfg();
  }

  if (adoptDeviceCodes()) saveData();

  renderHub();
  renderSum();
  renderApps();

  if (cfg.ns) doSync();

  setInterval(function () {
    if (cfg.ns && !document.hidden) doSync();
  }, 60000);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && cfg.ns) doSync();
  });
})();
</script>
</body>
</html>
