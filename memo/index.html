<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유자 메모 · 채팅 메모장</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="카톡 채팅방처럼 쓰는 개인 메모장 — 방마다 메모·사진·링크, 사진 모아보기, 캘린더, 4자리 PIN 잠금, 클라우드 동기화">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="유자 메모">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#111214; --ink2:#7d848d; --ink3:#aeb4bc;
  --line:#eceef1; --line2:#f3f4f6; --soft:#f4f5f7; --soft2:#fafbfc;
  --yellow:#ffe812; --black:#111214;
  --bad:#d1423a; --good:#1b8a5f;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}

/* ================= 레이아웃 ================= */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:#fff}
.pane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;background:#fff}
.side{background:#fff}
.main{position:relative}
.view{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.view>.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ================= 목록 헤더 ================= */
.listhead{flex:0 0 auto;padding:14px 16px 6px;background:#fff;position:relative;z-index:3}
.lh-row{display:flex;align-items:center;gap:8px}
.lh-row h1{flex:1;margin:0;font-size:24px;font-weight:800;letter-spacing:-.7px}
.lh-act{display:flex;align-items:center;gap:1px}
.ic{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:#23282d}
.ic:active{background:var(--soft)}
.ic svg{width:22px;height:22px;display:block}
.searchrow{display:flex;align-items:center;gap:8px;margin:9px 0 1px;background:var(--soft);border-radius:12px;padding:9px 11px}
.searchrow svg{width:17px;height:17px;color:#8f959c;flex:0 0 17px}
.searchrow input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.searchrow input::placeholder{color:var(--ink3)}
.qclear{width:22px;height:22px;border-radius:50%;background:#dfe2e6;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 22px}
.pctabs{display:flex;gap:3px;background:var(--soft);border-radius:12px;padding:3px;margin:10px 0 0}
.pctabs button{flex:1;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;color:var(--ink2)}
.pctabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
.filterrow{display:flex;align-items:center;gap:8px;padding:10px 0 7px}
.chips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;border-radius:999px;background:var(--soft);color:#4a4f56;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;transition:background .12s,color .12s;-webkit-touch-callout:none;user-select:none}
.chip .c{font-size:11.5px;font-weight:800;color:var(--ink2)}
.chip.on{background:var(--black);color:#fff}
.chip.on .c{color:#fff}
.sortbtn{flex:0 0 auto;display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:#3c4147;padding:8px 2px}
.sortbtn svg{width:14px;height:14px;color:#6f767e}

/* ================= 방 목록 ================= */
.roomlist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 18px}
.roomrow{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0 13px;border-bottom:1px solid var(--line2);align-items:flex-start;transition:background .1s;-webkit-touch-callout:none;user-select:none}
.roomrow:active{background:#fafafa}
.ricon{width:54px;height:54px;border-radius:18px;flex:0 0 54px;display:grid;place-items:center;background:#cfe4f8;color:#33587d}
.ricon svg{width:27px;height:27px;display:block}
.rmain{flex:1;min-width:0;padding-top:1px}
.rtop{display:flex;align-items:baseline;gap:8px}
.rtitle{flex:1;min-width:0;font-size:16.5px;font-weight:750;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.rtitle .pin{font-size:10.5px;line-height:1}
.rtime{flex:0 0 auto;font-size:11.5px;color:var(--ink3);font-weight:600}
.rbot{display:flex;align-items:flex-start;gap:8px;margin-top:3px}
.rprev{flex:1;min-width:0;font-size:14px;color:var(--ink2);line-height:1.36;max-height:2.72em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rprev.ph{color:#9aa1a9}
.rbadge{flex:0 0 auto;min-width:22px;height:22px;border-radius:11px;background:#f0f2f4;color:#5d646c;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 6px;margin-top:2px}
.emptylist{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:54px 22px;text-align:center;color:var(--ink2);flex:1}
.emptylist .big{width:64px;height:64px;border-radius:22px;background:var(--soft);display:grid;place-items:center;color:#9aa1a9}
.emptylist .big svg{width:32px;height:32px}
.emptylist b{font-size:15px;color:var(--ink)}
.emptylist p{margin:0;font-size:12.8px;line-height:1.6;max-width:240px}

/* ================= 하단 탭 ================= */
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;color:#b3b8bf;font-size:11px;font-weight:700}
.tab svg{width:24px;height:24px;display:block}
.tab.on{color:var(--ink)}

/* ================= 채팅방 ================= */
.roomwrap{display:flex;flex-direction:column;height:100%;min-height:0}
.roomhead{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:7px 8px;border-bottom:1px solid var(--line2);background:#fff;z-index:3}
.rhback{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:#23282d;flex:0 0 38px}
.rhback:active{background:var(--soft)}
.rhback svg{width:24px;height:24px}
.rhmenu{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:#23282d;flex:0 0 38px}
.rhmenu:active{background:var(--soft)}
.rhmenu svg{width:22px;height:22px}
.rhtitle{flex:1;min-width:0;text-align:center;padding:0 2px}
.rhtitle b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhtitle small{display:block;font-size:11px;color:var(--ink3);font-weight:600;margin-top:1px}
.pinnedbar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 14px;background:#fffdf0;border-bottom:1px solid #f3ebbe;font-size:12px;color:#7a6413;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.pinnedbar::-webkit-scrollbar{display:none}
.pinnedbar .pinjump{border-radius:999px;background:#fff;border:1px solid #efe6bb;color:#7a6413;font-size:11.5px;font-weight:700;padding:3px 9px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.msgscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px;background:#fff;display:flex;flex-direction:column}
.msgs{margin-top:auto;width:100%}
.msgscroll>.bigempty{margin:auto}
.daysep{display:flex;justify-content:center;margin:10px 0 14px}
.daysep span{background:#f2f4f6;color:#6f767e;font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px}
.msg{display:flex;justify-content:flex-end;margin:0 0 9px}
.mwrap{max-width:82%;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.mflag{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#8a7320;background:#fff8cc;border-radius:999px;padding:2px 7px}
.mline{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.mtime{flex:0 0 auto;font-size:10.5px;color:var(--ink3);font-weight:600;padding-bottom:2px;white-space:nowrap}
.bubble{max-width:100%;background:var(--yellow);border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:14.5px;line-height:1.46;word-break:keep-all;overflow-wrap:anywhere;cursor:pointer;position:relative;transition:box-shadow .12s;-webkit-touch-callout:none;user-select:none}
.bubble:active{box-shadow:0 0 0 2px rgba(17,18,20,.08)}
.bubble .mtext{white-space:pre-wrap}
.bubble .mtext a.ilink{color:#3b3f45;text-decoration:underline;text-underline-offset:2px}
.bubble.photo{background:#fff;border:1px solid #ececec;padding:4px;max-width:74%;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.bubble.photo .mimgwrap{border-radius:13px;overflow:hidden;line-height:0;position:relative;display:block}
.mimgdl{position:absolute;right:6px;top:6px;z-index:2;border:0;border-radius:9px;background:rgba(20,22,26,.62);color:#fff;font-size:10.5px;font-weight:800;padding:6px 8px;line-height:1;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bubble.photo img{display:block;width:100%;max-width:250px;max-height:330px;object-fit:cover;border-radius:13px}
.bubble.photo .cap{padding:6px 8px 5px;white-space:pre-wrap;font-size:13.8px;line-height:1.4}
.bubble.photo .cap .cap-time{display:none}
.bubble.pinned{box-shadow:0 0 0 2px #111 inset}
.linkcard{display:flex;align-items:center;gap:8px;margin-top:7px;background:#fff;border:1px solid #e9eaec;border-radius:11px;padding:8px 10px;text-decoration:none;color:#111;max-width:100%}
.bubble.photo .linkcard{margin:6px 4px 3px}
.linkcard .lg{width:28px;height:28px;border-radius:9px;background:#f4f5f7;display:grid;place-items:center;flex:0 0 28px;font-size:14px}
.linkcard .lt{min-width:0;flex:1}
.linkcard .lt b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:196px}
.linkcard .lt small{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:196px}
.linkcard .ar{margin-left:auto;color:#9aa0a6;font-size:12px;flex:0 0 auto}
.msg.hit .bubble{animation:hit 1.4s ease}
@keyframes hit{0%,100%{box-shadow:0 0 0 3px rgba(255,232,18,0)}20%,60%{box-shadow:0 0 0 3px rgba(17,18,20,.22)}}
.msgend{height:6px}
.composer{flex:0 0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);background:#fff}
.cin{display:flex;align-items:flex-end;gap:7px;width:100%}
.composer .plus{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#3b4046;flex:0 0 36px;background:#f4f5f7;font-size:22px;font-weight:500;line-height:1}
.composer .plus:active{background:#e9ebee}
.composer textarea{flex:1;min-width:0;min-height:38px;max-height:118px;resize:none;border:0;background:#f4f5f7;border-radius:19px;padding:9px 14px;font-size:16px;line-height:1.35;outline:none;overflow-y:auto}
.composer textarea::placeholder{color:var(--ink3)}
.composer .send{width:38px;height:38px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:0 0 38px;color:#111}
.composer .send:disabled{opacity:.35}
.composer .send svg{width:19px;height:19px}

/* ================= 사진 탭 ================= */
.pagehead{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding:13px 16px 8px;background:#fff;border-bottom:1px solid var(--line2)}
.ph-row{display:flex;align-items:center;gap:8px}
.ph-row h2{margin:0;flex:1;font-size:22px;font-weight:800;letter-spacing:-.6px}
.ph-row .cnt{font-size:12px;color:var(--ink2);font-weight:700}
.pfilters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.pfilters::-webkit-scrollbar{display:none}
.pgallery{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 26px;-webkit-overflow-scrolling:touch}
.pgroup{margin-bottom:16px}
.pghead{font-size:12px;font-weight:800;color:#6f767e;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pthumb{aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:#f4f5f7;padding:0;position:relative}
.pthumbwrap{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:#f4f5f7}
.pthumbwrap .pthumb{width:100%;height:100%;aspect-ratio:auto;border-radius:0}
.pthumbdl{position:absolute;right:5px;top:5px;z-index:2;width:27px;height:27px;border:0;border-radius:9px;background:rgba(20,22,26,.66);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb .ptroom{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.52));color:#fff;font-size:9.5px;font-weight:700;padding:12px 5px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:64px 24px;text-align:center;color:var(--ink2)}
.bigempty .big{width:62px;height:62px;border-radius:21px;background:var(--soft);display:grid;place-items:center;color:#9aa1a9}
.bigempty .big svg{width:30px;height:30px}
.bigempty b{font-size:15px;color:var(--ink)}
.bigempty p{margin:0;font-size:12.8px;line-height:1.6;max-width:250px}

/* ================= 캘린더 ================= */
.calwrap{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 28px;-webkit-overflow-scrolling:touch}
.calhead{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0 12px}
.calhead b{font-size:17px;font-weight:800;letter-spacing:-.3px;min-width:132px;text-align:center}
.calnav{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:#3b4046}
.calnav:active{background:var(--soft)}
.calnav svg{width:19px;height:19px}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;font-weight:700;color:var(--ink3);padding-bottom:5px}
.caldow span:nth-child(1){color:#d98d84}
.caldow span:nth-child(7){color:#7f9cc4}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.calcell{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:11px;font-size:13.5px;font-weight:600;color:#2b2f33;background:transparent}
.calcell .num{display:grid;place-items:center;width:26px;height:26px;border-radius:50%}
.calcell.out{color:#cdd2d8}
.calcell.sun{color:#c98a82}
.calcell.sat{color:#7f9cc4}
.calcell.today .num{background:var(--yellow);font-weight:900;color:#111}
.calcell.sel{background:#f2f4f6}
.calcell.sel .num{font-weight:900}
.calcell .dot{width:4.5px;height:4.5px;border-radius:50%;background:#111;opacity:.75}
.calcell.out .dot{opacity:.25}
.calcell .dots{display:flex;gap:2px;height:5px;align-items:center}
.calday{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
.calday h4{margin:0 0 4px;font-size:13px;font-weight:800;color:#4a4f56;display:flex;align-items:center;gap:6px}
.calday h4 span{font-size:11.5px;color:var(--ink3);font-weight:700}
.dayrow{display:flex;gap:10px;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.dr-ico{width:32px;height:32px;border-radius:11px;flex:0 0 32px;display:grid;place-items:center}
.dr-ico svg{width:18px;height:18px}
.dr-main{flex:1;min-width:0}
.dr-top{display:flex;gap:6px;align-items:baseline}
.dr-top b{font-size:12px;font-weight:800;color:#4a4f56;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.dr-top .t{font-size:10.5px;color:var(--ink3);font-weight:600;margin-left:auto;flex:0 0 auto}
.dr-text{font-size:13px;color:#3c4147;line-height:1.4;margin-top:2px;max-height:2.8em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.dr-text.imgonly{color:#9aa1a9}

/* ================= 설정 ================= */
.setwrap{flex:1;min-height:0;overflow-y:auto;padding-bottom:26px;-webkit-overflow-scrolling:touch}
.sethead{padding:13px 16px 6px}
.sethead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px}
.sec{padding:15px 16px;border-bottom:8px solid #f6f7f9}
.sec h3{margin:0 0 9px;font-size:12.5px;font-weight:800;color:#6f767e;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0}
.srow .k{flex:1;min-width:0;font-size:14px}
.srow .v{font-size:12.5px;color:var(--ink2);text-align:right}
.btn{border:1px solid #e4e6ea;background:#fff;border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700;color:#22262a;white-space:nowrap}
.btn:active{background:#f6f7f9}
.btn.primary{background:#111;color:#fff;border-color:#111}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#111}
.btn.danger{color:var(--bad);border-color:#f0d4d1;background:#fdf7f6}
.btn.block{display:block;width:100%;margin-top:7px}
.btnrow{display:flex;gap:7px;margin-top:7px}
.btnrow .btn{flex:1;min-width:0}
.codebox{display:flex;gap:6px;margin-top:7px}
.codebox input{flex:1;min-width:0;border:1px solid #e5e7ea;background:#fafbfc;border-radius:10px;padding:9px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#333}
.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.statepill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px}
.statepill.on{background:#eef8f2;color:#1b8a5f}
.statepill.off{background:#f4f5f7;color:#6f767e}
.help{font-size:11.8px;color:var(--ink2);line-height:1.6;margin:7px 0 0}
.help.warn{color:#8a6120;background:#fbf6e6;border:1px solid #f0e2c2;border-radius:10px;padding:8px 10px}
.meterrow{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:4px}
.meterrow b{color:var(--ink);font-size:13px}
.tg{position:relative;width:44px;height:26px;border-radius:13px;background:#dfe2e6;flex:0 0 44px;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tg.on{background:#111}
.tg.on::after{transform:translateX(18px)}

/* ================= 시트 / 다이얼로그 ================= */
.sheet{position:fixed;inset:0;z-index:96;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,18,20,.36)}
.sheet-panel{width:100%;max-width:520px;max-height:88vh;background:#fff;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .18s ease}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.sheet-head strong{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.sheet-x{width:32px;height:32px;border-radius:50%;background:var(--soft);color:#5d646c;font-size:14px;font-weight:800;display:grid;place-items:center}
.txtbtn{font-size:14px;font-weight:700;color:var(--ink2);padding:6px 4px}
.txtbtn.primary{color:#111}
.sheet-body{padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.act{display:flex;align-items:center;gap:10px;width:100%;padding:14px 2px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line2);text-align:left}
.act:last-child{border-bottom:0}
.act .aico{width:24px;text-align:center;font-size:15px}
.act.danger{color:var(--bad)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:11.5px;font-weight:800;color:#6f767e;margin-bottom:6px}
.input{width:100%;border:1px solid #e4e6ea;border-radius:11px;background:#fff;padding:11px 12px;outline:none;font-size:15px;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:#c9cdd3;box-shadow:0 0 0 3px rgba(17,18,20,.05)}
.input::placeholder{color:#b7bcc3}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;position:relative}
.sw svg{width:20px;height:20px}
.sw.on{box-shadow:0 0 0 2px #111}
.sw.on::after{content:"✓";position:absolute;bottom:-1px;right:-1px;background:#111;color:#fff;font-size:9px;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.dialog{position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(17,18,20,.4)}
.dcard{width:100%;max-width:340px;background:#fff;border-radius:17px;padding:18px 18px 12px;box-shadow:0 20px 44px rgba(0,0,0,.24);animation:up .16s ease}
.dcard h4{margin:0 0 6px;font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.dcard p{margin:0 0 14px;font-size:13px;color:#5d646c;line-height:1.55;white-space:pre-line}
.dactions{display:flex;gap:8px;margin-top:4px}
.dactions .btn{flex:1}

/* ================= 사진 크게 보기 ================= */
.viewer{position:fixed;inset:0;z-index:90;background:#0b0c0d;display:flex;flex-direction:column}
.vhead{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px calc(10px);color:#fff;font-size:12.5px;padding-top:calc(12px + env(safe-area-inset-top))}
.vhead .vhost{flex:1;min-width:0;color:#cfd2d7}
.vhead .vhost b{display:block;color:#fff;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vhead .vhost small{display:block;font-size:11px;color:#9aa0a6;margin-top:1px}
.vclose{width:34px;height:34px;border-radius:50%;background:#1d2024;color:#fff;font-size:14px;display:grid;place-items:center;flex:0 0 34px}
.vimg{flex:1;min-height:0;display:grid;place-items:center;padding:2px 10px}
.vimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.vfoot{flex:0 0 auto;display:flex;gap:9px;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.vfoot button{flex:1;border-radius:12px;padding:12px;font-weight:750;font-size:13.5px;background:#1c1f23;color:#fff;border:1px solid #2a2d32}
.vfoot button.save{background:#FFD84D;color:#1F1A08;border-color:#FFD84D;flex:1.1;font-weight:800}
.vfoot button.danger{color:#ff9a92}

/* ================= 잠금 ================= */
.lock{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock-ico{width:64px;height:64px;border-radius:22px;background:var(--yellow);display:grid;place-items:center;font-size:28px}
.lock h2{margin:2px 0 0;font-size:18px;font-weight:800;letter-spacing:-.4px;text-align:center}
.lock .sub{margin:0;font-size:12.5px;color:var(--ink2);text-align:center}
.dots{display:flex;gap:13px;margin:8px 0 0}
.dots .dt{width:12px;height:12px;border-radius:50%;border:2px solid #d8dbe0;background:#fff;transition:.12s}
.dots .dt.on{background:#111;border-color:#111;transform:scale(1.06)}
.lock-msg{font-size:12.5px;color:var(--bad);height:18px;text-align:center}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.key{height:58px;border-radius:17px;background:#f5f6f8;font-size:21px;font-weight:700;letter-spacing:-.5px}
.key:active{background:#e8eaee}
.key.blank{background:transparent;pointer-events:none}
.key.del{font-size:17px;color:#5d646c}
.lock-help{border:0;background:transparent;color:var(--ink3);font-size:11.5px;text-decoration:underline;margin-top:2px}
.lock.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ================= 토스트 ================= */
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);opacity:0;pointer-events:none;background:#1c1e21;color:#fff;font-size:12.5px;line-height:1.4;padding:9px 15px;border-radius:999px;max-width:86vw;text-align:center;z-index:150;transition:opacity .18s,transform .18s;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= PC 오른쪽 빈 화면 ================= */
.mainhint{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--ink2);padding:30px;background:#fcfcfd}
.mainhint .logo{width:74px;height:74px;border-radius:26px;background:var(--yellow);display:grid;place-items:center}
.mainhint .logo svg{width:38px;height:38px}
.mainhint b{font-size:18px;color:var(--ink);letter-spacing:-.4px}
.mainhint p{margin:0;font-size:13px;line-height:1.6;max-width:290px}
.mainhint .btn{margin-top:4px}

/* ================= PC ================= */
@media (min-width:900px){
  body{background:#f2f3f5}
  .app{flex-direction:row;height:100vh}
  .side{flex:0 0 392px;width:392px;border-right:1px solid var(--line)}
  .main{flex:1 1 auto;min-width:0}
  .tabbar{display:none}
  .listhead{padding:18px 18px 8px}
  .lh-row h1{font-size:26px}
  .roomlist{padding:0 14px 18px}
  .composer{padding-bottom:10px}
  .cin{max-width:720px;margin:0 auto}
  .msgscroll{padding:14px 10px 8px}
  .msgs{max-width:720px;margin-left:auto;margin-right:auto;padding:0 14px}
  .bubble{max-width:100%}
  .mwrap{max-width:460px}
  .bubble.photo{max-width:100%}
  .bubble.photo img{max-height:400px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .pgallery{padding:14px 22px 26px}
  .pagehead{padding:16px 22px 10px}
  .calwrap{padding:10px 26px 30px}
  .calcell{aspect-ratio:auto;height:64px}
  .setwrap{max-width:640px;margin:0 auto;width:100%}
  .sheet{align-items:center;padding:26px}
  .sheet-panel{border-radius:20px;max-height:84vh}
  .viewer .vimg{padding:2px 30px}
}
@media (max-width:899px){
  .composer textarea,.searchrow input,.input{font-size:16px}
  .pctabs{display:none!important}
}
</style>
